<template>
    <template if:true={visible}>
        <div class="mov">
            <template if:true={cargando}>
                <div class="mov-cargando"><lightning-spinner alternative-text="Procesando" size="small"></lightning-spinner></div>
            </template>

            <div class="mov-encabezado">
                <div>
                    <h3 class="mov-titulo">{titulo}</h3>
                    <p class="mov-subtitulo">{subtitulo}</p>
                </div>
                <template if:true={enOportunidad}>
                    <lightning-button label={textoAbrir} onclick={toggleAbierto}></lightning-button>
                </template>
            </div>

            <template if:true={errorMensaje}>
                <div class="mov-error" role="alert">
                    <lightning-icon icon-name="utility:error" variant="error" size="x-small"></lightning-icon>
                    <span>{errorMensaje}</span>
                </div>
            </template>

            <template if:true={mostrarCuerpo}>
                <div class="mov-stats">
                    <div class="stat"><span class="stat-num">{totalVigentes}</span><span class="stat-lbl">Vigentes</span></div>
                    <div class="stat"><span class="stat-num">{valorVigentes}</span><span class="stat-lbl">Valor asegurado</span></div>
                    <div class="stat"><span class="stat-num">{primaVigentes}</span><span class="stat-lbl">Prima</span></div>
                    <template if:true={enPoliza}>
                        <div class="stat stat-baja"><span class="stat-num">{totalBajas}</span><span class="stat-lbl">Dados de baja</span></div>
                    </template>
                </div>

                <!-- ====================== LISTA ====================== -->
                <template if:true={enLista}>
                    <template if:true={puedeTraer}>
                        <div class="mov-aviso">
                            <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                            <span>Si el ejecutivo arma la renovación, parte de los vehículos vigentes de la póliza anterior y después aplica las altas, bajas y cambios.
                                Si la aseguradora mandó el listado nuevo, usa «Cargar archivo».</span>
                            <lightning-button label={textoTraer} icon-name="utility:download" onclick={handleTraer}></lightning-button>
                        </div>
                    </template>

                    <div class="mov-barra">
                        <div class="mov-filtros">
                            <lightning-input type="search" label="Buscar" variant="label-hidden" placeholder="Buscar por inciso, serie, placas o vehículo"
                                value={busqueda} onchange={handleBusqueda} class="mov-buscar"></lightning-input>
                            <template if:true={enPoliza}>
                                <lightning-combobox label="Mostrar" variant="label-hidden" value={filtro} options={opcionesFiltro}
                                    onchange={handleFiltro} class="mov-filtro"></lightning-combobox>
                            </template>
                        </div>
                        <div class="mov-acciones">
                            <template if:true={puedeEditar}>
                                <lightning-button label="Alta de vehículo" icon-name="utility:add" onclick={abrirAlta}></lightning-button>
                                <lightning-button label={textoBajaSeleccion} icon-name="utility:delete" variant="destructive-text"
                                    onclick={abrirBaja} disabled={sinSeleccion}></lightning-button>
                                <lightning-button label="Cargar archivo" icon-name="utility:upload" onclick={verArchivo}></lightning-button>
                            </template>
                            <lightning-button label={textoHistorial} icon-name="utility:history" onclick={verHistorial}></lightning-button>
                        </div>
                    </div>

                    <template if:true={sinVehiculos}>
                        <div class="mov-vacio">
                            <lightning-icon icon-name="utility:travel_and_places" size="small"></lightning-icon>
                            <p>No hay vehículos todavía.</p>
                        </div>
                    </template>
                    <template if:false={sinVehiculos}>
                        <div class="mov-scroll">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                <thead>
                                    <tr class="slds-line-height_reset">
                                        <th scope="col" class="col-check"></th>
                                        <th scope="col">Inciso</th>
                                        <th scope="col">Vehículo</th>
                                        <th scope="col">Modelo</th>
                                        <th scope="col">Placas</th>
                                        <th scope="col">Uso</th>
                                        <th scope="col">Alta</th>
                                        <th scope="col" class="num">Valor</th>
                                        <th scope="col" class="num">Prima</th>
                                        <th scope="col">Estado</th>
                                        <th scope="col" class="col-acciones"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template for:each={filas} for:item="v">
                                        <tr key={v.id} class={v.claseFila}>
                                            <td class="col-check">
                                                <template if:false={v.noSeleccionable}>
                                                    <input type="checkbox" data-id={v.id} checked={v.seleccionado} onchange={handleSeleccion}
                                                        aria-label="Seleccionar vehículo" />
                                                </template>
                                            </td>
                                            <td>{v.inciso}</td>
                                            <td>
                                                <div class="nombre">{v.descripcion}</div>
                                                <div class="sub">{v.serie}</div>
                                            </td>
                                            <td>{v.modelo}</td>
                                            <td>{v.placas}</td>
                                            <td>{v.uso}</td>
                                            <td>{v.altaTxt}</td>
                                            <td class="num">{v.valorTxt}</td>
                                            <td class="num">{v.primaTxt}</td>
                                            <td>
                                                <span class={v.claseEstado}>{v.estado}</span>
                                                <template if:true={v.motivoBaja}><div class="sub">{v.motivoBaja}</div></template>
                                            </td>
                                            <td class="col-acciones">
                                                <template if:true={v.puedeMover}>
                                                    <lightning-button-icon icon-name="utility:edit" alternative-text="Cambiar datos" title="Cambiar datos"
                                                        data-id={v.id} onclick={abrirCambio} size="small"></lightning-button-icon>
                                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Dar de baja" title="Dar de baja"
                                                        data-id={v.id} onclick={abrirBaja} size="small" class="slds-m-left_xx-small"></lightning-button-icon>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                        <div class="mov-paginacion">
                            <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Anterior" onclick={anterior} disabled={sinAnterior}></lightning-button-icon>
                            <span>{textoPagina}</span>
                            <lightning-button-icon icon-name="utility:chevronright" alternative-text="Siguiente" onclick={siguiente} disabled={sinSiguiente}></lightning-button-icon>
                        </div>
                    </template>
                </template>

                <!-- ====================== ARCHIVO ====================== -->
                <template if:true={enArchivo}>
                    <div class="mov-paso">
                        <lightning-radio-group label="¿Qué trae el archivo?" options={opcionesCenso} value={censoCompleto}
                            onchange={handleCensoCompleto} type="button"></lightning-radio-group>
                    </div>
                    <c-censo-vehiculos modo="lector" onleido={handleLeido}></c-censo-vehiculos>
                    <div class="mov-pie">
                        <lightning-button label="Regresar" icon-name="utility:back" onclick={verLista}></lightning-button>
                    </div>
                </template>

                <!-- ====================== REVISIÓN DEL ARCHIVO ====================== -->
                <template if:true={enRevision}>
                    <div class="mov-paso">
                        <strong>Diferencias de {archivoNombre} contra los vehículos vigentes</strong>
                        <p class="sub">{textoSinCambios} Los vehículos se reconocen por serie (o por placas si el renglón no trae serie). Desmarca lo que no quieras aplicar.</p>
                    </div>

                    <template if:true={sinDiferencias}>
                        <div class="mov-vacio"><p>El archivo coincide con los vehículos vigentes: no hay movimientos.</p></div>
                    </template>

                    <template if:false={sinDiferencias}>
                        <div class="slds-grid slds-wrap slds-gutters_x-small modal-form">
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input type="date" label={etiquetaFecha} value={comun.fecha} data-campo="fecha" onchange={handleComun} required></lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input label="Número de endoso" value={comun.endoso} data-campo="endoso" onchange={handleComun}></lightning-input>
                            </div>
                            <template if:true={hayBajas}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                    <lightning-combobox label="Motivo de baja (general)" value={comun.motivo} options={motivos}
                                        data-campo="motivo" onchange={handleComun} placeholder="Selecciona"></lightning-combobox>
                                </div>
                            </template>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-input label="Comentario" value={comun.comentario} data-campo="comentario" onchange={handleComun} max-length="255"></lightning-input>
                            </div>
                        </div>

                        <template if:true={hayBajas}>
                            <h4 class="mov-seccion seccion-baja">{textoBajas}</h4>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="bajas" checked onchange={marcarTodos} aria-label="Todas" /></th>
                                        <th>Inciso</th><th>Vehículo</th><th>Placas</th><th>Motivo (si es distinto al general)</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={bajasRev} for:item="b">
                                            <tr key={b.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="bajas" data-key={b.key} checked={b.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{b.inciso}</td>
                                                <td><div class="nombre">{b.descripcion}</div><div class="sub">{b.serie}</div></td>
                                                <td>{b.placas}</td>
                                                <td class="col-motivo">
                                                    <lightning-combobox label="Motivo" variant="label-hidden" value={b.motivo} options={motivos}
                                                        data-key={b.key} onchange={motivoBaja} placeholder="General"></lightning-combobox>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:true={hayAltas}>
                            <h4 class="mov-seccion seccion-alta">{textoAltas}</h4>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="altas" checked onchange={marcarTodos} aria-label="Todas" /></th>
                                        <th>Inciso</th><th>Vehículo</th><th>Modelo</th><th>Placas</th><th class="num">Valor</th><th class="num">Prima</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={altasRev} for:item="a">
                                            <tr key={a.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="altas" data-key={a.key} checked={a.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{a.inciso}</td>
                                                <td><div class="nombre">{a.descripcion}</div><div class="sub">{a.serie}</div></td>
                                                <td>{a.modelo}</td>
                                                <td>{a.placas}</td>
                                                <td class="num">{a.valorTxt}</td>
                                                <td class="num">{a.primaTxt}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:true={hayCambios}>
                            <h4 class="mov-seccion seccion-cambio">{textoCambios}</h4>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="cambios" checked onchange={marcarTodos} aria-label="Todos" /></th>
                                        <th>Inciso</th><th>Vehículo</th><th>Cambios</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={cambiosRev} for:item="c">
                                            <tr key={c.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="cambios" data-key={c.key} checked={c.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{c.inciso}</td>
                                                <td><div class="nombre">{c.descripcion}</div><div class="sub">{c.serie}</div></td>
                                                <td>
                                                    <template for:each={c.difs} for:item="d"><div key={d.key}>{d.texto}</div></template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </template>

                    <div class="mov-pie">
                        <lightning-button label="Cancelar" onclick={verLista}></lightning-button>
                        <lightning-button label="Cargar otro archivo" onclick={verArchivo}></lightning-button>
                        <template if:false={sinDiferencias}>
                            <lightning-button label="Aplicar movimientos" variant="brand" icon-name="utility:check" onclick={aplicarRevision}></lightning-button>
                        </template>
                    </div>
                </template>

                <!-- ====================== HISTORIAL ====================== -->
                <template if:true={enHistorial}>
                    <template if:true={sinHistorial}>
                        <div class="mov-vacio"><p>Aún no hay movimientos registrados.</p></div>
                    </template>
                    <template if:false={sinHistorial}>
                        <div class="mov-scroll">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                <thead><tr>
                                    <th>Movimiento</th><th>Tipo</th><th>Fecha</th><th>Vehículo</th><th>Inciso</th><th>Endoso</th><th>Detalle</th><th>Usuario</th>
                                </tr></thead>
                                <tbody>
                                    <template for:each={historial} for:item="h">
                                        <tr key={h.id}>
                                            <td>{h.nombre}</td>
                                            <td><span class={h.claseTipo}>{h.tipo}</span></td>
                                            <td>{h.fechaTxt}</td>
                                            <td>{h.asegurado}</td>
                                            <td>{h.certificado}</td>
                                            <td>{h.endoso}</td>
                                            <td class="detalle">{h.detalleTxt}</td>
                                            <td>{h.usuario}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <div class="mov-pie">
                        <lightning-button label="Regresar" icon-name="utility:back" onclick={verLista}></lightning-button>
                    </div>
                </template>
            </template>

            <!-- ====================== MODALES ====================== -->
            <template if:true={hayModal}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <template if:true={enModalBaja}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Baja de vehículos</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <p class="sub slds-m-bottom_x-small">{textoBaja}</p>
                                <ul class="mov-lista">
                                    <template for:each={bajaNombres} for:item="n"><li key={n.id}>{n.texto}</li></template>
                                </ul>
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input type="date" label="Fecha de baja" value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-combobox label="Motivo de baja" value={form.motivo} options={motivos} data-campo="motivo"
                                            onchange={handleForm} placeholder="Selecciona" required></lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Comentario" value={form.comentario} data-campo="comentario" onchange={handleForm} max-length="255"></lightning-input>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Dar de baja" variant="destructive" class="slds-m-left_x-small" onclick={guardarBaja}></lightning-button>
                            </div>
                        </template>

                        <template if:true={enModalAlta}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Alta de vehículo</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_2-of-3">
                                        <lightning-input label="Serie (VIN)" value={form.serie} data-campo="serie" onchange={handleForm} required
                                            max-length="30" field-level-help="Identifica al vehículo; un VIN tiene 17 caracteres."></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" label="Inciso" value={form.inciso} data-campo="inciso" onchange={handleForm}
                                            field-level-help="Si lo dejas vacío se usa el siguiente número."></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Descripción (marca, submarca, versión)" value={form.descripcion} data-campo="descripcion" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" label="Modelo (año)" value={form.modelo} data-campo="modelo" onchange={handleForm} min="1900" max="2100"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Placas" value={form.placas} data-campo="placas" onchange={handleForm} max-length="20"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Uso" value={form.uso} data-campo="uso" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-combobox label="Tipo de vehículo" value={form.tipoVehiculo} options={opcionesTipo} data-campo="tipoVehiculo"
                                            onchange={handleForm} placeholder="Selecciona"></lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Paquete" value={form.paquete} data-campo="paquete" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Valor" value={form.valor}
                                            data-campo="valor" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Prima" value={form.prima}
                                            data-campo="prima" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label={etiquetaFecha} value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Dar de alta" variant="brand" class="slds-m-left_x-small" onclick={guardarAlta}></lightning-button>
                            </div>
                        </template>

                        <template if:true={enModalCambio}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Cambio de datos: {form.nombreActual}</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_2-of-3">
                                        <lightning-input label="Serie (VIN)" value={form.serie} data-campo="serie" onchange={handleForm} max-length="30"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" label="Inciso" value={form.inciso} data-campo="inciso" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Descripción" value={form.descripcion} data-campo="descripcion" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" label="Modelo (año)" value={form.modelo} data-campo="modelo" onchange={handleForm} min="1900" max="2100"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Placas" value={form.placas} data-campo="placas" onchange={handleForm} max-length="20"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Uso" value={form.uso} data-campo="uso" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-combobox label="Tipo de vehículo" value={form.tipoVehiculo} options={opcionesTipo} data-campo="tipoVehiculo"
                                            onchange={handleForm} placeholder="Selecciona"></lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Paquete" value={form.paquete} data-campo="paquete" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Valor" value={form.valor}
                                            data-campo="valor" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Prima" value={form.prima}
                                            data-campo="prima" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label={etiquetaFecha} value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Comentario" value={form.comentario} data-campo="comentario" onchange={handleForm} max-length="255"></lightning-input>
                                    </div>
                                </div>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Guardar cambio" variant="brand" class="slds-m-left_x-small" onclick={guardarCambio}></lightning-button>
                            </div>
                        </template>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>
        </div>
    </template>
</template>
