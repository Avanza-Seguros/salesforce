<template>
    <template if:true={open}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
            <div class="slds-modal__container" style="width:95%; max-width:95rem;">

                <!-- HEADER -->
                <header class="slds-modal__header">
                    <lightning-button-icon
                        icon-name="utility:close"
                        alternative-text="Cerrar"
                        onclick={close}
                        class="slds-modal__close">
                    </lightning-button-icon>
                    <h2 class="slds-text-heading_medium">
                        Pagos de la Póliza {numeroPoliza}
                    </h2>
                </header>

                <!-- BODY -->
                <div class="slds-modal__content slds-p-around_medium" style="height:70vh; overflow:auto;">
                    <lightning-datatable
                        key-field="id"
                        data={pagos}
                        columns={columns}
                        draft-values={draftValues}
                        onsave={handleSave}
                        hide-checkbox-column
                        is-loading={loading}>
                    </lightning-datatable>
                </div>

                <!-- FOOTER -->
                <footer class="slds-modal__footer">
                    <lightning-button label="Cerrar" onclick={close}></lightning-button>
                </footer>

            </div>
        </section>

        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

</template>
