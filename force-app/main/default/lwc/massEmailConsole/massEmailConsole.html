<template>
    <lightning-card title="Envío Masivo de Correos">
        <div class="slds-p-around_medium">
            <!-- Dashboard -->
            <lightning-layout horizontal-align="spread" class="slds-var-m-bottom_medium">
                <lightning-layout-item>
                    <lightning-badge label="Pendientes" class="badge badge-warning"></lightning-badge>
                    <p class="metric">{pending}</p>
                </lightning-layout-item>
                <lightning-layout-item>
                    <lightning-badge label="Enviados hoy" class="badge badge-success"></lightning-badge>
                    <p class="metric">{sentToday}</p>
                </lightning-layout-item>
            </lightning-layout>

            <!-- Modo de selección -->
            <div class="slds-var-m-bottom_medium">
                <lightning-radio-group
                    label="Modo de selección"
                    options={selectionOptions}
                    value={selectionMode}
                    type="radio"
                    onchange={handleSelectionModeChange}>
                </lightning-radio-group>
            </div>

            <!-- Selector de casos (solo visible en modo manual) -->
            <template if:true={showCaseSelector}>
                <div class="slds-var-m-bottom_large">
                    <lightning-combobox
                        name="cases"
                        label="Seleccionar Casos"
                        placeholder="Buscar casos..."
                        value={selectedCaseIds}
                        options={caseOptions}
                        onchange={handleCaseSelection}
                        multiple>
                    </lightning-combobox>
                </div>
            </template>

            <!-- Botones de acción -->
            <div class="slds-var-m-top_large">
                <lightning-button 
                    label="Ejecutar envío masivo"
                    variant="brand"
                    onclick={handleRun}
                    disabled={isRunDisabled}>
                </lightning-button>
                <lightning-button 
                    label="Actualizar"
                    class="slds-var-m-left_small"
                    variant="neutral"
                    onclick={refreshData}
                    disabled={loading}>
                </lightning-button>
            </div>

            <!-- Loading -->
            <template if:true={loading}>
                <div class="slds-var-m-top_medium">
                    <lightning-spinner alternative-text="Cargando..."></lightning-spinner>
                </div>
            </template>

            <!-- Status -->
            <template if:true={status}>
                <p class="slds-var-m-top_medium" 
                   class:status-success={isSuccess}
                   class:status-error={isError}>
                    {status}
                </p>
            </template>

            <!-- Casos seleccionados (solo modo manual) -->
            <template if:true={casosSeleccionados}> 
                <div class="slds-var-m-top_large">
                    <h3 class="slds-text-heading_small slds-var-m-bottom_small">
                        Casos Seleccionados ({selectedCases.length})
                    </h3>
                    <div class="selected-cases-container">
                        <template for:each={selectedCases} for:item="caseItem">
                            <div key={caseItem.Id} class="selected-case slds-p-around_small">
                                <lightning-icon icon-name="standard:case" size="small"></lightning-icon>
                                <span class="slds-var-m-left_xsmall">{caseItem.CaseNumber}: {caseItem.Subject}</span>
                                <lightning-button-icon 
                                    icon-name="utility:close" 
                                    alternative-text="Remover"
                                    onclick={removeCase}
                                    data-id={caseItem.Id}>
                                </lightning-button-icon>
                            </div>
                        </template>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
