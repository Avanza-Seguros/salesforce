<template>
    <div class="portal">
        <!-- ===== Vista previa de administrador (solo usuarios internos con permiso) ===== -->
        <template lwc:if={puedeVista}>
            <div class="admin">
                <template lwc:if={cuentaVistaPrevia}>
                    <span><b class="k">Vista previa de administrador</b>Viendo la página como un usuario de <b>{nombreVistaPrevia}</b></span>
                    <button class="admin_cambiar" onclick={handleCambiarCuenta}>Cambiar cuenta</button>
                </template>
                <template lwc:else>
                    <div class="admin_buscar">
                        <b class="k">Vista previa de administrador</b>
                        <lightning-input
                            type="search"
                            label="Cuenta del cliente"
                            placeholder="Escribe al menos 2 letras del nombre de la cuenta"
                            value={textoCuenta}
                            onchange={handleTextoCuenta}
                            is-loading={buscandoCuentas}
                        ></lightning-input>
                        <div lwc:if={errorCuentas} class="aviso aviso_error" role="alert">{errorCuentas}</div>
                        <p lwc:if={sinCuentasEncontradas} class="muted">No hay cuentas titulares de pólizas con ese nombre.</p>
                        <ul lwc:if={hayCuentasEncontradas} class="admin_cuentas">
                            <template for:each={cuentasEncontradas} for:item="c">
                                <li key={c.id}>
                                    <button class="admin_cuenta" data-id={c.id} data-nombre={c.nombre} onclick={handleElegirCuenta}>
                                        <span class="nm">{c.nombre}</span>
                                        <span class="sb">{c.detalle}</span>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </div>
                </template>
            </div>
        </template>

        <!-- ===== Listado ===== -->
        <template lwc:if={enListado}>
            <section class="hero">
                <div class="hero-main">
                    <div class="hero-row">
                        <div class="hero-ic">
                            <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>
                        </div>
                        <div>
                            <div class="eyebrow">{eyebrowListado}</div>
                            <h1 class="h1">Tus pólizas</h1>
                        </div>
                    </div>
                    <p lwc:if={hayPolizas}>Tienes <b>{textoVigentesHero}</b>. Abre cada una para ver su información, asegurados, pagos y documentos.</p>
                </div>
                <div lwc:if={hayPolizas} class="hero-side">
                    <div class={claseGlassVigentes}>
                        <div class="l">Vigentes</div>
                        <div class="n">{totalVigentes}</div>
                        <div class="s">{textoDePolizas}</div>
                    </div>
                    <div lwc:if={primaEnVigorTexto} class="glass">
                        <div class="l">Prima en vigor</div>
                        <div class="n">{primaEnVigorTexto}</div>
                        <div class="s">suma de sus primas</div>
                    </div>
                </div>
            </section>

            <template lwc:if={esperandoCuenta}>
                <div class="empty">Elige una cuenta arriba para ver la página como la vería ese cliente.</div>
            </template>
            <template lwc:elseif={cargando}>
                <div class="cargando"><lightning-spinner alternative-text="Cargando pólizas" size="medium"></lightning-spinner></div>
            </template>
            <template lwc:elseif={error}>
                <div class="aviso aviso_error" role="alert">{error}</div>
            </template>
            <template lwc:elseif={hayPolizas}>
                <section class="card">
                    <div class="toolbar">
                        <label class="search">
                            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
                            <input type="search" aria-label="Buscar pólizas" placeholder="Buscar por número, ramo, aseguradora o bien asegurado"
                                value={busqueda} oninput={handleBusqueda} />
                        </label>
                        <div class="seg" role="group" aria-label="Filtro de vigencia">
                            <template for:each={opcionesFiltro} for:item="o">
                                <button key={o.value} class={o.clase} data-value={o.value} aria-pressed={o.presionado} onclick={handleFiltro}>
                                    {o.label}<span lwc:if={o.hayCuenta} class="cnt">{o.cuenta}</span>
                                </button>
                            </template>
                        </div>
                    </div>

                    <template lwc:if={sinResultados}>
                        <div class="empty">No hay pólizas que coincidan con tu búsqueda.</div>
                    </template>
                    <div lwc:else class="tbox">
                        <table>
                            <thead>
                                <tr><th>Póliza</th><th>Ramo · Aseguradora</th><th>Estado</th><th>Vigencia</th><th class="r">Prima</th><th><span class="oculto">Acciones</span></th></tr>
                            </thead>
                            <tbody>
                                <template for:each={polizasFiltradas} for:item="p">
                                    <tr key={p.id}>
                                        <td>
                                            <div class="who">
                                                <span class="chip" aria-hidden="true">{p.chip}</span>
                                                <div>
                                                    <div class="nm"><button class="link link_poliza" data-id={p.id} onclick={handleAbrir} title={p.textoAbrir}>Póliza {p.numero}</button></div>
                                                    <div lwc:if={p.subPoliza} class="sb ell" title={p.subPoliza}>{p.subPoliza}</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="nm nm_ramo">{p.ramoTexto}</div>
                                            <div lwc:if={p.aseguradora} class="sb">{p.aseguradora}</div>
                                        </td>
                                        <td>
                                            <span class={p.estadoClase}><span class="dot"></span>{p.estadoTexto}</span>
                                            <div lwc:if={p.tieneVencido} class="sb texto_error">Pago vencido: {p.montoVencidoTexto}</div>
                                        </td>
                                        <td>{p.vigencia}</td>
                                        <td class="r money">{p.primaTexto}</td>
                                        <td class="r">
                                            <button class="link" data-id={p.id} onclick={handleAbrir} aria-label={p.textoAbrir}>Ver detalle ›</button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </section>
            </template>
            <template lwc:else>
                <div class="empty">{mensajeVacio}</div>
            </template>
        </template>

        <!-- ===== Detalle ===== -->
        <template lwc:else>
            <button class="back" onclick={handleRegresar}>
                <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
                Regresar a mis pólizas
            </button>

            <template lwc:if={cargandoDetalle}>
                <div class="cargando"><lightning-spinner alternative-text="Cargando póliza" size="medium"></lightning-spinner></div>
            </template>
            <template lwc:elseif={errorDetalle}>
                <div class="aviso aviso_error" role="alert">{errorDetalle}</div>
            </template>
            <template lwc:elseif={detalle}>
                <section class="hero">
                    <div class="hero-main">
                        <div class="hero-row">
                            <div class="hero-ic">
                                <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"></path></svg>
                            </div>
                            <div>
                                <div class="eyebrow">{detalle.poliza.titulo}</div>
                                <h1 class="h1">Póliza {detalle.poliza.numero}</h1>
                            </div>
                        </div>
                        <div class="hero-linea">
                            <span class="badge hero-badge"><span class={detalle.poliza.heroPunto}></span>{detalle.poliza.estadoTexto}</span>
                            <span lwc:if={detalle.poliza.lineaHero} class="hero-texto">{detalle.poliza.lineaHero}</span>
                        </div>
                    </div>
                    <div class="hero-side">
                        <div class={claseGlassPrima}>
                            <div class="l">Prima total</div>
                            <div class="n">{detalle.poliza.primaTexto}</div>
                            <div lwc:if={detalle.poliza.formaPagoMoneda} class="s">{detalle.poliza.formaPagoMoneda}</div>
                        </div>
                        <template lwc:if={detalle.poliza.tieneVencido}>
                            <div class="glass">
                                <div class="l">Pago vencido</div>
                                <div class="n">{detalle.poliza.montoVencidoTexto}</div>
                                <div class="s">contacta a tu asesor</div>
                            </div>
                        </template>
                        <template lwc:elseif={detalle.poliza.montoPorPagarTexto}>
                            <div class="glass">
                                <div class="l">Por pagar</div>
                                <div class="n">{detalle.poliza.montoPorPagarTexto}</div>
                                <div class="s">pendiente de la vigencia</div>
                            </div>
                        </template>
                        <div class="glass wide">
                            <div class="l">Vigencia</div>
                            <div class="n n_vigencia">{detalle.poliza.vigencia}</div>
                            <div lwc:if={detalle.poliza.proximoPago} class="s">Próximo pago: {detalle.poliza.proximoPagoTexto}</div>
                        </div>
                    </div>
                </section>

                <div lwc:if={detalle.poliza.tieneVencido} class="aviso aviso_alerta" role="status">
                    Tienes un pago vencido por {detalle.poliza.montoVencidoTexto}. Contacta a tu asesor para regularizarlo.
                </div>

                <!-- Mismas pestañas que la página de la póliza en Salesforce -->
                <div class="tabs" role="tablist" aria-label="Secciones de la póliza">
                    <template for:each={opcionesPestanas} for:item="o">
                        <button key={o.value} class={o.clase} role="tab" data-value={o.value} aria-selected={o.presionado}
                            onclick={handlePestana}>
                            <span class="dot" style={o.estiloPunto}></span>{o.label}
                        </button>
                    </template>
                </div>

                <!-- Información Póliza -->
                <section lwc:if={verInfo} class="card" role="tabpanel">
                    <template lwc:if={pestanaInfo.cargando}>
                        <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                    </template>
                    <div lwc:elseif={pestanaInfo.error} class="aviso aviso_error" role="alert">{pestanaInfo.error}</div>
                    <template lwc:elseif={pestanaInfo.datos}>
                        <template for:each={pestanaInfo.datos.secciones} for:item="sec">
                            <div key={sec.titulo} class="bloque">
                                <h3 class="sec">{sec.titulo}</h3>
                                <dl class="fields">
                                    <template for:each={sec.campos} for:item="c">
                                        <div key={c.etiqueta} class={c.clase}><dt class="l">{c.etiqueta}</dt><dd class="v">{c.valor}</dd></div>
                                    </template>
                                </dl>
                            </div>
                        </template>
                    </template>

                    <div class="bloque">
                        <h3 class="sec">Documentos</h3>
                        <template lwc:if={hayDocumentos}>
                            <div lwc:if={errorDescarga} class="aviso aviso_error" role="alert">{errorDescarga}</div>
                            <ul class="documentos">
                                <template for:each={documentosVista} for:item="d">
                                    <li key={d.id}>
                                        <template lwc:if={d.porApex}>
                                            <button class="documento" data-id={d.id} onclick={handleDescargar} disabled={d.descargando}>
                                                <span class="fic" aria-hidden="true">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>
                                                </span>
                                                <span class="documento_nombre">{d.nombre}</span>
                                                <span class="documento_meta">{d.tamanoTexto}</span>
                                                <span class="documento_bajar">{d.textoBoton}</span>
                                            </button>
                                        </template>
                                        <template lwc:else>
                                            <a href={d.url} target="_blank" rel="noopener" class="documento">
                                                <span class="fic" aria-hidden="true">
                                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6v18h12V7z"></path><path d="M14 3v4h4"></path></svg>
                                                </span>
                                                <span class="documento_nombre">{d.nombre}</span>
                                                <span class="documento_meta">{d.tamanoTexto}</span>
                                                <span class="documento_bajar">Descargar</span>
                                            </a>
                                        </template>
                                    </li>
                                </template>
                            </ul>
                        </template>
                        <div lwc:else class="empty">No hay documentos disponibles para esta póliza.</div>
                    </div>
                </section>

                <!-- Pagos -->
                <div lwc:if={verPagos} class="panel" role="tabpanel">
                    <template lwc:if={pestanaPagos.cargando}>
                        <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                    </template>
                    <div lwc:elseif={pestanaPagos.error} class="aviso aviso_error" role="alert">{pestanaPagos.error}</div>
                    <template lwc:elseif={pestanaPagos.datos}>
                        <template lwc:if={pestanaPagos.datos.hayCuotas}>
                            <div class="grid g3">
                                <div class="stage">
                                    <div class="hd">Total de la póliza<span class="dot dot_azul"></span></div>
                                    <div class="n">{pestanaPagos.datos.totalImporteTexto}</div>
                                    <div class="s">suma de las cuotas</div>
                                    <div class="bar"><i class="bar_azul" style={pestanaPagos.datos.barraTotal}></i></div>
                                </div>
                                <div class="stage">
                                    <div class="hd">Pagado<span class="dot dot_verde"></span></div>
                                    <div class="n">{pestanaPagos.datos.totalPagadoTexto}</div>
                                    <div class="s">aplicado a la fecha</div>
                                    <div class="bar"><i class="bar_verde" style={pestanaPagos.datos.barraPagado}></i></div>
                                </div>
                                <div class="stage">
                                    <div class="hd">Pendiente<span class="dot dot_ambar"></span></div>
                                    <div class="n">{pestanaPagos.datos.totalPendienteTexto}</div>
                                    <div class="s">por pagar</div>
                                    <div class="bar"><i class="bar_ambar" style={pestanaPagos.datos.barraPendiente}></i></div>
                                </div>
                            </div>
                        </template>
                        <section class="card">
                            <div class="card-h">
                                <div>
                                    <h2 class="t2">Cuotas de la póliza</h2>
                                    <p lwc:if={pestanaPagos.datos.hayCuotas} class="muted">{textoCuotas}</p>
                                </div>
                            </div>
                            <template lwc:if={pestanaPagos.datos.hayCuotas}>
                                <div class="tbox">
                                    <table>
                                        <thead><tr><th>Cuota</th><th>Recibo</th><th>Vence</th><th>Fecha de pago</th><th class="r">Importe</th><th class="r">Pagado</th><th class="r">Pendiente</th><th>Estado</th></tr></thead>
                                        <tbody>
                                            <template for:each={pestanaPagos.datos.cuotas} for:item="q">
                                                <tr key={q.id}>
                                                    <td>
                                                        <div class="who">
                                                            <span class="chip" aria-hidden="true">{q.numero}</span>
                                                            <div>
                                                                <div class="nm">{q.etiqueta}</div>
                                                                <div lwc:if={q.reemplazosTexto} class="sb">{q.reemplazosTexto}</div>
                                                            </div>
                                                        </div>
                                                    </td>
                                                    <td>{q.reciboTexto}</td>
                                                    <td>{q.venceTexto}</td>
                                                    <td>{q.fechaPagoTexto}</td>
                                                    <td class="r money">{q.importeTexto}</td>
                                                    <td class="r">{q.pagadoTexto}</td>
                                                    <td class="r money">{q.pendienteTexto}</td>
                                                    <td>
                                                        <span class={q.estadoClase}><span class="dot"></span>{q.estado}</span>
                                                        <div lwc:if={q.moraTexto} class="sb texto_error">{q.moraTexto}</div>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                                <p lwc:if={pestanaPagos.datos.hayEstimadas} class="muted">Las cuotas «Estimada» se calcularon con la prima y la forma de pago porque la aseguradora aún no emite su recibo; el importe y la fecha pueden cambiar.</p>
                            </template>
                            <div lwc:else class="empty">Esta póliza todavía no tiene cuotas registradas.</div>
                        </section>
                    </template>
                </div>

                <!-- Vigencias -->
                <section lwc:if={verVigencias} class="card" role="tabpanel">
                    <div class="card-h">
                        <div>
                            <h2 class="t2">Historial de vigencias</h2>
                            <p class="muted">Renovaciones de esta póliza</p>
                        </div>
                    </div>
                    <template lwc:if={pestanaVigencias.cargando}>
                        <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                    </template>
                    <div lwc:elseif={pestanaVigencias.error} class="aviso aviso_error" role="alert">{pestanaVigencias.error}</div>
                    <template lwc:elseif={pestanaVigencias.datos}>
                        <div class="tbox">
                            <table>
                                <thead><tr><th>Vigencia</th><th>Número de póliza</th><th>Renovación</th><th>Estado</th><th class="r">Prima</th><th class="r">Pagado</th><th class="r">Pendiente</th></tr></thead>
                                <tbody>
                                    <template for:each={pestanaVigencias.datos.vigencias} for:item="v">
                                        <tr key={v.id} class={v.clase}>
                                            <td>
                                                <div class="who">
                                                    <span class="chip" aria-hidden="true">{chipDetalle}</span>
                                                    <div>
                                                        <template lwc:if={v.actual}>
                                                            <div class="nm">{v.periodo}</div>
                                                            <div class="sb">La que estás viendo</div>
                                                        </template>
                                                        <button lwc:else class="link" data-id={v.id} onclick={handleAbrirVigencia}>{v.periodo}</button>
                                                    </div>
                                                </div>
                                            </td>
                                            <td>{v.numero}</td>
                                            <td>{v.renovacion}</td>
                                            <td><span lwc:if={v.estado} class={v.estadoClase}><span class="dot"></span>{v.estado}</span></td>
                                            <td class="r money">{v.primaTexto}</td>
                                            <td class="r">{v.pagadoTexto}</td>
                                            <td class="r money">{v.pendienteTexto}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                </section>

                <!-- Asegurados, Vehículos o Ubicaciones, según el ramo: el mismo componente de la página de la póliza en Salesforce
                     (datos por PortalPolizasPestanas.datosComponente; altas, bajas, carga y endosos por PortalPolizasMovimientos, solo
                     el contratante). -->
                <div lwc:if={verAsegurados} class="panel pestana_sf" role="tabpanel">
                    <!-- Solicitud de altas, bajas y cambios: Nueva solicitud, Alta o Baja. -->
                    <template lwc:if={solicitudNueva}>
                        <c-portal-solicitudes policy-id={seleccionadaId} cuenta-vista-previa={cuentaVistaPrevia} solo-formulario={siempre}
                            tipo-inicial={solicitudNueva.tipo} registros-iniciales={solicitudNueva.ids} oncerrar={handleCerrarSolicitud}></c-portal-solicitudes>
                    </template>
                    <template lwc:else>
                        <div lwc:if={avisoSolicitud} class="aviso aviso_ok" role="status">{avisoSolicitud}</div>
                        <p lwc:if={notaMiGrupoAsegurados} class="nota">Se muestran solo tú y tus dependientes.</p>
                        <template lwc:if={bienesVehiculos}>
                            <c-movimientos-flotilla portal={siempre} cuenta-vista-previa={cuentaVistaPrevia} read-only={soloConsulta}
                                record-id={seleccionadaId} onnuevasolicitud={handleNuevaSolicitud}></c-movimientos-flotilla>
                        </template>
                        <template lwc:elseif={bienesUbicaciones}>
                            <c-movimientos-ubicaciones portal={siempre} cuenta-vista-previa={cuentaVistaPrevia} read-only={soloConsulta}
                                record-id={seleccionadaId} onnuevasolicitud={handleNuevaSolicitud}></c-movimientos-ubicaciones>
                        </template>
                        <template lwc:else>
                            <c-movimientos-colectivo portal={siempre} cuenta-vista-previa={cuentaVistaPrevia} read-only={soloConsulta}
                                record-id={seleccionadaId} onnuevasolicitud={handleNuevaSolicitud}></c-movimientos-colectivo>
                        </template>
                    </template>
                </div>

                <!-- Participantes: el mismo componente de Salesforce, en solo lectura. -->
                <div lwc:if={verParticipantes} class="panel pestana_sf" role="tabpanel">
                    <p lwc:if={notaMiGrupoParticipantes} class="nota">Se muestran solo tú, tus dependientes y tus beneficiarios.</p>
                    <c-participantes-poliza portal={siempre} cuenta-vista-previa={cuentaVistaPrevia}
                        record-id={seleccionadaId}></c-participantes-poliza>
                </div>
            </template>
        </template>
    </div>
</template>
