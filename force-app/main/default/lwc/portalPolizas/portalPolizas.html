<template>
    <div class="portal">
        <!-- ===== Vista previa de administrador (solo usuarios internos con permiso) ===== -->
        <template lwc:if={puedeVista}>
            <div class="vista_previa">
                <div class="vista_previa_titulo">
                    <lightning-icon icon-name="utility:preview" size="x-small"></lightning-icon>
                    <span>Vista previa de administrador</span>
                </div>
                <template lwc:if={cuentaVistaPrevia}>
                    <div class="vista_previa_actual">
                        <span>Viendo la página como un usuario de <strong>{nombreVistaPrevia}</strong></span>
                        <button class="vista_previa_cambiar" onclick={handleCambiarCuenta}>Cambiar cuenta</button>
                    </div>
                </template>
                <template lwc:else>
                    <lightning-input
                        type="search"
                        label="Cuenta del cliente"
                        placeholder="Escribe al menos 2 letras del nombre de la cuenta"
                        value={textoCuenta}
                        onchange={handleTextoCuenta}
                        is-loading={buscandoCuentas}
                    ></lightning-input>
                    <div lwc:if={errorCuentas} class="aviso aviso_error" role="alert">{errorCuentas}</div>
                    <p lwc:if={sinCuentasEncontradas} class="subtitulo">No hay cuentas titulares de pólizas con ese nombre.</p>
                    <ul lwc:if={hayCuentasEncontradas} class="vista_previa_cuentas">
                        <template for:each={cuentasEncontradas} for:item="c">
                            <li key={c.id}>
                                <button class="vista_previa_cuenta" data-id={c.id} data-nombre={c.nombre} onclick={handleElegirCuenta}>
                                    <span class="documento_nombre">{c.nombre}</span>
                                    <span class="documento_meta">{c.detalle}</span>
                                </button>
                            </li>
                        </template>
                    </ul>
                </template>
            </div>
        </template>

        <!-- ===== Listado ===== -->
        <template lwc:if={enListado}>
            <div class="encabezado">
                <div>
                    <h1 class="titulo">{titulo}</h1>
                    <p lwc:if={hayPolizas} class="subtitulo">{resumen}</p>
                </div>
            </div>

            <template lwc:if={esperandoCuenta}>
                <div class="vacio">
                    <lightning-icon icon-name="standard:insurance_policy" size="large"></lightning-icon>
                    <p>Elige una cuenta arriba para ver la página como la vería ese cliente.</p>
                </div>
            </template>
            <template lwc:elseif={cargando}>
                <div class="cargando"><lightning-spinner alternative-text="Cargando pólizas" size="medium"></lightning-spinner></div>
            </template>
            <template lwc:elseif={error}>
                <div class="aviso aviso_error" role="alert">{error}</div>
            </template>
            <template lwc:elseif={hayPolizas}>
                <div class="controles">
                    <lightning-input
                        class="buscador"
                        type="search"
                        label="Buscar póliza"
                        variant="label-hidden"
                        placeholder="Buscar por número, ramo, aseguradora o bien asegurado"
                        value={busqueda}
                        onchange={handleBusqueda}
                    ></lightning-input>
                    <div class="filtros" role="group" aria-label="Mostrar">
                        <template for:each={opcionesFiltro} for:item="o">
                            <button key={o.value} class={o.clase} data-value={o.value} aria-pressed={o.presionado} onclick={handleFiltro}>
                                <span class="filtro_punto"></span>{o.label}<span lwc:if={o.hayCuenta} class="filtro_cuenta">{o.cuenta}</span>
                            </button>
                        </template>
                    </div>
                </div>

                <template lwc:if={sinResultados}>
                    <div class="aviso">No hay pólizas que coincidan con tu búsqueda.</div>
                </template>

                <ul class="tarjetas">
                    <template for:each={polizasFiltradas} for:item="p">
                        <li key={p.id}>
                            <div
                                class="tarjeta"
                                role="button"
                                tabindex="0"
                                data-id={p.id}
                                onclick={handleAbrir}
                                onkeydown={handleTeclaTarjeta}
                                aria-label={p.numero}
                            >
                                <div class="tarjeta_cabecera">
                                    <span class="tarjeta_ramo">{p.titulo}</span>
                                    <span class={p.estadoClase}>{p.estadoTexto}</span>
                                </div>
                                <div class="tarjeta_numero">Póliza {p.numero}</div>
                                <p lwc:if={p.bienAsegurado} class="tarjeta_bien">{p.bienAsegurado}</p>
                                <dl class="tarjeta_datos">
                                    <div><dt>Vigencia</dt><dd>{p.vigencia}</dd></div>
                                    <div><dt>Prima</dt><dd>{p.primaTexto}</dd></div>
                                </dl>
                                <div lwc:if={p.tieneVencido} class="tarjeta_alerta">
                                    <lightning-icon icon-name="utility:warning" size="x-small" variant="warning"></lightning-icon>
                                    <span>Pago vencido: {p.montoVencidoTexto}</span>
                                </div>
                                <span class="tarjeta_ver">Ver detalle ›</span>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <div class="vacio">
                    <lightning-icon icon-name="standard:insurance_policy" size="large"></lightning-icon>
                    <p>{mensajeVacio}</p>
                </div>
            </template>
        </template>

        <!-- ===== Detalle ===== -->
        <template lwc:else>
            <button class="regresar" onclick={handleRegresar}>‹ Regresar a mis pólizas</button>

            <template lwc:if={cargandoDetalle}>
                <div class="cargando"><lightning-spinner alternative-text="Cargando póliza" size="medium"></lightning-spinner></div>
            </template>
            <template lwc:elseif={errorDetalle}>
                <div class="aviso aviso_error" role="alert">{errorDetalle}</div>
            </template>
            <template lwc:elseif={detalle}>
                <section class="detalle">
                    <div class="detalle_cabecera">
                        <div>
                            <span class="tarjeta_ramo">{detalle.poliza.titulo}</span>
                            <h1 class="titulo">Póliza {detalle.poliza.numero}</h1>
                        </div>
                        <span class={detalle.poliza.estadoClase}>{detalle.poliza.estadoTexto}</span>
                    </div>

                    <div lwc:if={detalle.poliza.tieneVencido} class="aviso aviso_alerta" role="status">
                        Tienes un pago vencido por {detalle.poliza.montoVencidoTexto}. Contacta a tu asesor para regularizarlo.
                    </div>

                    <!-- Mismas pestañas que la página de la póliza en Salesforce -->
                    <div class="filtros pestanas" role="tablist" aria-label="Secciones de la póliza">
                        <template for:each={opcionesPestanas} for:item="o">
                            <button key={o.value} class={o.clase} role="tab" data-value={o.value} aria-selected={o.presionado}
                                onclick={handlePestana}>
                                <span class="filtro_punto"></span>{o.label}
                            </button>
                        </template>
                    </div>
                        <!-- Información Póliza -->
                        <div lwc:if={verInfo} class="pestana_panel" role="tabpanel">
                            <template lwc:if={pestanaInfo.cargando}>
                                <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                            </template>
                            <div lwc:elseif={pestanaInfo.error} class="aviso aviso_error" role="alert">{pestanaInfo.error}</div>
                            <template lwc:elseif={pestanaInfo.datos}>
                                <template for:each={pestanaInfo.datos.secciones} for:item="sec">
                                    <div key={sec.titulo}>
                                        <h2 class="seccion">{sec.titulo}</h2>
                                        <dl class="campos">
                                            <template for:each={sec.campos} for:item="c">
                                                <div key={c.etiqueta} class={c.clase}><dt>{c.etiqueta}</dt><dd>{c.valor}</dd></div>
                                            </template>
                                        </dl>
                                    </div>
                                </template>
                            </template>

                    <h2 class="seccion">Documentos</h2>
                    <template lwc:if={hayDocumentos}>
                        <div lwc:if={errorDescarga} class="aviso aviso_error" role="alert">{errorDescarga}</div>
                        <ul class="documentos">
                            <template for:each={documentosVista} for:item="d">
                                <li key={d.id}>
                                    <template lwc:if={d.porApex}>
                                        <button class="documento" data-id={d.id} onclick={handleDescargar} disabled={d.descargando}>
                                            <lightning-icon icon-name="doctype:attachment" size="small"></lightning-icon>
                                            <span class="documento_nombre">{d.nombre}</span>
                                            <span class="documento_meta">{d.tamanoTexto}</span>
                                            <span class="documento_bajar">{d.textoBoton}</span>
                                        </button>
                                    </template>
                                    <template lwc:else>
                                        <a href={d.url} target="_blank" rel="noopener" class="documento">
                                            <lightning-icon icon-name="doctype:attachment" size="small"></lightning-icon>
                                            <span class="documento_nombre">{d.nombre}</span>
                                            <span class="documento_meta">{d.tamanoTexto}</span>
                                            <span class="documento_bajar">Descargar</span>
                                        </a>
                                    </template>
                                </li>
                            </template>
                        </ul>
                    </template>
                    <template lwc:else>
                        <p class="subtitulo">No hay documentos disponibles para esta póliza.</p>
                    </template>
                        </div>

                        <!-- Pagos -->
                        <div lwc:if={verPagos} class="pestana_panel" role="tabpanel">
                            <template lwc:if={pestanaPagos.cargando}>
                                <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                            </template>
                            <div lwc:elseif={pestanaPagos.error} class="aviso aviso_error" role="alert">{pestanaPagos.error}</div>
                            <template lwc:elseif={pestanaPagos.datos}>
                                <template lwc:if={pestanaPagos.datos.hayCuotas}>
                                    <dl class="totales">
                                        <div><dt>Total de la póliza</dt><dd>{pestanaPagos.datos.totalImporteTexto}</dd></div>
                                        <div><dt>Pagado</dt><dd class="texto_ok">{pestanaPagos.datos.totalPagadoTexto}</dd></div>
                                        <div><dt>Pendiente</dt><dd>{pestanaPagos.datos.totalPendienteTexto}</dd></div>
                                    </dl>
                                    <div class="tabla_contenedor">
                                        <table class="tabla">
                                            <thead><tr><th>Cuota</th><th>Recibo</th><th>Vence</th><th>Fecha de pago</th><th class="num">Importe</th><th class="num">Pagado</th><th class="num">Pendiente</th><th>Estado</th></tr></thead>
                                            <tbody>
                                                <template for:each={pestanaPagos.datos.cuotas} for:item="q">
                                                    <tr key={q.id}>
                                                        <td><span class="celda_principal">{q.etiqueta}</span><span lwc:if={q.reemplazosTexto} class="celda_sub">{q.reemplazosTexto}</span></td>
                                                        <td>{q.reciboTexto}</td>
                                                        <td>{q.venceTexto}</td>
                                                        <td>{q.fechaPagoTexto}</td>
                                                        <td class="num">{q.importeTexto}</td>
                                                        <td class="num">{q.pagadoTexto}</td>
                                                        <td class="num">{q.pendienteTexto}</td>
                                                        <td><span class={q.estadoClase}>{q.estado}</span><span lwc:if={q.moraTexto} class="celda_sub texto_error">{q.moraTexto}</span></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <p lwc:if={pestanaPagos.datos.hayEstimadas} class="nota">Las cuotas «Estimada» se calcularon con la prima y la forma de pago porque la aseguradora aún no emite su recibo; el importe y la fecha pueden cambiar.</p>
                                </template>
                                <p lwc:else class="subtitulo">Esta póliza todavía no tiene cuotas registradas.</p>
                            </template>
                        </div>

                        <!-- Vigencias -->
                        <div lwc:if={verVigencias} class="pestana_panel" role="tabpanel">
                            <template lwc:if={pestanaVigencias.cargando}>
                                <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                            </template>
                            <div lwc:elseif={pestanaVigencias.error} class="aviso aviso_error" role="alert">{pestanaVigencias.error}</div>
                            <template lwc:elseif={pestanaVigencias.datos}>
                                <div class="tabla_contenedor">
                                    <table class="tabla">
                                        <thead><tr><th>Vigencia</th><th>Número de póliza</th><th>Renovación</th><th>Estado</th><th class="num">Prima</th><th class="num">Pagado</th><th class="num">Pendiente</th></tr></thead>
                                        <tbody>
                                            <template for:each={pestanaVigencias.datos.vigencias} for:item="v">
                                                <tr key={v.id} class={v.clase}>
                                                    <td>
                                                        <template lwc:if={v.actual}><span class="celda_principal">{v.periodo}</span></template>
                                                        <button lwc:else class="enlace" data-id={v.id} onclick={handleAbrirVigencia}>{v.periodo}</button>
                                                    </td>
                                                    <td>{v.numeroTexto}</td>
                                                    <td>{v.renovacion}</td>
                                                    <td>{v.estado}</td>
                                                    <td class="num">{v.primaTexto}</td>
                                                    <td class="num">{v.pagadoTexto}</td>
                                                    <td class="num">{v.pendienteTexto}</td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>
                        </div>

                        <!-- Asegurados, Vehículos o Ubicaciones, según el ramo -->
                        <div lwc:if={verAsegurados} class="pestana_panel" role="tabpanel">
                            <template lwc:if={pestanaAsegurados.cargando}>
                                <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                            </template>
                            <div lwc:elseif={pestanaAsegurados.error} class="aviso aviso_error" role="alert">{pestanaAsegurados.error}</div>
                            <template lwc:elseif={tablaAsegurados}>
                                <p lwc:if={tablaAsegurados.soloMiGrupo} class="nota">Se muestran solo tú y tus dependientes.</p>
                                <template lwc:if={tablaAsegurados.hayFilas}>
                                    <div class="controles">
                                        <lightning-input class="buscador" type="search" label="Buscar" variant="label-hidden"
                                            placeholder={tablaAsegurados.placeholder} value={busquedaAsegurados}
                                            onchange={handleBusquedaAsegurados}></lightning-input>
                                        <div class="filtros" role="group" aria-label="Mostrar">
                                            <template for:each={opcionesEstado} for:item="o">
                                                <button key={o.value} class={o.clase} data-value={o.value} aria-pressed={o.presionado} onclick={handleFiltroAsegurados}>
                                                    <span class="filtro_punto"></span>{o.label}<span lwc:if={o.hayCuenta} class="filtro_cuenta">{o.cuenta}</span>
                                                </button>
                                            </template>
                                        </div>
                                    </div>
                                    <p class="subtitulo">{tablaAsegurados.resumen}</p>
                                    <div class="tabla_contenedor">
                                        <table class="tabla">
                                            <thead><tr>
                                                <template for:each={tablaAsegurados.columnas} for:item="col"><th key={col.clave} class={col.clase}>{col.etiqueta}</th></template>
                                            </tr></thead>
                                            <tbody>
                                                <template for:each={tablaAsegurados.filas} for:item="f">
                                                    <tr key={f.id} class={f.clase}>
                                                        <template for:each={f.celdas} for:item="c">
                                                            <td key={c.clave} class={c.clase}><span class={c.claseTexto}>{c.texto}</span><span lwc:if={c.sub} class="celda_sub">{c.sub}</span></td>
                                                        </template>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <button lwc:if={tablaAsegurados.hayMas} class="enlace mostrar_mas" onclick={handleMasAsegurados}>Mostrar más</button>
                                </template>
                                <p lwc:else class="subtitulo">{tablaAsegurados.vacio}</p>
                            </template>
                        </div>

                        <!-- Participantes -->
                        <div lwc:if={verParticipantes} class="pestana_panel" role="tabpanel">
                            <template lwc:if={pestanaParticipantes.cargando}>
                                <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
                            </template>
                            <div lwc:elseif={pestanaParticipantes.error} class="aviso aviso_error" role="alert">{pestanaParticipantes.error}</div>
                            <template lwc:elseif={tablaParticipantes}>
                                <div lwc:if={tablaParticipantes.notaBienes} class="aviso" role="note">{tablaParticipantes.notaBienes}</div>
                                <template lwc:if={tablaParticipantes}>
                                    <p lwc:if={tablaParticipantes.soloMiGrupo} class="nota">Se muestran solo tú, tus dependientes y tus beneficiarios.</p>
                                    <template lwc:if={tablaParticipantes.hayFilas}>
                                        <div class="controles">
                                            <lightning-input class="buscador" type="search" label="Buscar" variant="label-hidden"
                                                placeholder="Buscar por nombre o rol" value={busquedaParticipantes}
                                                onchange={handleBusquedaParticipantes}></lightning-input>
                                            <div class="filtros" role="group" aria-label="Mostrar">
                                                <template for:each={opcionesGrupo} for:item="o">
                                                    <button key={o.value} class={o.clase} data-value={o.value} aria-pressed={o.presionado} onclick={handleFiltroParticipantes}>
                                                        <span class="filtro_punto"></span>{o.label}<span lwc:if={o.hayCuenta} class="filtro_cuenta">{o.cuenta}</span>
                                                    </button>
                                                </template>
                                            </div>
                                        </div>
                                        <p class="subtitulo">{tablaParticipantes.resumen}</p>
                                        <div class="tabla_contenedor">
                                            <table class="tabla">
                                                <thead><tr><th>Nombre</th><th>Rol</th><th lwc:if={tablaParticipantes.conParentesco}>Parentesco</th><th lwc:if={tablaParticipantes.conPorcentaje} class="num">Porcentaje</th><th lwc:if={tablaParticipantes.conVigencia}>Vigencia</th><th>Estado</th></tr></thead>
                                                <tbody>
                                                    <template for:each={tablaParticipantes.filas} for:item="f">
                                                        <tr key={f.id} class={f.clase}>
                                                            <td><span class="celda_principal">{f.nombre}</span><span lwc:if={f.deTexto} class="celda_sub">{f.deTexto}</span></td>
                                                            <td>{f.roles}</td>
                                                            <td lwc:if={tablaParticipantes.conParentesco}>{f.parentesco}</td>
                                                            <td lwc:if={tablaParticipantes.conPorcentaje} class="num">{f.porcentajeTexto}</td>
                                                            <td lwc:if={tablaParticipantes.conVigencia}>{f.vigenciaTexto}</td>
                                                            <td><span class={f.estadoClase}>{f.estadoTexto}</span><span lwc:if={f.motivoBaja} class="celda_sub">{f.motivoBaja}</span></td>
                                                        </tr>
                                                    </template>
                                                </tbody>
                                            </table>
                                        </div>
                                        <button lwc:if={tablaParticipantes.hayMas} class="enlace mostrar_mas" onclick={handleMasParticipantes}>Mostrar más</button>
                                    </template>
                                    <p lwc:else class="subtitulo">No hay participantes registrados en esta póliza.</p>
                                </template>
                            </template>
                        </div>
                </section>
            </template>
        </template>
    </div>
</template>
