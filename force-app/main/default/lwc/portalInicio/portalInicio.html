<template>
    <div class="wrap">
        <!-- ===== Portada: saludo, botones y resumen en tarjetas de vidrio ===== -->
        <section class="hero">
            <div class="hero-main">
                <div class="hero-row">
                    <div class="hero-ic">
                        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"></path></svg>
                    </div>
                    <div>
                        <div class="eyebrow">Portal digital Avanza Seguro</div>
                        <h1 class="h1">{saludo}</h1>
                    </div>
                </div>
                <p><b>{tituloTexto}</b> {subtitulo}</p>
                <div class="btns">
                    <a class="btn white" href={urlMisPolizas}>
                        Ver mis pólizas
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
                    </a>
                    <a class="btn grad" href={urlDashboard}>
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>
                        Ir al dashboard
                    </a>
                </div>
            </div>
            <div class="hero-side">
                <div class="glass">
                    <div class="l">Pólizas vigentes</div>
                    <div class="n">{numVigentes}</div>
                    <div class="s">{textoTotalPolizas}</div>
                </div>
                <div class="glass">
                    <div class="l">Sincronizado</div>
                    <div class="n">En tiempo real</div>
                    <div class="s">Avanza Seguro</div>
                </div>
                <div class="glass wide">
                    <div class="l">{asegurados.etiqueta}</div>
                    <div class="n">{asegurados.valor}</div>
                    <div class="s">{asegurados.detalle}</div>
                </div>
            </div>
        </section>

        <!-- ===== Indicadores ===== -->
        <div class="grid g4">
            <template for:each={etapas} for:item="e">
                <div key={e.clave} class="stage">
                    <div class="hd">{e.etiqueta}<span class="dot" style={e.estiloPunto}></span></div>
                    <div class="n">{e.valor}</div>
                    <div class="s">{e.detalle}</div>
                    <div class="bar" aria-hidden="true"><i style={e.estiloBarra}></i></div>
                </div>
            </template>
        </div>

        <!-- ===== Mis pólizas, movimientos y ejecutivo ===== -->
        <div lwc:if={hayPolizas} class="grid g3">
            <section class="card">
                <div class="card-h">
                    <h2 class="t2">Mis pólizas</h2>
                    <a class="enlace" href={urlMisPolizas}>{masPolizas}</a>
                </div>
                <div lwc:if={hayTarjetas}>
                    <template for:each={tarjetasPolizas} for:item="p">
                        <a key={p.id} class="list-row" href={p.url}>
                            <span class="fila-tx">
                                <span class="nm">{p.numero}</span>
                                <span class="sb">{p.ramo}<template lwc:if={p.aseguradora}> · {p.aseguradora}</template></span>
                                <span lwc:if={p.bien} class="sb ell">{p.bien}</span>
                                <span class="sb">{p.vigencia}</span>
                            </span>
                            <span class={p.chipClase}>{p.chip}</span>
                        </a>
                    </template>
                </div>
                <p lwc:else class="empty">No tienes pólizas vigentes en este momento.</p>
            </section>

            <section class="card">
                <div class="card-h">
                    <h2 class="t2">Movimientos recientes</h2>
                    <a class="enlace" href={urlDashboard}>Ver historial</a>
                </div>
                <ul lwc:if={hayMovimientos} class="lista">
                    <template for:each={movimientos} for:item="m">
                        <li key={m.id} class="list-row">
                            <span class={m.iconoClase}><lightning-icon icon-name={m.icono} size="xx-small"></lightning-icon></span>
                            <span class="fila-tx">
                                <span class="nm">{m.titulo}</span>
                                <span class="sb">{m.meta}</span>
                            </span>
                            <span class="sb fecha">{m.fecha}</span>
                        </li>
                    </template>
                </ul>
                <p lwc:else class="empty">Aún no hay altas, bajas ni cambios registrados en tus pólizas.</p>
            </section>

            <section lwc:if={ejecutivoInfo} class="card">
                <div>
                    <div class="kicker">Tu ejecutivo Avanza</div>
                    <h2 class="t2">¿Necesitas ayuda?</h2>
                </div>
                <div class="who">
                    <img lwc:if={ejecutivoInfo.foto} class="foto" src={ejecutivoInfo.foto} alt="" />
                    <span lwc:else class="avatar" aria-hidden="true">{ejecutivoInfo.iniciales}</span>
                    <span class="fila-tx">
                        <span class="nm">{ejecutivoInfo.nombre}</span>
                        <span class="sb">{ejecutivoInfo.puestoTexto}</span>
                    </span>
                </div>
                <div class="btns">
                    <a lwc:if={ejecutivoInfo.mailto} class="btn ghost" href={ejecutivoInfo.mailto}>
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg>
                        Escribir
                    </a>
                    <a lwc:if={ejecutivoInfo.tel} class="btn ghost" href={ejecutivoInfo.tel}>
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"></path></svg>
                        Llamar
                    </a>
                </div>
            </section>
        </div>

        <!-- ===== Accesos rápidos ===== -->
        <section class="card">
            <div>
                <div class="kicker">Accesos rápidos</div>
                <h2 class="h2">¿Qué quieres hacer hoy?</h2>
            </div>
            <div class="grid g2">
                <template for:each={accesos} for:item="a">
                    <a key={a.clave} class="quick" href={a.url}>
                        <span class="fic"><lightning-icon icon-name={a.icono} size="x-small"></lightning-icon></span>
                        <span class="tx">
                            <b>{a.titulo}</b>
                            <span class="quick-sb">{a.texto}</span>
                        </span>
                        <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
                    </a>
                </template>
            </div>
        </section>

        <!-- ===== Tecnología ===== -->
        <section class="card">
            <div>
                <div class="kicker">Tecnología Avanza</div>
                <h2 class="h2">Un portal pensado para que no te preocupes por nada</h2>
                <p class="muted">Combinamos la experiencia de tu asesor con herramientas digitales que trabajan por ti todo el tiempo.</p>
            </div>
            <ul class="grid g3 lista">
                <template for:each={funciones} for:item="f">
                    <li key={f.clave} class="feat">
                        <span class="fic"><lightning-icon icon-name={f.icono} size="x-small"></lightning-icon></span>
                        <h3>{f.titulo}</h3>
                        <p>{f.texto}</p>
                    </li>
                </template>
            </ul>
        </section>

        <!-- ===== Cómo funciona ===== -->
        <section class="card">
            <div>
                <div class="kicker">Así de fácil</div>
                <h2 class="h2">Tu seguro, en tres pasos</h2>
            </div>
            <ol class="grid g3 lista">
                <template for:each={pasos} for:item="p">
                    <li key={p.clave} class="stage paso">
                        <div class="n paso-n">{p.numero}</div>
                        <h3 class="hd paso-t">{p.titulo}</h3>
                        <div class="s">{p.texto}</div>
                    </li>
                </template>
            </ol>
        </section>

        <!-- ===== Banda final ===== -->
        <section class="hero hero-fin">
            <div class="hero-main">
                <h2 class="h1 h1-fin">Toda tu protección, siempre contigo</h2>
                <p>Revisa el detalle de cada póliza y descarga tus documentos cuando los necesites.</p>
            </div>
            <a class="btn white" href={urlMisPolizas}>
                Ir a mis pólizas
                <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
            </a>
        </section>
    </div>
</template>
