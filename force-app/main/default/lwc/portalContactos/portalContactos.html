<template>
    <div class="pagina">
        <c-portal-vista-previa pagina="Mi empresa" oncambio={handleVistaPrevia}></c-portal-vista-previa>

        <div class="cabecera">
            <span class="cabecera_etiqueta">Mi empresa</span>
            <h1 class="cabecera_titulo">{titulo}</h1>
            <p class="cabecera_sub">{subtitulo}<template lwc:if={nombreCuenta}> · {nombreCuenta}</template></p>
        </div>

        <template lwc:if={cargando}>
            <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
        </template>
        <div lwc:elseif={error} class="aviso aviso_error" role="alert">{error}</div>
        <section lwc:elseif={sinPersonas} class="panel">
            <p class="vacio">{mensajeVacio}</p>
        </section>

        <section lwc:if={hayPersonas} class="panel">
            <div class="barra">
                <div class="buscador">
                    <lightning-input type="search" label="Buscar persona" variant="label-hidden"
                        placeholder="Buscar por nombre, certificado o parentesco" value={busqueda} onchange={handleBusqueda}></lightning-input>
                </div>
                <span class="conteo" aria-live="polite">{conteo}</span>
            </div>

            <div lwc:if={hayFilas} class="tabla_caja">
                <table class="tabla">
                    <caption class="solo_lector">Personas aseguradas de la empresa</caption>
                    <thead>
                        <tr>
                            <th scope="col">Nombre</th>
                            <th scope="col">Parentesco</th>
                            <th scope="col">Certificado</th>
                            <th scope="col">Edad</th>
                            <th scope="col">Género</th>
                            <th scope="col">Grupo</th>
                            <th scope="col">Fecha de alta</th>
                            <th lwc:if={variosRamos} scope="col">Ramo</th>
                            <th scope="col" class="num">Prima</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={filas} for:item="p">
                            <tr key={p.id} class={p.claseFila}>
                                <th scope="row">
                                    <span class="nombre">{p.nombre}</span>
                                    <span lwc:if={p.deTitular} class="nombre_sub">{p.deTitular}</span>
                                </th>
                                <td><span class={p.claseParentesco}>{p.parentesco}</span></td>
                                <td class="mono">{p.certificadoTexto}</td>
                                <td><span title={p.nacimientoTexto}>{p.edadTexto}</span></td>
                                <td>{p.generoTexto}</td>
                                <td>{p.grupoTexto}</td>
                                <td>{p.altaTexto}</td>
                                <td lwc:if={variosRamos}>{p.ramoTexto}</td>
                                <td class="num">{p.primaTexto}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
            <p lwc:else class="vacio">Nadie coincide con «{busqueda}».</p>

            <div lwc:if={hayMas} class="mas">
                <button class="boton_mas" onclick={handleMas}>Ver más</button>
            </div>
        </section>
    </div>
</template>
