<template>
  <lightning-card icon-name="utility:einstein">
    <span slot="title">Análisis del documento (IA)</span>

    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <!-- Estado vacío -->
      <template lwc:if={showEmptyState}>
        <div
          class="slds-illustration slds-illustration_small slds-p-around_large slds-text-align_center"
        >
          <lightning-icon
            icon-name="utility:einstein"
            size="large"
            class="slds-m-bottom_small empty-icon"
          ></lightning-icon>
          <h3 class="slds-text-heading_small">Aún no hay análisis de IA</h3>
          <p class="slds-text-color_weak slds-m-top_x-small">
            Sube un documento desde la app "Análisis de Oportunidad" para
            generar el análisis automático de esta oportunidad.
          </p>
        </div>
      </template>

      <!-- Error -->
      <template lwc:if={errorMsg}>
        <div class="slds-box slds-theme_error">{errorMsg}</div>
      </template>

      <!-- Contenido -->
      <template lwc:if={hasContent}>
        <!-- Encabezado -->
        <template lwc:if={headerCliente}>
          <div class="hero slds-m-bottom_medium">
            <div class="slds-grid slds-grid_vertical-align-center">
              <lightning-icon
                icon-name="utility:user"
                size="small"
                variant="inverse"
                class="slds-m-right_small"
              ></lightning-icon>
              <div>
                <p class="hero-cliente">{headerCliente}</p>
                <template lwc:if={headerTipo}>
                  <p class="hero-tipo">{headerTipo}</p>
                </template>
              </div>
            </div>
          </div>
        </template>

        <!-- Resumen ejecutivo (nuevo formato) -->
        <template lwc:if={executiveSummary}>
          <h3 class="slds-text-title_caps slds-m-bottom_x-small">
            Resumen ejecutivo
          </h3>
          <div class="exec-summary slds-m-bottom_medium">
            <lightning-formatted-text
              value={executiveSummary}
              linkify
            ></lightning-formatted-text>
          </div>
        </template>

        <!-- Datos clave (legacy single-doc) -->
        <template lwc:if={keyData.length}>
          <h3 class="slds-text-title_caps slds-m-bottom_x-small">
            Datos clave
          </h3>
          <div class="grid slds-m-bottom_medium">
            <template for:each={keyData} for:item="d">
              <div key={d.key} class="tile">
                <lightning-icon
                  icon-name={d.icon}
                  size="x-small"
                  class="tile-icon"
                ></lightning-icon>
                <div class="tile-body">
                  <p class="tile-label">{d.label}</p>
                  <p class="tile-value">{d.value}</p>
                </div>
              </div>
            </template>
          </div>
        </template>

        <!-- Comparativo (nuevo formato) -->
        <template lwc:if={comparisonTable}>
          <h3 class="slds-text-title_caps slds-m-bottom_x-small">
            Comparativo de documentos
          </h3>
          <div class="slds-scrollable_x slds-m-bottom_x-small">
            <table class="comparison-table">
              <thead>
                <tr>
                  <th scope="col" class="field-col">Campo</th>
                  <template
                    for:each={comparisonTable.headers}
                    for:item="h"
                  >
                    <th key={h.key} scope="col" class="doc-col">
                      {h.label}
                    </th>
                  </template>
                </tr>
              </thead>
              <tbody>
                <template for:each={comparisonTable.rows} for:item="row">
                  <tr key={row.key} class={row.rowClass}>
                    <th scope="row" class="field-col">{row.label}</th>
                    <template for:each={row.cells} for:item="c">
                      <td key={c.key} class={c.cellClass}>{c.value}</td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <p
            class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium"
          >
            Las filas resaltadas marcan los campos donde los documentos difieren.
          </p>
        </template>

        <!-- Resumen destacado (legacy) -->
        <template lwc:if={summary}>
          <div class="callout slds-m-bottom_medium">
            <lightning-icon
              icon-name="utility:summary"
              size="small"
              class="slds-m-right_small callout-icon"
            ></lightning-icon>
            <p>{summary}</p>
          </div>
        </template>

        <!-- Análisis por documento (nuevo formato) -->
        <template lwc:if={docAnalyses.length}>
          <h3 class="slds-text-title_caps slds-m-bottom_x-small">
            Análisis por documento
          </h3>
          <template for:each={docAnalyses} for:item="d">
            <article key={d.key} class="section slds-m-bottom_small">
              <header class="section-head">
                <lightning-icon
                  icon-name={d.icon}
                  size="small"
                  class="slds-m-right_small section-icon"
                ></lightning-icon>
                <h3 class="section-title">{d.title}</h3>
              </header>
              <div class="section-body">
                <template lwc:if={d.hasRisks}>
                  <template for:each={d.riskItems} for:item="r">
                    <div key={r.key} class={r.cls}>
                      <lightning-icon
                        icon-name={r.icon}
                        size="x-small"
                        class="slds-m-right_x-small risk-icon"
                      ></lightning-icon>
                      <span class="risk-badge">{r.badge}</span>
                      <span class="risk-text">{r.text}</span>
                    </div>
                  </template>
                </template>
                <template lwc:if={d.contentItems.length}>
                  <ul class="content-list">
                    <template for:each={d.contentItems} for:item="c">
                      <li key={c.key} class={c.cls}>{c.text}</li>
                    </template>
                  </ul>
                </template>
              </div>
            </article>
          </template>
        </template>

        <!-- Secciones del análisis (legacy single-doc) -->
        <template for:each={sections} for:item="s">
          <article key={s.key} class="section slds-m-bottom_small">
            <header class="section-head">
              <lightning-icon
                icon-name={s.icon}
                size="small"
                class="slds-m-right_small section-icon"
              ></lightning-icon>
              <h3 class="section-title">{s.title}</h3>
            </header>

            <div class="section-body">
              <template lwc:if={s.isRisk}>
                <template for:each={s.riskItems} for:item="r">
                  <div key={r.key} class={r.cls}>
                    <lightning-icon
                      icon-name={r.icon}
                      size="x-small"
                      class="slds-m-right_x-small risk-icon"
                    ></lightning-icon>
                    <span class="risk-badge">{r.badge}</span>
                    <span class="risk-text">{r.text}</span>
                  </div>
                </template>
              </template>

              <template lwc:if={s.contentItems.length}>
                <ul class="content-list">
                  <template for:each={s.contentItems} for:item="c">
                    <li key={c.key} class={c.cls}>{c.text}</li>
                  </template>
                </ul>
              </template>
            </div>
          </article>
        </template>
      </template>
    </div>
  </lightning-card>
</template>
