<template>
    <!-- Overlay de pantalla completa: bloquea la interacción al cargar o analizar -->
    <template if:true={showOverlay}>
        <div class="policy-overlay">
            <div class="policy-overlay__box">
                <lightning-spinner alternative-text="Procesando" size="large" variant="brand"></lightning-spinner>
                <p>{overlayMessage}</p>
            </div>
        </div>
    </template>

    <div class="content-container glass-effect unified-view">

        <!-- Barra superior: Regresar + título + Analizar PDF -->
        <div class="policy-topbar">
            <button class="action-btn secondary back-btn" onclick={handleRegresar}>
                <lightning-icon icon-name="utility:back" size="x-small"></lightning-icon>
                <span>Regresar</span>
            </button>
            <div class="topbar-left">
                <div class="section-icon">
                    <lightning-icon icon-name="standard:policy" size="small"></lightning-icon>
                </div>
                <div class="section-title-group">
                    <h2 class="section-title">Emisión de Póliza</h2>
                    <p class="section-subtitle">{topbarSubtitle}</p>
                </div>
            </div>
            <template if:true={isEditable}>
                <button class="action-btn secondary pdf-btn" onclick={handleAnalizarPdf} disabled={analizando}>
                    <lightning-icon icon-name="doc:pdf" size="x-small"></lightning-icon>
                    <span>Analizar PDF de Póliza</span>
                </button>
                <input type="file" accept="application/pdf"
                       class="pdf-file-input" onchange={handleFileSelected}></input>
            </template>
        </div>

        <template if:false={loading}>

            <!-- ============================================= -->
            <!-- MODO SOLO LECTURA (Póliza / Ganada / Perdida)  -->
            <!-- ============================================= -->
            <template if:true={isReadOnly}>

                <!-- Cabecera destacada de la póliza -->
                <div class={heroClass}>
                    <div class="ro-hero__top">
                        <div class="ro-hero__icon">
                            <lightning-icon icon-name="standard:policy" size="medium"></lightning-icon>
                        </div>
                        <div class="ro-hero__title">
                            <span class="ro-hero__eyebrow">Póliza</span>
                            <h2 class="ro-hero__name">{policyHero.nombre}</h2>
                            <p class="ro-hero__meta">No. {policyHero.numero} · {aseguradoraHero}</p>
                        </div>
                        <div class="ro-hero__stage">
                            <lightning-icon icon-name={heroIcon} size="x-small"></lightning-icon>
                            <span>{heroEtapa}</span>
                        </div>
                    </div>
                    <div class="ro-kpis">
                        <div class="ro-kpi ro-kpi--main">
                            <span class="ro-kpi__label">Prima total</span>
                            <span class="ro-kpi__value">{policyHero.prima}</span>
                        </div>
                        <div class="ro-kpi">
                            <span class="ro-kpi__label">Vigencia</span>
                            <span class="ro-kpi__value">{vigenciaHero}</span>
                        </div>
                        <div class="ro-kpi">
                            <span class="ro-kpi__label">Forma de pago</span>
                            <span class="ro-kpi__value">{policyHero.frecuencia} · {policyHero.pagos} pagos</span>
                        </div>
                        <div class="ro-kpi">
                            <span class="ro-kpi__label">Estatus</span>
                            <span class="ro-kpi__value">{policyHero.estatus}</span>
                        </div>
                    </div>
                    <div class="ro-hero__lock">
                        <lightning-icon icon-name="utility:lock" size="xx-small"></lightning-icon>
                        <span>{readOnlyMensaje}</span>
                    </div>
                </div>

                <!-- Oportunidad + Cotizaciones -->
                <div class="ro-row">
                    <div class="ro-section">
                        <h3 class="ro-section__title">
                            <lightning-icon icon-name="standard:opportunity" size="x-small"></lightning-icon>
                            Oportunidad
                        </h3>
                        <template if:true={oppCard}>
                            <div class="ro-grid ro-grid--2">
                                <div class="ro-field ro-field--wide"><span class="ro-label">Nombre</span><span class="ro-value">{oppCard.name}</span></div>
                                <div class="ro-field"><span class="ro-label">Cuenta</span><span class="ro-value">{oppCard.cuenta}</span></div>
                                <div class="ro-field"><span class="ro-label">Agente</span><span class="ro-value">{oppCard.agente}</span></div>
                                <div class="ro-field"><span class="ro-label">Ramo</span><span class="ro-value">{oppCard.ramo}</span></div>
                                <div class="ro-field"><span class="ro-label">Tipo</span><span class="ro-value">{oppCard.tipo}</span></div>
                                <div class="ro-field ro-amount"><span class="ro-label">Prima neta</span><span class="ro-value">{oppCard.primaNeta}</span></div>
                                <div class="ro-field"><span class="ro-label">Cierre</span><span class="ro-value">{oppCard.cierre}</span></div>
                            </div>
                        </template>
                    </div>

                    <div class="ro-section">
                        <h3 class="ro-section__title">
                            <lightning-icon icon-name="standard:quotes" size="x-small"></lightning-icon>
                            Cotizaciones
                        </h3>
                        <template if:true={hasQuoteCards}>
                            <div class="ro-list">
                                <template for:each={quoteCardsView} for:item="q">
                                    <div key={q.id} class={q.cardClass}>
                                        <div class="ro-quote-head">
                                            <span class="ro-quote-num">{q.numero}</span>
                                            <span class="ro-status">{q.status}</span>
                                        </div>
                                        <div class="ro-quote-meta">
                                            <span>{q.aseguradora}</span>
                                            <span class="money">{q.primaTotal}</span>
                                            <span>{q.coberturas} coberturas</span>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasQuoteCards}>
                            <p class="ro-empty">Sin cotizaciones.</p>
                        </template>
                    </div>
                </div>

                <!-- Póliza -->
                <div class="ro-section">
                    <h3 class="ro-section__title">
                        <lightning-icon icon-name="standard:policy" size="x-small"></lightning-icon>
                        Datos de la póliza
                    </h3>
                    <template if:true={hasPolicy}>
                        <lightning-record-view-form record-id={policyId} object-api-name="InsurancePolicy" density="compact">

                            <p class="ro-subtitle">Identificación</p>
                            <div class="ro-grid">
                                <div class="ro-field"><lightning-output-field field-name="Name"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="UniversalPolicyNumber"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="PolicyType"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="Status"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="Aseguradora__c"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="ProductId"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="NameInsuredId"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="ProducerId"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="SourceQuoteId"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="SourceOpportunityId"></lightning-output-field></div>
                            </div>

                            <p class="ro-subtitle">Vigencia y fechas</p>
                            <div class="ro-grid">
                                <div class="ro-field"><span class="ro-label">Inicio de vigencia</span><span class="ro-value">{policyDates.EffectiveDate}</span></div>
                                <div class="ro-field"><span class="ro-label">Fin de vigencia</span><span class="ro-value">{policyDates.ExpirationDate}</span></div>
                                <div class="ro-field"><span class="ro-label">Primer vencimiento de pago</span><span class="ro-value">{policyDates.PaymentDueDate}</span></div>
                                <div class="ro-field"><span class="ro-label">Fecha de emisión</span><span class="ro-value">{policyDates.SaleDate}</span></div>
                                <div class="ro-field"><lightning-output-field field-name="PolicyTerm"></lightning-output-field></div>
                                <div class="ro-field"><span class="ro-label">Vigencia de cancelación</span><span class="ro-value">{policyDates.CancellationEffectiveDate}</span></div>
                                <div class="ro-field"><lightning-output-field field-name="CancellationReason"></lightning-output-field></div>
                            </div>

                            <p class="ro-subtitle">Prima y forma de pago</p>
                            <div class="ro-grid">
                                <div class="ro-field ro-amount"><lightning-output-field field-name="GrossWrittenPremium"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="PremiumAmount"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="TermPremiumAmount"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="PremiumFrequency"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="Numero_Pagos__c"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="Moneda__c"></lightning-output-field></div>
                            </div>

                            <p class="ro-subtitle">Cobranza</p>
                            <div class="ro-grid">
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Primer_Pago__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Pago_Subsecuente__c"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="Pagos_Subsecuentes__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Subtotal__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Descuento__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Financiamiento__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Recargos__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Gastos_Expedicion__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="Derecho_Poliza__c"></lightning-output-field></div>
                                <div class="ro-field ro-amount"><lightning-output-field field-name="IVA__c"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="Referencia_Pago__c"></lightning-output-field></div>
                                <div class="ro-field"><lightning-output-field field-name="CLABE__c"></lightning-output-field></div>
                            </div>

                            <p class="ro-subtitle">Renovación</p>
                            <div class="ro-grid">
                                <div class="ro-field"><span class="ro-label">Renovación anterior</span><span class="ro-value">{policyDates.PreviousRenewalDate}</span></div>
                                <div class="ro-field"><span class="ro-label">Fecha de renovación</span><span class="ro-value">{policyDates.RenewalDate}</span></div>
                                <div class="ro-field"><span class="ro-label">Renovación planeada</span><span class="ro-value">{policyDates.PlannedRenewalDate}</span></div>
                            </div>

                            <p class="ro-subtitle">Descripción</p>
                            <div class="ro-desc">
                                <lightning-output-field field-name="PolicyDescription" variant="label-hidden"></lightning-output-field>
                            </div>
                        </lightning-record-view-form>
                    </template>
                    <template if:false={hasPolicy}>
                        <p class="ro-empty">{errorMsg}</p>
                    </template>
                </div>

                <!-- Coberturas -->
                <div class="ro-section">
                    <h3 class="ro-section__title">
                        <lightning-icon icon-name="standard:shield" size="x-small"></lightning-icon>
                        Coberturas
                    </h3>
                    <template if:true={hasCoberturas}>
                        <div class="ro-table-wrap">
                            <table class="ro-table">
                                <thead>
                                    <tr><th>Cobertura</th><th class="num">Suma asegurada</th><th class="num">Deducible</th><th class="num">Prima</th></tr>
                                </thead>
                                <tbody>
                                    <template for:each={coberturas} for:item="c">
                                        <tr key={c.id}>
                                            <td class="strong">{c.nombre}</td>
                                            <td class="num">{c.suma}</td>
                                            <td class="num">{c.deducible}</td>
                                            <td class="num money">{c.prima}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasCoberturas}>
                        <p class="ro-empty">Sin coberturas.</p>
                    </template>
                </div>

                <!-- Participantes + Bien asegurado -->
                <div class="ro-row">
                    <div class="ro-section">
                        <h3 class="ro-section__title">
                            <lightning-icon icon-name="standard:contact" size="x-small"></lightning-icon>
                            Participantes
                        </h3>
                        <template if:true={hasParticipantes}>
                            <div class="ro-list">
                                <template for:each={participantes} for:item="p">
                                    <div key={p.id} class="ro-chip-row">
                                        <span class="strong">{p.nombre}</span>
                                        <span class="ro-muted">{p.relacion}</span>
                                        <template if:true={p.detalleBeneficio}>
                                            <span class="money">{p.detalleBeneficio}</span>
                                        </template>
                                        <span class="ro-status">{p.rol}</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasParticipantes}>
                            <p class="ro-empty">Sin participantes.</p>
                        </template>
                    </div>

                    <div class="ro-section">
                        <h3 class="ro-section__title">
                            <lightning-icon icon-name="standard:asset_object" size="x-small"></lightning-icon>
                            Bien asegurado
                        </h3>
                        <template if:true={hasBienes}>
                            <div class="ro-list">
                                <template for:each={bienes} for:item="b">
                                    <div key={b.id} class="ro-chip-row">
                                        <span class="strong">{b.nombre}</span>
                                        <span class="money">{b.prima}</span>
                                        <span class="ro-status">{b.activo}</span>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template if:false={hasBienes}>
                            <p class="ro-empty">Sin bienes asegurados.</p>
                        </template>
                    </div>
                </div>

                <!-- Transacciones -->
                <div class="ro-section">
                    <h3 class="ro-section__title">
                        <lightning-icon icon-name="standard:payment_gateway" size="x-small"></lightning-icon>
                        Transacciones
                    </h3>
                    <template if:true={hasTransacciones}>
                        <div class="ro-table-wrap">
                            <table class="ro-table">
                                <thead>
                                    <tr><th>Transacción</th><th>Tipo</th><th>Fecha</th><th>Estatus</th><th class="num">Monto</th></tr>
                                </thead>
                                <tbody>
                                    <template for:each={transacciones} for:item="t">
                                        <tr key={t.id}>
                                            <td class="strong">{t.nombre}</td>
                                            <td>{t.tipo}</td>
                                            <td>{t.fecha}</td>
                                            <td><span class="ro-status">{t.estatus}</span></td>
                                            <td class="num money">{t.monto}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <template if:false={hasTransacciones}>
                        <p class="ro-empty">Sin transacciones.</p>
                    </template>
                </div>
            </template>

            <!-- ============================================= -->
            <!-- MODO EDICIÓN: formulario                        -->
            <!-- ============================================= -->
            <template if:false={isReadOnly}>
                <template if:true={hasPolicy}>
                    <lightning-record-edit-form
                        object-api-name="InsurancePolicy"
                        record-id={policyId}
                        onload={handleLoad}
                        onsubmit={handleSubmit}
                        onsuccess={handleSuccess}
                        onerror={handleError}>

                        <lightning-messages></lightning-messages>

                        <!-- Datos generales -->
                        <div class="unified-section">
                            <div class="section-header-compact">
                                <div class="section-icon">
                                    <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                                </div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Datos generales</h2>
                                    <p class="section-subtitle">Identificación de la póliza</p>
                                </div>
                                <div class="section-badge required-badge">Requerido</div>
                            </div>
                            <div class="policy-grid">
                                <div class="field-card"><lightning-input-field field-name="Name" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="NameInsuredId" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="PolicyType" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Aseguradora__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="ProductId" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="EffectiveDate" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="ExpirationDate" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Status" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="UniversalPolicyNumber" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="PolicyDescription" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="OriginalPolicyId" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="PriorPolicyId" disabled={isReadOnly}></lightning-input-field></div>
                                <!-- Cotización y oportunidad de origen: las asigna el flujo al crear la póliza.
                                     Se muestran como texto porque el buscador estándar no soporta Quote
                                     ("objectInfos attribute is missing data for Quote"). El Plan de contrato de
                                     grupo (ContractGroupPlanId) se quitó por el mismo motivo y no se usa. -->
                                <div class="field-card field-card--static">
                                    <span class="static-label">Cotización origen</span>
                                    <span class="static-value">{cotizacionOrigen}</span>
                                </div>
                                <div class="field-card field-card--static">
                                    <span class="static-label">Oportunidad origen</span>
                                    <span class="static-value">{oportunidadOrigen}</span>
                                </div>
                                <!-- Automático desde el módulo de pagos: no editable -->
                                <div class="field-card"><lightning-input-field field-name="CancellationEffectiveDate" disabled></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="CancellationReason" disabled={isReadOnly}></lightning-input-field></div>
                                <!-- Calculado: Expiration Date - Effective Date -->
                                <div class="field-card"><lightning-input-field field-name="PolicyTerm" disabled></lightning-input-field></div>
                            </div>
                        </div>

                        <!-- Detalles de prima -->
                        <div class="unified-section">
                            <div class="section-header-compact">
                                <div class="section-icon">
                                    <lightning-icon icon-name="utility:link" size="small"></lightning-icon>
                                </div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Detalles de prima</h2>
                                    <p class="section-subtitle">Monto de la prima y condiciones</p>
                                </div>
                            </div>
                            <div class="policy-grid">
                                <div class="field-card"><lightning-input-field field-name="GrossWrittenPremium" onchange={handlePremiumChange} disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="PremiumAmount" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="PremiumFrequency" onchange={handlePremiumChange} disabled={isReadOnly}></lightning-input-field></div>
                                <!-- Calculado: prima total anualizada / exhibiciones de la frecuencia -->
                                <div class="field-card"><lightning-input-field field-name="TermPremiumAmount" disabled={isReadOnly}></lightning-input-field></div>
                            </div>
                        </div>

                        <!-- Información de renovación -->
                        <div class="unified-section">
                            <div class="section-header-compact">
                                <div class="section-icon">
                                    <lightning-icon icon-name="utility:event" size="small"></lightning-icon>
                                </div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Información de renovación</h2>
                                    <p class="section-subtitle">Fechas y montos de renovación</p>
                                </div>
                            </div>
                            <div class="policy-grid">
                                <!-- Automática: fecha en que la Oportunidad pasó de Gestión Comercial a Emisión -->
                                <div class="field-card"><lightning-input-field field-name="SaleDate" disabled></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="PreviousRenewalDate" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="RenewalDate" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="PlannedRenewalDate" disabled={isReadOnly}></lightning-input-field></div>
                                <!-- Automático desde Gestión Comercial (ejecutivo responsable). Se muestra como
                                     texto: el buscador estándar (lightning-lookup) no soporta el objeto Producer
                                     y arrojaba "objectInfos attribute is missing data for Producer". El valor lo
                                     liga vincularProducer en Apex antes de abrir el formulario. -->
                                <div class="field-card field-card--static">
                                    <span class="static-label">Agente</span>
                                    <span class="static-value">{agenteNombre}</span>
                                </div>
                            </div>
                        </div>

                        <!-- Cobranza -->
                        <div class="unified-section">
                            <div class="section-header-compact">
                                <div class="section-icon">
                                    <lightning-icon icon-name="utility:currency" size="small"></lightning-icon>
                                </div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Cobranza</h2>
                                    <p class="section-subtitle">Esquema de pagos, cargos e impuestos</p>
                                </div>
                            </div>
                            <div class="policy-grid">
                                <div class="field-card"><lightning-input-field field-name="PaymentDueDate" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Moneda__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Numero_Pagos__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Plazo_Pago_Dias__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Primer_Pago__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Pago_Subsecuente__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Pagos_Subsecuentes__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Subtotal__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Descuento__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Financiamiento__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Recargos__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Gastos_Expedicion__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Derecho_Poliza__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="IVA__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="Referencia_Pago__c" disabled={isReadOnly}></lightning-input-field></div>
                                <div class="field-card"><lightning-input-field field-name="CLABE__c" disabled={isReadOnly}></lightning-input-field></div>
                            </div>
                        </div>

                        <div class="policy-actions">
                            <lightning-button
                                variant="brand"
                                type="submit"
                                label="Guardar Póliza"
                                class="save-btn">
                            </lightning-button>
                        </div>
                    </lightning-record-edit-form>
                </template>
                <template if:false={hasPolicy}>
                    <div class="policy-state policy-state--error">
                        <lightning-icon icon-name="utility:warning" size="small"></lightning-icon>
                        <p>{errorMsg}</p>
                        <button class="action-btn primary" onclick={handleReintentar}>Reintentar</button>
                    </div>
                </template>
            </template>
        </template>
    </div>
</template>
