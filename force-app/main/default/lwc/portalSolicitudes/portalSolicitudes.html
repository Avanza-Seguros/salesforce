<template>
    <div class="solicitudes">
        <template lwc:if={cargando}>
            <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
        </template>
        <div lwc:if={error} class="aviso aviso_error" role="alert">{error}</div>
        <div lwc:if={exito} class="aviso aviso_ok" role="status">{exito}</div>

        <!-- Formulario de una solicitud nueva -->
        <template lwc:if={formulario}>
            <div class="tarjeta_form">
                <div class="cabecera">
                    <div>
                        <h2 class="t2">Nueva solicitud</h2>
                        <p class="subtitulo">Agrega las altas, bajas y cambios que necesitas. Se registran en tu póliza y tu asesor los tramita con la aseguradora.</p>
                    </div>
                </div>
                <div class="modos" role="group" aria-label="Cómo enviar la solicitud">
                    <button class={claseModoArchivo} data-modo="archivo" onclick={handleModo} aria-pressed={pressedArchivo}>
                        <span class="modo_titulo">Subir archivo</span>
                        <span class="modo_sub">Excel o CSV con todos los datos</span>
                    </button>
                    <button class={claseModoManual} data-modo="manual" onclick={handleModo} aria-pressed={pressedManual}>
                        <span class="modo_titulo">Capturar uno por uno</span>
                        <span class="modo_sub">Para pocos movimientos</span>
                    </button>
                </div>

                <!-- Subir archivo con todos los datos -->
                <template lwc:if={enArchivo}>
                    <!-- El archivo trae cualquier combinación de altas, bajas y cambios, cada uno con su fecha (columna Tipo de movimiento). -->
                    <div class="movimiento">
                        <template lwc:if={hayListado}>
                            <div class="listado">
                                <div class="listado_cabecera">
                                    <span class="listado_nombre">{listado.nombre}</span>
                                    <span class="celda_sub">{textoListado}</span>
                                    <button class="enlace quitar" onclick={handleQuitarListado}>Cambiar archivo</button>
                                </div>
                                <p lwc:if={listado.aviso} class="nota">{listado.aviso}</p>
                                <p lwc:if={columnasReconocidas} class="nota">{columnasReconocidas}</p>
                                <template lwc:if={listadoConDatos}>
                                    <div class="tabla_contenedor tabla_archivo">
                                        <table class="tabla">
                                            <thead>
                                                <tr>
                                                    <template for:each={vistaEncabezados} for:item="h"><th key={h.key}>{h.t}</th></template>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={vistaFilas} for:item="f">
                                                    <tr key={f.key} class={f.clase}>
                                                        <template for:each={f.celdas} for:item="c"><td key={c.key}>{c.t}</td></template>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </div>
                        </template>
                        <template lwc:else>
                            <label class="zona" ondragover={handleSobreZona} ondrop={handleSoltar}>
                                <span class="zona_titulo">{textoZona}</span>
                                <span class="nota">Excel (.xlsx, .xls) o CSV con un renglón por movimiento, hasta 4 MB. Te mostramos lo que trae antes de enviarlo.</span>
                                <input type="file" accept=".xlsx,.xls,.xlsm,.csv,.txt" onchange={handleListado} class="oculto" disabled={leyendo} />
                            </label>
                            <p class="nota"><button class="enlace" onclick={handlePlantilla}>Descargar plantilla genérica</button>
                                · un solo Excel para altas, bajas y cambios; el sistema identifica cada movimiento</p>
                        </template>
                    </div>
                </template>

                <!-- Capturar uno por uno -->
                <template lwc:else>
                <template for:each={filasMovimiento} for:item="m">
                    <div key={m.key} class="movimiento">
                        <div class="movimiento_cabecera">
                            <span class="numero">{m.numero}</span>
                            <lightning-combobox class="tipo" label="Movimiento" variant="label-hidden" value={m.tipo} options={opcionesTipo}
                                data-key={m.key} onchange={handleTipo}></lightning-combobox>
                            <button lwc:if={m.puedeQuitar} class="enlace quitar" data-key={m.key} onclick={handleQuitar}>Quitar</button>
                        </div>
                        <div class="campos">
                            <template lwc:if={m.conRegistro}>
                                <!-- Póliza (las del contratante; la actual por defecto) y el registro de esa póliza. -->
                                <lightning-combobox class="ancho" label="Póliza" value={m.polizaId} options={opcionesPoliza}
                                    placeholder="Elige la póliza" data-key={m.key} onchange={handlePoliza} required
                                    field-level-help="Si tienes varias pólizas (pool), aquí aparecen todas las relacionadas."></lightning-combobox>
                                <div class="ancho registro">
                                    <div lwc:if={m.filtros} class="filtros" role="group" aria-label="Mostrar">
                                        <span class="celda_sub">Mostrar:</span>
                                        <template for:each={m.filtros} for:item="f">
                                            <button key={f.key} class={f.clase} data-key={m.key} data-filtro={f.valor} onclick={handleFiltro}
                                                aria-pressed={f.pressed}>{f.texto}</button>
                                        </template>
                                    </div>
                                    <!-- Lista desplegable en la que también se escribe para buscar. -->
                                    <c-buscador-registro label={etiquetaRegistro} value={m.registroId} options={m.opcionesRegistro}
                                        placeholder={m.placeholderRegistro} data-key={m.key} data-campo="registroId" onchange={handleCampo} required></c-buscador-registro>
                                    <p lwc:if={m.avisoPoliza} class="nota">{m.avisoPoliza}</p>
                                </div>
                            </template>
                            <p lwc:if={m.esCambio} class="nota ancho">Captura solo los datos que cambian.</p>
                            <template for:each={m.campos} for:item="c">
                                <template lwc:if={c.esLista}>
                                    <lightning-combobox key={c.key} label={c.etiqueta} value={c.valor} options={c.opciones} data-key={m.key}
                                        data-campo={c.clave} onchange={handleDato} required={c.requerido}></lightning-combobox>
                                </template>
                                <template lwc:else>
                                    <lightning-input key={c.key} type={c.tipoInput} label={c.etiqueta} value={c.valor} data-key={m.key}
                                        data-campo={c.clave} onchange={handleDato} required={c.requerido}></lightning-input>
                                </template>
                            </template>
                            <template lwc:if={m.conTitular}>
                                <c-buscador-registro class="ancho" label="Titular" value={m.titularId} options={opcionesTitular}
                                    placeholder="Elige o escribe el nombre o certificado del titular" data-key={m.key} data-campo="titularId" onchange={handleCampo} required></c-buscador-registro>
                            </template>
                            <div>
                                <lightning-input type="date" label={m.etiquetaFecha} value={m.fecha} data-key={m.key} data-campo="fecha" onchange={handleCampo}
                                    min={m.minFecha} message-when-range-underflow={textoRetroactivo}></lightning-input>
                                <p lwc:if={m.notaFecha} class="nota nota_aviso">{m.notaFecha}</p>
                            </div>
                            <lightning-input class="ancho" label={m.etiquetaDetalle} value={m.detalle} data-key={m.key} data-campo="detalle"
                                onchange={handleCampo} required={m.detalleRequerido} max-length="1000"></lightning-input>
                        </div>
                    </div>
                </template>
                <button class="enlace agregar" onclick={handleAgregar}>+ Agregar otro movimiento</button>
                </template>

                <lightning-textarea label="Comentario (opcional)" value={comentario} onchange={handleComentario} max-length="4000"
                    class="comentario"></lightning-textarea>
                <!-- Documentos de las altas y cambios: cada uno se identifica y queda en el registro que corresponde. -->
                <section lwc:if={conDocumentos} class="documentos" aria-label="Documentos">
                    <h3 class="documentos_titulo">Documentos (opcional)</h3>
                    <p class="nota">{textoDocumentos}</p>
                    <div lwc:if={esPersonas} class="nota documentos_ra">
                        <p>Si solicitas reconocimiento de antigüedad, adjunta los documentos según la procedencia del asegurado (hasta 3 MB cada uno):</p>
                        <ul>
                            <li><strong>Viene de otro seguro colectivo:</strong> carta de antigüedad expedida hace no más de 30 días naturales.</li>
                            <li><strong>Viene de un seguro de GMM individual:</strong> carátula de la póliza y comprobante de pago.</li>
                        </ul>
                        <p>En ambos casos no deben haber pasado más de 30 días naturales sin cobertura entre la baja del seguro anterior y esta alta.</p>
                    </div>
                    <template for:each={listaDocumentos} for:item="d">
                        <div key={d.key} class="documento">
                            <div class="documento_archivo">
                                <span class="documento_nombre">{d.nombre}</span> <span class="celda_sub">{d.tamanoTxt}</span>
                                <button class="enlace quitar" data-key={d.key} onclick={handleQuitarDocumento}>Quitar</button>
                            </div>
                            <div class="campos">
                                <lightning-combobox label="¿Qué documento es?" value={d.tipoTxt} options={opcionesTipoDocumento} data-key={d.key}
                                    data-campo="tipo" onchange={handleDocumento} required></lightning-combobox>
                                <lightning-input lwc:if={d.esOtro} label="Nombre del documento (opcional)" value={d.descripcion} data-key={d.key}
                                    data-campo="descripcion" onchange={handleDocumento} max-length="80"></lightning-input>
                                <c-buscador-registro label={etiquetaRegistro} value={d.movimientoTxt} options={opcionesCandidato} data-key={d.key}
                                    data-campo="movimiento" onchange={handleDocumento} placeholder="¿A quién corresponde?" required></c-buscador-registro>
                            </div>
                        </div>
                    </template>
                    <label class="zona zona_documentos" ondragover={handleSobreZona} ondrop={handleSoltarDocumentos}>
                        <span class="zona_titulo">Elige o arrastra aquí los documentos</span>
                        <span class="nota">PDF, imagen o Word, hasta 3 MB cada uno. Intentamos reconocer de quién es cada uno; revísalo antes de enviar.</span>
                        <input type="file" multiple accept=".pdf,.jpg,.jpeg,.png,.doc,.docx" onchange={handleDocumentos} class="oculto" disabled={enviando} />
                    </label>
                </section>
                <p lwc:if={avance} class="nota" role="status">{avance}</p>
                <div class="acciones">
                    <button class="boton_secundario" onclick={handleCancelar} disabled={enviando}>Cancelar</button>
                    <button class="boton" onclick={handleEnviar} disabled={enviando}>Enviar solicitud</button>
                </div>
            </div>
        </template>

        <!-- Solicitudes enviadas -->
        <template lwc:elseif={verLista}>
            <div class="cabecera">
                <div>
                    <h2 class="t2">Solicitudes</h2>
                    <p class="subtitulo">Pide altas, bajas o cambios de la póliza y sigue su avance.</p>
                </div>
                <button lwc:if={puedeSolicitar} class="boton grad" onclick={handleNueva}>
                    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
                    Nueva solicitud
                </button>
            </div>
            <p lwc:if={avisoSinPermiso} class="nota">{avisoSinPermiso}</p>
            <template lwc:if={haySolicitudes}>
                <ul class="lista">
                    <template for:each={lista} for:item="s">
                        <li key={s.folio} class="solicitud">
                            <div class="solicitud_cabecera">
                                <span class="folio">{s.numero}</span>
                                <span class="celda_sub">{s.fechaTexto}</span>
                                <span class="resumen">{s.resumen}</span>
                                <span class={s.claseEstado}>{s.estadoTxt}</span>
                            </div>
                            <div class="solicitud_meta">
                                <span lwc:if={s.avance}>{s.avance}</span>
                                <span lwc:if={s.endososTexto}>{s.endososTexto}</span>
                                <span lwc:if={s.documentosTexto}>{s.documentosTexto}</span>
                                <button class="enlace" data-folio={s.folio} onclick={handleVer}>{s.textoVer}</button>
                            </div>
                            <p lwc:if={s.respuesta} class="respuesta">{s.respuesta}</p>
                            <!-- Detalle: datos de la solicitud y los movimientos que pidió el cliente. -->
                            <div lwc:if={s.abierta} class="detalle">
                                <p class="detalle_titulo">Detalle de la solicitud</p>
                                <div class="detalle_datos">
                                    <span>Origen: <strong>Del sitio</strong></span>
                                    <span>Caso: <strong>{s.caso}</strong></span>
                                    <span lwc:if={s.enviadaPor}>Enviada por: <strong>{s.enviadaPor}</strong></span>
                                    <span>Archivo: <strong>{s.archivoTxt}</strong></span>
                                    <span>Registros: <strong>{s.registrosTxt}</strong></span>
                                    <span lwc:if={s.seguimientoTxt}>Seguimiento: <span class={s.claseSeguimiento}>{s.seguimientoTxt}</span></span>
                                    <span lwc:if={s.cierreTxt}>Cierre: <strong>{s.cierreTxt}</strong></span>
                                </div>
                                <template lwc:if={s.hayMovimientos}>
                                    <p class="detalle_titulo">Movimientos solicitados</p>
                                    <div class="tabla_contenedor">
                                        <table class="tabla">
                                            <thead>
                                                <tr>
                                                    <th>{etiquetaClave}</th><th>Nombre</th>
                                                    <th lwc:if={esPersonas}>Parentesco</th>
                                                    <th>Estado</th>
                                                    <th lwc:if={esPersonas}>Fecha de nacimiento</th>
                                                    <th>Fecha de movimiento</th><th>Seguimiento</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={s.movimientos} for:item="m">
                                                    <tr key={m.key}>
                                                        <td>{m.clave}</td><td>{m.nombre}</td>
                                                        <td lwc:if={esPersonas}>{m.parentesco}</td>
                                                        <td><span class={m.claseTipo}>{m.tipo}</span></td>
                                                        <td lwc:if={esPersonas}>{m.nacimientoTxt}</td>
                                                        <td>{m.fechaTxt}</td>
                                                        <td><span class={m.claseSeguimiento}>{m.seguimiento}</span></td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                                <ul lwc:elseif={s.hayDetalle} class="detalle_lista">
                                    <template for:each={s.detalle} for:item="l">
                                        <li key={l}>{l}</li>
                                    </template>
                                </ul>
                                <p lwc:else class="nota">Tu asesor todavía no registra los movimientos de esta solicitud.</p>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <div lwc:elseif={datos} class="empty">Aún no hay solicitudes de esta póliza.</div>
        </template>
        <template lwc:else>
            <p lwc:if={avisoSinPermiso} class="nota">{avisoSinPermiso}</p>
            <button class="boton_secundario" onclick={handleCancelar}>Regresar</button>
        </template>
    </div>
</template>
