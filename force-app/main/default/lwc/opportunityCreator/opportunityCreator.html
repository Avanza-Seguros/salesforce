                                    <lightning-icon icon-name="utility:add" size="xx-small"></lightning-icon>
                                    Agregar otra cotización
                                </button>
                            </div>
                        </div>
                    </template>
                    <template if:true={hasEditableQuotes}>
                        <div class="unified-section edit-quotes-section" style="margin-top:1.25rem;">
                            <div class="section-header-compact">
                                <div class="section-icon compare-icon">
                                    <lightning-icon icon-name="utility:edit" size="small"></lightning-icon>
                                </div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Revisar y editar cotizaciones</h2>
                                    <p class="section-subtitle">Verifica el producto de cada cotización antes de crearlas.</p>
                                </div>
                                <div class="section-badge compare-badge">{editableQuotesCount} cotizaciones</div>
                            </div>

                            <div class="edit-quotes-grid">
                                <template for:each={editableQuotes} for:item="q" for:index="idx">
                                    <article key={q.id} class="edit-quote-card">
                                        <header class="edit-quote-card__head">
                                            <span class="edit-quote-card__aseg">{q.compania}</span>
                                            <template if:true={q.esGanadora}>
                                                <span class="edit-quote-card__badge">★ Recomendada</span>
                                            </template>
                                        </header>
                                        <div class="edit-quote-card__body">
                                            <div class="eq-field-full">
                                                <lightning-combobox label="Aseguradora" value={q.aseguradoraId}
                                                    options={q.aseguradoras} placeholder="Selecciona la aseguradora"
                                                    data-index={idx} onchange={handleQuoteAseguradoraChange}>
                                                </lightning-combobox>
                                            </div>
                                            <div class="eq-field-full">
                                                <lightning-combobox label="Producto" value={q.productId}
                                                    options={q.productos} placeholder="Selecciona un producto"
                                                    data-index={idx} onchange={handleQuoteProductChange}>
                                                </lightning-combobox>
                                                <template if:true={q.sinProductos}>
                                                    <p class="eq-warn">No hay productos de esta aseguradora/ramo. Elige otro o da uno de alta.</p>
                                                </template>
                                            </div>
                                            <div class="eq-row">
                                                <lightning-input label="Plan" value={q.plan}
                                                    data-index={idx} data-field="plan" onchange={handleQuoteFieldChange}></lightning-input>
                                                <lightning-input type="number" formatter="currency" step="0.01" label="Prima" value={q.primaTotal}
                                                    data-index={idx} data-field="primaTotal" onchange={handleQuoteFieldChange}></lightning-input>
                                            </div>
                                            <lightning-combobox label="Frecuencia de prima" value={q.frecuencia}
                                                options={frecuenciaOptions} placeholder="Selecciona la frecuencia"
                                                data-index={idx} onchange={handleQuoteFrecuenciaChange}></lightning-combobox>
                                            <lightning-input type="date" label="Vigencia" value={q.vigencia}
                                                data-index={idx} data-field="vigencia" onchange={handleQuoteFieldChange}></lightning-input>
                                        </div>
                                    </article>
                                </template>
                            </div>
                            <div class="edit-quotes-footer">
                                <button class="action-btn primary edit-quotes-accept"
                                        onclick={handleCrearCotizaciones} disabled={isSaving}>
                                    <lightning-icon icon-name="utility:check" size="xx-small"></lightning-icon>
                                    Aceptar y crear cotizaciones
                                </button>
                            </div>
                        </div>
                    </template>
                    <!-- ====================================================== -->
                    <!-- SECCIÓN 4.B: COMPARATIVA DE COTIZACIONES               -->
                    <!-- Sólo se muestra si hay 2 o más cotizaciones            -->
                    <!-- ====================================================== -->
                    <template if:true={hasQuoteComparison}>
                        <div class="unified-section comparison-section">
                            <div class="section-header-compact">
                                <div class="section-icon compare-icon">
                                    <lightning-icon icon-name="utility:comparison" size="small"></lightning-icon>
                                </div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Comparativa de Cotizaciones</h2>
                                    <p class="section-subtitle">Compara prima, estado y vigencia para elegir la mejor opción</p>
                                </div>
                                <div class="section-badge compare-badge">{comparisonSummary.totalQuotes} cotizaciones</div>
                            </div>

                            <!-- Comparativo generado por la IA (lo mismo que la pestaña "Comparativo IA") -->
                            <template if:true={hasComparativoHtml}>
                                <div class="comparativo-ia">
                                    <div class="comparativo-ia__host" lwc:dom="manual"></div>
                                </div>
                            </template>

                            <!-- Comparativa de coberturas (cobertura × aseguradora) -->
                            <template if:true={hasCoberturasComparadas}>
                                <h3 class="slds-text-title_caps" style="margin:1rem 0 0.5rem 0;">Comparativa de coberturas</h3>
                                <div class="cov-table-wrap">
                                    <table class="cov-table">
                                        <thead>
                                            <tr>
                                                <th scope="col" class="cov-field">Cobertura</th>
                                                <template for:each={coberturasComparadas.cols} for:item="c">
                                                    <th key={c.key} scope="col" class="cov-col">{c.name}</th>
                                                </template>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={coberturasComparadas.rows} for:item="row">
                                                <tr key={row.key} class={row.rowClass}>
                                                    <th scope="row" class="cov-field">{row.label}</th>
                                                    <template for:each={row.cells} for:item="cell">
                                                        <td key={cell.key} class={cell.cls}>{cell.value}</td>
                                                    </template>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </template>

                            <!-- KPIs de la comparativa (solo si NO hay comparativo de IA) -->
                            <div class="comparison-kpis" if:false={hasComparativoHtml}>
                                <div class="kpi-card kpi-best-price">
                                    <div class="kpi-icon">
                                        <lightning-icon icon-name="utility:currency" size="small"></lightning-icon>
                                    </div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Mejor precio</span>
                                        <span class="kpi-value">{comparisonSummary.bestPriceFormatted}</span>
                                        <span class="kpi-detail">{comparisonSummary.bestPriceCompany}</span>
                                    </div>
                                </div>
                                <div class="kpi-card kpi-highest-price">
                                    <div class="kpi-icon">
                                        <lightning-icon icon-name="utility:up" size="small"></lightning-icon>
                                    </div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Precio más alto</span>
                                        <span class="kpi-value">{comparisonSummary.highestPriceFormatted}</span>
                                        <span class="kpi-detail">{comparisonSummary.highestPriceCompany}</span>
                                    </div>
                                </div>
                                <div class="kpi-card kpi-average">
                                    <div class="kpi-icon">
                                        <lightning-icon icon-name="utility:chart" size="small"></lightning-icon>
                                    </div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Prima promedio</span>
                                        <span class="kpi-value">{comparisonSummary.averageFormatted}</span>
                                        <span class="kpi-detail">{comparisonSummary.totalQuotes} cotizaciones</span>
                                    </div>
                                </div>
                                <div class="kpi-card kpi-savings">
                                    <div class="kpi-icon">
                                        <lightning-icon icon-name="utility:success" size="small"></lightning-icon>
                                    </div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Ahorro potencial</span>
                                        <span class="kpi-value">{comparisonSummary.savingsFormatted}</span>
                                        <span class="kpi-detail">{comparisonSummary.savingsPercent}% vs. más alto</span>
                                    </div>
                                </div>
                                <div class="kpi-card kpi-coverage">
                                    <div class="kpi-icon">
                                        <lightning-icon icon-name="utility:shield" size="small"></lightning-icon>
                                    </div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Más coberturas</span>
                                        <span class="kpi-value">{comparisonSummary.mostCoveragesCount}</span>
                                        <span class="kpi-detail">{comparisonSummary.mostCoveragesCompany}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- ============================================== -->
                            <!-- DOCUMENTO DEL COMPARATIVO (solo si NO hay IA)  -->
                            <!-- ============================================== -->
                            <template if:true={showComparativaDoc}>
                                <div class="comparativo-doc">
                                    <div class="doc-head">
                                        <h1>Comparativo de Seguro de {comparativoData.ramoLabel}</h1>
                                        <p>{comparativoData.opportunityName} · {comparativoData.clienteName} · Vigencia {comparativoData.vigInicio} – {comparativoData.vigFin}</p>
                                        <span class="doc-tag">{comparativoData.totalQuotes} aseguradoras comparadas · Cotizado por Avanza Seguro</span>
                                    </div>

                                    <table class="doc-table">
                                        <thead>
                                            <tr>
                                                <th class="doc-th doc-th-lbl">Cobertura</th>
                                                <template for:each={comparativoData.columns} for:item="col">
                                                    <th key={col.Id} class={col.headerClass}>
                                                        {col.name}
                                                        <template if:true={col.hasBadge}>
                                                            <span class="doc-rec-badge">{col.badge}</span>
                                                        </template>
                                                    </th>
                                                </template>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr class="doc-row-price">
                                                <td class="doc-cell doc-cell-lbl doc-cell-lbl-price">
                                                    <span class="doc-cn">PRECIO ANUAL (Prima Total)</span>
                                                </td>
                                                <template for:each={comparativoData.columns} for:item="col">
                                                    <td key={col.Id} class={col.bodyClass}>
                                                        <strong>{col.priceFormatted}</strong>
                                                        <template if:true={col.hasPriceSub}>
                                                            <span class="doc-sub">{col.priceSub}</span>
                                                        </template>
                                                    </td>
                                                </template>
                                            </tr>
                                            <tr>
                                                <td class="doc-cell doc-cell-lbl">
                                                    <span class="doc-cn">Coberturas incluidas (total)</span>
                                                    <span class="doc-cd">Número de coberturas que trae cada cotización</span>
                                                </td>
                                                <template for:each={comparativoData.columns} for:item="col">
                                                    <td key={col.Id} class={col.bodyClass}>{col.coverageCount}</td>
                                                </template>
                                            </tr>
                                            <template for:each={comparativoData.rows} for:item="row">
                                                <tr key={row.key}>
                                                    <td class="doc-cell doc-cell-lbl">
                                                        <span class="doc-cn">{row.name}</span>
                                                    </td>
                                                    <template for:each={row.cells} for:item="cell">
                                                        <td key={cell.key} class={cell.cellClass}>{cell.text}</td>
                                                    </template>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>

                                    <p class="doc-note">
                                        Las columnas resaltadas en naranja son las opciones recomendadas según precio y número de coberturas.
                                        Este documento es informativo; los detalles finales (sumas aseguradas, deducibles y coaseguros) se definen en cada póliza.
                                    </p>

                                    <div class="doc-recs">
                                        <h2>Las mejores opciones — tú decides</h2>
                                        <div class="doc-twocol">
                                            <template for:each={comparativoData.cards} for:item="card">
                                                <div key={card.key} class="doc-card doc-card-win">
                                                    <h3>{card.title}</h3>
                                                    <p>{card.text}</p>
                                                </div>
                                            </template>
                                        </div>
                                    </div>

                                    <div class="doc-decide">
                                        <h2>Recomendación</h2>
                                        <div class="doc-bottom">{comparativoData.recomendacion}</div>
                                    </div>

                                    <div class="doc-glos">
                                        <h2>Glosario — términos de seguros en palabras sencillas</h2>
                                        <dl>
                                            <dt>Prima</dt><dd>El precio del seguro: lo que pagas por estar cubierto durante el periodo de vigencia.</dd>
                                            <dt>Cobertura</dt><dd>Cada uno de los riesgos o servicios que la aseguradora se compromete a pagar o brindar.</dd>
                                            <dt>Suma asegurada</dt><dd>El monto máximo que la aseguradora puede pagarte por una cobertura.</dd>
                                            <dt>Deducible</dt><dd>La parte que tú pagas de tu bolsillo cuando usas el seguro; el resto lo cubre la aseguradora.</dd>
                                            <dt>Coaseguro</dt><dd>Porcentaje del gasto que el asegurado paga después del deducible.</dd>
                                            <dt>Vigencia</dt><dd>Periodo durante el cual la póliza está activa y te protege.</dd>
                                            <dt>Pérdida total</dt><dd>Cuando el bien asegurado se daña tanto, o se pierde, que la aseguradora paga su valor completo en vez de repararlo.</dd>
                                            <dt>Responsabilidad Civil</dt><dd>Cubre los daños que tú le causes a otras personas o a sus bienes.</dd>
                                        </dl>
                                    </div>

                                    <div class="doc-foot">
                                        Documento generado el {comparativoData.generatedAt} con base en las cotizaciones registradas en Salesforce.
                                        Información informativa, no es una póliza. · Avanza Seguro Consultores.
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </template>
                <!-- En modo CREACIÓN -->
                <template if:false={isEditMode}>
                    <!-- Comparativa (vista previa desde PDFs, sin guardar) -->
                    <template if:true={hasQuoteComparison}>
                        <div class="unified-section comparison-section">
                            <div class="section-header-compact">
                                <div class="section-icon compare-icon">
                                    <lightning-icon icon-name="utility:comparison" size="small"></lightning-icon>
                                </div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Comparativa de Cotizaciones (vista previa)</h2>
                                    <p class="section-subtitle">Datos extraídos de los PDFs. Aún NO se han guardado.</p>
                                </div>
                                <div class="section-badge compare-badge">{comparisonSummary.totalQuotes} cotizaciones</div>
                                <button class="action-btn primary section-action-btn print-comparativo-btn"
                                        onclick={handlePrintComparativo} title="Imprimir o guardar como PDF">
                                    <lightning-icon icon-name="utility:print" size="xx-small"></lightning-icon>
                                    Imprimir / PDF
                                </button>
                            </div>

                            <!-- Comparativo generado por la IA (tal cual lo regresa el Prompt Builder) -->
                            <template if:true={hasComparativoHtml}>
                                <div class="comparativo-ia">
                                    <div class="comparativo-ia__host" lwc:dom="manual"></div>
                                </div>
                            </template>

                            <!-- KPIs (solo si NO hay comparativo de IA) -->
                            <div class="comparison-kpis" if:false={hasComparativoHtml}>
                                <div class="kpi-card kpi-best-price">
                                    <div class="kpi-icon"><lightning-icon icon-name="utility:currency" size="small"></lightning-icon></div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Mejor precio</span>
                                        <span class="kpi-value">{comparisonSummary.bestPriceFormatted}</span>
                                        <span class="kpi-detail">{comparisonSummary.bestPriceCompany}</span>
                                    </div>
                                </div>
                                <div class="kpi-card kpi-highest-price">
                                    <div class="kpi-icon"><lightning-icon icon-name="utility:up" size="small"></lightning-icon></div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Precio más alto</span>
                                        <span class="kpi-value">{comparisonSummary.highestPriceFormatted}</span>
                                        <span class="kpi-detail">{comparisonSummary.highestPriceCompany}</span>
                                    </div>
                                </div>
                                <div class="kpi-card kpi-savings">
                                    <div class="kpi-icon"><lightning-icon icon-name="utility:success" size="small"></lightning-icon></div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Ahorro potencial</span>
                                        <span class="kpi-value">{comparisonSummary.savingsFormatted}</span>
                                        <span class="kpi-detail">{comparisonSummary.savingsPercent}% vs. más alto</span>
                                    </div>
                                </div>
                                <div class="kpi-card kpi-coverage">
                                    <div class="kpi-icon"><lightning-icon icon-name="utility:shield" size="small"></lightning-icon></div>
                                    <div class="kpi-content">
                                        <span class="kpi-label">Más coberturas</span>
                                        <span class="kpi-value">{comparisonSummary.mostCoveragesCount}</span>
                                        <span class="kpi-detail">{comparisonSummary.mostCoveragesCompany}</span>
                                    </div>
                                </div>
                            </div>

                            <!-- Documento comparativo (solo si NO hay comparativo de IA) -->
                            <template if:true={showComparativaDoc}>
                                <div class="comparativo-doc">
                                    <div class="doc-head">
                                        <h1>Comparativo de Seguro de {comparativoData.ramoLabel}</h1>
                                        <p>{comparativoData.opportunityName} · {comparativoData.clienteName} · Vigencia {comparativoData.vigInicio} – {comparativoData.vigFin}</p>
                                        <span class="doc-tag">{comparativoData.totalQuotes} aseguradoras comparadas · Cotizado por Avanza Seguro</span>
                                    </div>
                                    <table class="doc-table">
                                        <thead>
                                            <tr>
                                                <th class="doc-th doc-th-lbl">Cobertura</th>
                                                <template for:each={comparativoData.columns} for:item="col">
                                                    <th key={col.Id} class={col.headerClass}>
                                                        {col.name}
                                                        <template if:true={col.hasBadge}><span class="doc-rec-badge">{col.badge}</span></template>
                                                    </th>
                                                </template>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <tr class="doc-row-price">
                                                <td class="doc-cell doc-cell-lbl doc-cell-lbl-price"><span class="doc-cn">PRECIO ANUAL (Prima Total)</span></td>
                                                <template for:each={comparativoData.columns} for:item="col">
                                                    <td key={col.Id} class={col.bodyClass}>
                                                        <strong>{col.priceFormatted}</strong>
                                                        <template if:true={col.hasPriceSub}><span class="doc-sub">{col.priceSub}</span></template>
                                                    </td>
                                                </template>
                                            </tr>
                                            <tr>
                                                <td class="doc-cell doc-cell-lbl"><span class="doc-cn">Coberturas incluidas (total)</span></td>
                                                <template for:each={comparativoData.columns} for:item="col">
                                                    <td key={col.Id} class={col.bodyClass}>{col.coverageCount}</td>
                                                </template>
                                            </tr>
                                            <template for:each={comparativoData.rows} for:item="row">
                                                <tr key={row.key}>
                                                    <td class="doc-cell doc-cell-lbl"><span class="doc-cn">{row.name}</span></td>
                                                    <template for:each={row.cells} for:item="cell">
                                                        <td key={cell.key} class={cell.cellClass}>{cell.text}</td>
                                                    </template>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>

                                    <div class="doc-recs">
                                        <h2>Las mejores opciones — tú decides</h2>
                                        <div class="doc-twocol">
                                            <template for:each={comparativoData.cards} for:item="card">
                                                <div key={card.key} class="doc-card doc-card-win">
                                                    <h3>{card.title}</h3>
                                                    <p>{card.text}</p>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                    <div class="doc-decide">
                                        <h2>Recomendación</h2>
                                        <div class="doc-bottom">{comparativoData.recomendacion}</div>
                                    </div>
                                </div>
                            </template>

                            <div class="readonly-banner" style="margin-top:1rem;">
                                <lightning-icon icon-name="utility:info" size="x-small"></lightning-icon>
                                <span>Es una <strong>vista previa</strong>; las cotizaciones se crearán cuando confirmes los datos.</span>
                            </div>
                        </div>
                    </template>

                    <!-- Si no hay cotizaciones del PDF, el aviso de siempre -->
                    <template if:false={hasPdfQuotes}>
                        <div class="unified-section">
                            <div class="section-header-compact">
                                <div class="section-icon"><lightning-icon icon-name="standard:quotes" size="small"></lightning-icon></div>
                                <div class="section-title-group">
                                    <h2 class="section-title">Cotizaciones</h2>
                                    <p class="section-subtitle">Las cotizaciones podrán asociarse una vez creada la oportunidad</p>
                                </div>
                            </div>
                            <div class="quotes-list-container">
                                <div class="empty-state quotes-empty">
                                    <lightning-icon icon-name="utility:info" size="medium"></lightning-icon>
                                    <p>Primero guarda la oportunidad; después podrás añadir cotizaciones desde su detalle.</p>
                                </div>
                            </div>
                        </div>
                    </template>
                </template>
                <!-- ====================================================== -->
                <!-- SECCIÓN 5: RESUMEN Y GUARDAR                           -->
                <!-- ====================================================== -->
                <div class="unified-section summary-section">
                    <div class="summary-actions">
                        <button class="action-btn secondary" onclick={handleBackToList} disabled={isSaving}>
                            <lightning-icon icon-name="utility:close" size="xx-small"></lightning-icon>
                            Cancelar
                        </button>
                        <button class="action-btn primary" onclick={saveOpportunity} disabled={isSaveDisabled}>
                            <template if:true={isSaving}>
                                <lightning-spinner alternative-text="Guardando..." size="x-small" variant="inverse"></lightning-spinner>
                                Guardando...
                            </template>
                            <template if:false={isSaving}>
                                <lightning-icon icon-name="utility:save" size="xx-small"></lightning-icon>
                                {createButtonLabel}
                            </template>
                        </button>
                    </div>
                </div>
            </div>
        </template>
        <!-- ============================================================ -->
        <!-- NUEVO - VISTA CREAR DESDE PDFs                                -->
        <!-- ============================================================ -->
        <template if:true={showPdfView}>
            <div class="back-to-list">
                <button class="back-btn" onclick={handleBackToList}>
                    <lightning-icon icon-name="utility:back" size="xx-small"></lightning-icon>
                    Volver a la lista
                </button>
            </div>
            <div class="content-container glass-effect unified-view pdf-view-container">
                <c-pdf-opportunity-creator
                    onpdfdataextracted={handlePDFDataExtracted}
                    onanalysiscomplete={handlePdfAnalysisComplete}>
                </c-pdf-opportunity-creator>
            </div>
        </template>
    </div>
</template>
