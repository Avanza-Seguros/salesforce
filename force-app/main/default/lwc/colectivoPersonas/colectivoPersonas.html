<template>
    <div class="censo">
        <template if:true={cargando}>
            <div class="censo-cargando">
                <lightning-spinner alternative-text="Procesando" size="small"></lightning-spinner>
                <p class="censo-progreso">{progreso}</p>
            </div>
        </template>

        <template if:true={errorMensaje}>
            <div class="censo-error" role="alert">
                <lightning-icon icon-name="utility:error" variant="error" size="x-small"></lightning-icon>
                <span>{errorMensaje}</span>
            </div>
        </template>

        <template if:true={sinOportunidad}>
            <div class="censo-vacio">
                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                <p lwc:if={porCrearTxt}>{porCrearTxt}</p>
                <p lwc:else>Guarda la oportunidad para cargar las cotizaciones de las aseguradoras.</p>
            </div>
        </template>

        <template if:false={sinOportunidad}>
            <!-- ====================== COMPARATIVO ====================== -->
            <template if:true={enResumen}>
                <template if:true={hayCotizaciones}>
                    <template if:true={verComparativo}>
                    <!-- Indicadores (mismo estilo que la Comparativa de Cotizaciones) -->
                    <div class="comparison-kpis">
                        <template for:each={kpis} for:item="k">
                            <div key={k.key} class={k.clase}>
                                <div class="kpi-icon">
                                    <lightning-icon icon-name={k.icono} size="small"></lightning-icon>
                                </div>
                                <div class="kpi-content">
                                    <span class="kpi-label">{k.etiqueta}</span>
                                    <span class="kpi-value">{k.valor}</span>
                                    <span class="kpi-detail">{k.detalle}</span>
                                </div>
                            </div>
                        </template>
                    </div>

                    <!-- Documento del comparativo -->
                    <div class="comparativo-doc">
                        <div class="doc-head">
                            <div class="doc-head-fila">
                                <div>
                                    <h1>{docTitulo}</h1>
                                    <template if:true={docSubtitulo}><p>{docSubtitulo}</p></template>
                                    <span class="doc-tag">{docTag}</span>
                                </div>
                                <lightning-button label="Generar comparativo PDF" icon-name="utility:pdf_ext" variant="neutral"
                                    class="doc-boton" onclick={handleComparativoPdf}></lightning-button>
                            </div>
                        </div>

                        <table class="doc-table">
                            <thead>
                                <tr>
                                    <th class="doc-th doc-th-lbl">Concepto</th>
                                    <template for:each={columnasDoc} for:item="col">
                                        <th key={col.id} class={col.headerClass}>
                                            {col.aseguradora}
                                            <template if:true={col.hayBadge}><span class="doc-rec-badge">{col.badge}</span></template>
                                        </th>
                                    </template>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="doc-row-price">
                                    <td class="doc-cell doc-cell-lbl doc-cell-lbl-price"><span class="doc-cn">{etiquetaBase}</span></td>
                                    <template for:each={precioDoc} for:item="c">
                                        <td key={c.key} class={c.clase}>
                                            <strong>{c.texto}</strong>
                                            <template if:true={c.haySub}><span class="doc-sub">{c.sub}</span></template>
                                        </td>
                                    </template>
                                </tr>
                                <template for:each={filasResumenDoc} for:item="f">
                                    <tr key={f.key}>
                                        <td class="doc-cell doc-cell-lbl">
                                            <span class="doc-cn">{f.etiqueta}</span>
                                            <template if:true={f.hayDesc}><span class="doc-cd">{f.desc}</span></template>
                                        </td>
                                        <template for:each={f.celdas} for:item="c">
                                            <td key={c.key} class={c.clase}>
                                                {c.texto}
                                                <template if:true={c.haySub}><span class="doc-sub">{c.sub}</span></template>
                                            </td>
                                        </template>
                                    </tr>
                                </template>

                                <tr class="doc-row-seccion">
                                    <td class="doc-cell doc-cell-seccion" colspan={columnasTotal}>{tituloPlan}</td>
                                </tr>
                                <template for:each={filasPlanDoc} for:item="f">
                                    <tr key={f.key}>
                                        <td class="doc-cell doc-cell-lbl"><span class="doc-cn">{f.etiqueta}</span></td>
                                        <template for:each={f.celdas} for:item="c">
                                            <td key={c.key} class={c.clase}>{c.texto}</td>
                                        </template>
                                    </tr>
                                </template>

                                <template if:true={hayFormasPago}>
                                    <tr class="doc-row-seccion">
                                        <td class="doc-cell doc-cell-seccion" colspan={columnasTotal}>Formas de pago (total anual)</td>
                                    </tr>
                                    <template for:each={filasFormasPagoDoc} for:item="f">
                                        <tr key={f.key}>
                                            <td class="doc-cell doc-cell-lbl"><span class="doc-cn">Pago {f.forma}</span></td>
                                            <template for:each={f.celdas} for:item="c">
                                                <td key={c.key} class={c.clase}>
                                                    {c.texto}
                                                    <template if:true={c.haySub}><span class="doc-sub">{c.sub}</span></template>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </template>

                                <template if:true={hayUbicaciones}>
                                    <tr class="doc-row-seccion">
                                        <td class="doc-cell doc-cell-seccion" colspan={columnasTotal}>Ubicaciones (prima neta)</td>
                                    </tr>
                                    <template for:each={filasUbicacionesDoc} for:item="f">
                                        <tr key={f.key}>
                                            <td class="doc-cell doc-cell-lbl">
                                                <span class="doc-cn">{f.nombre}</span>
                                                <template if:true={f.hayDireccion}><span class="doc-cd">{f.direccion}</span></template>
                                            </td>
                                            <template for:each={f.celdas} for:item="c">
                                                <td key={c.key} class={c.clase}>
                                                    {c.texto}
                                                    <template if:true={c.haySub}><span class="doc-sub">{c.sub}</span></template>
                                                </td>
                                            </template>
                                        </tr>
                                    </template>
                                </template>
                            </tbody>
                        </table>

                        <p class="doc-note">
                            La columna resaltada en naranja es la de menor prima ({etiquetaBase}). Los valores en amarillo cambian entre
                            aseguradoras: compara también las condiciones, no solo el precio. Documento informativo; las condiciones finales
                            se definen en cada póliza.
                        </p>

                        <div class="doc-decide">
                            <h2>Recomendación</h2>
                            <div class="doc-bottom">{recomendacion}</div>
                        </div>
                    </div>
                    </template>

                    <template if:true={verCarga}>
                        <div class="doc-recs cotizaciones-cargadas">
                            <h2>Cotizaciones cargadas</h2>
                            <div class="doc-twocol">
                                <template for:each={tarjetas} for:item="t">
                                    <div key={t.id} class={t.claseDoc}>
                                        <div class="doc-card-encabezado">
                                            <h3>{t.aseguradora}</h3>
                                            <template if:true={t.mejor}><span class="chip-mejor">Mejor prima</span></template>
                                            <template if:true={t.mejorCuota}><span class="chip-cuota">Mejor cuota al millar</span></template>
                                            <template if:true={puedeEditar}>
                                                <lightning-button-icon icon-name="utility:delete" variant="bare" alternative-text="Eliminar cotización"
                                                    class="tarjeta-borrar" data-id={t.id} onclick={handleEliminar}></lightning-button-icon>
                                            </template>
                                        </div>
                                        <p><strong>{t.baseTxt}</strong> · {t.desgloseTxt}</p>
                                        <p>{t.aseguradosTxt}</p>
                                        <template if:true={t.sumaTxt}><p>{t.sumaTxt}</p></template>
                                        <template if:true={t.aseguradosAviso}><p class="tarjeta-aviso">{t.aseguradosAviso}</p></template>
                                        <p class="doc-card-sub">Cotización {t.numero}<template if:true={t.vigenciaTxt}> · Vigencia {t.vigenciaTxt}</template></p>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </template>
                </template>

                <template if:false={hayCotizaciones}>
                    <template if:true={verCarga}>
                    <div class="censo-vacio">
                        <lightning-icon icon-name="standard:quotes" size="small"></lightning-icon>
                        <p>Aún no hay cotizaciones. Sube la cotización de cada aseguradora (PDF o Excel) para compararlas.</p>
                    </div>
                    </template>
                </template>

                <template if:true={puedeCargar}>
                    <div class="censo-carga">
                        <div class="censo-carga-texto">
                            <strong>Agregar cotizaciones de aseguradoras</strong>
                            <span>{textoCarga}</span>
                        </div>
                        <div class="censo-carga-acciones">
                            <lightning-input type="file" label="Archivo de la cotización" variant="label-hidden"
                                accept=".pdf,.xlsx,.xlsm,.xls,.xlsb,.csv,.txt" multiple onchange={handleArchivo}></lightning-input>
                        </div>
                    </div>
                </template>
            </template>

            <!-- ====================== VISTA PREVIA ====================== -->
            <template if:true={enVista}>
                <div class="paso-titulo">
                    <span class="paso-num">1</span>
                    <div>
                        <strong>Revisa la cotización de {archivoNombre}</strong>
                        <p>No se pudo crear sola: completa lo que falta y guárdala.</p>
                    </div>
                </div>

                <template if:true={hayAvisos}>
                    <div class="avisos">
                        <template for:each={avisos} for:item="a">
                            <div key={a.key} class="censo-alerta">
                                <lightning-icon icon-name="utility:warning" variant="warning" size="x-small"></lightning-icon>
                                <span>{a.texto}</span>
                            </div>
                        </template>
                    </div>
                </template>

                <div class="slds-grid slds-wrap slds-gutters_x-small">
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox label="Aseguradora" required value={enc.aseguradoraId} options={opcionesAseguradora}
                            data-campo="aseguradoraId" onchange={handleEncabezado} placeholder="Selecciona la aseguradora"></lightning-combobox>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                        <lightning-input type="date" label="Vigencia desde" value={enc.vigenciaDesde} data-campo="vigenciaDesde" onchange={handleEncabezado}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-6">
                        <lightning-input type="date" label="Vigencia hasta" value={enc.vigenciaHasta} data-campo="vigenciaHasta" onchange={handleEncabezado}></lightning-input>
                    </div>
                    <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                        <lightning-combobox label="Forma de pago" value={enc.formaPago} options={opcionesFormaPago}
                            data-campo="formaPago" onchange={handleEncabezado}></lightning-combobox>
                    </div>
                </div>

                <div class="montos-grid slds-m-top_x-small">
                    <lightning-input type="number" formatter="currency" step="0.01" label="Prima neta" value={enc.primaNeta} data-campo="primaNeta" onchange={handleEncabezado}></lightning-input>
                    <lightning-input type="number" formatter="currency" step="0.01" label="Derechos / gastos de expedición" value={enc.derechos} data-campo="derechos" onchange={handleEncabezado}></lightning-input>
                    <lightning-input type="number" formatter="currency" step="0.01" label="Recargo por pago fraccionado" value={enc.recargo} data-campo="recargo" onchange={handleEncabezado}></lightning-input>
                    <lightning-input type="number" formatter="currency" step="0.01" label="IVA" value={enc.iva} data-campo="iva" onchange={handleEncabezado}></lightning-input>
                    <lightning-input type="number" formatter="currency" step="0.01" label="Prima total" value={enc.primaTotal} data-campo="primaTotal" onchange={handleEncabezado}
                        field-level-help="Si la dejas vacía se calcula: prima neta + derechos + recargo + IVA."></lightning-input>
                </div>

                <div class="censo-stats slds-m-top_small">
                    <template if:true={hayCategoriasVista}>
                        <div class="stat"><span class="stat-num">{aseguradosVista}</span><span class="stat-lbl">{etiquetaTamanoVista}</span></div>
                    </template>
                    <template if:true={sumaVista}>
                        <div class="stat"><span class="stat-num">{sumaVista}</span><span class="stat-lbl">Suma asegurada total</span></div>
                    </template>
                    <div class="stat"><span class="stat-num">{totalVista}</span><span class="stat-lbl">Prima total</span></div>
                </div>

                <template if:true={hayCategoriasVista}>
                <template if:true={esGmm}>
                <h3 class="subtitulo">Categorías</h3>
                <div class="censo-scroll">
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer censo-tabla tabla-edicion">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Categoría</th>
                                <th scope="col">Hombres</th>
                                <th scope="col">Mujeres</th>
                                <th scope="col">Asegurados</th>
                                <th scope="col">Prima neta</th>
                                <th scope="col">Suma asegurada</th>
                                <th scope="col">Deducible</th>
                                <th scope="col">Coaseguro</th>
                                <th scope="col">Tope coaseguro</th>
                                <th scope="col">Plan / tabulador / hospitales</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={categoriasVista} for:item="c" for:index="i">
                                <tr key={c.key}>
                                    <td><lightning-input variant="label-hidden" label="Categoría" value={c.nombre} data-index={i} data-campo="nombre" onchange={handleCategoria}></lightning-input></td>
                                    <td><lightning-input type="number" variant="label-hidden" label="Hombres" value={c.hombres} data-index={i} data-campo="hombres" onchange={handleCategoria}></lightning-input></td>
                                    <td><lightning-input type="number" variant="label-hidden" label="Mujeres" value={c.mujeres} data-index={i} data-campo="mujeres" onchange={handleCategoria}></lightning-input></td>
                                    <td class="num"><strong>{c.asegurados}</strong><div class="sub">{c.tarifaTxt}</div></td>
                                    <td><lightning-input type="number" formatter="currency" step="0.01" variant="label-hidden" label="Prima neta" value={c.primaNeta} data-index={i} data-campo="primaNeta" onchange={handleCategoria}></lightning-input></td>
                                    <td><lightning-input variant="label-hidden" label="Suma asegurada" value={c.sumaAsegurada} data-index={i} data-campo="sumaAsegurada" onchange={handleCategoria}></lightning-input></td>
                                    <td><lightning-input variant="label-hidden" label="Deducible" value={c.deducible} data-index={i} data-campo="deducible" onchange={handleCategoria}></lightning-input></td>
                                    <td><lightning-input variant="label-hidden" label="Coaseguro" value={c.coaseguro} data-index={i} data-campo="coaseguro" onchange={handleCategoria}></lightning-input></td>
                                    <td><lightning-input variant="label-hidden" label="Tope de coaseguro" value={c.topeCoaseguro} data-index={i} data-campo="topeCoaseguro" onchange={handleCategoria}></lightning-input></td>
                                    <td class="mensajes">
                                        <div>{c.plan}</div>
                                        <div class="sub">{c.tabulador}</div>
                                        <div class="sub">{c.nivelHospitalario} {c.territorio}</div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
                </template>

                <template if:false={esGmm}>
                    <h3 class="subtitulo">{tituloRenglones}</h3>
                    <div class="censo-scroll">
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer censo-tabla tabla-edicion">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col">{etiquetaRenglon}</th>
                                    <template if:true={esPersonas}>
                                        <th scope="col">Hombres</th>
                                        <th scope="col">Mujeres</th>
                                        <th scope="col">Asegurados</th>
                                    </template>
                                    <template if:true={esUbicaciones}>
                                        <th scope="col">Dirección</th>
                                    </template>
                                    <th scope="col">Suma asegurada total</th>
                                    <th scope="col">Prima neta</th>
                                    <th scope="col">Coberturas</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={categoriasVista} for:item="c" for:index="i">
                                    <tr key={c.key}>
                                        <td><lightning-input variant="label-hidden" label={etiquetaRenglon} value={c.nombre} data-index={i} data-campo="nombre" onchange={handleCategoria}></lightning-input></td>
                                        <template if:true={esPersonas}>
                                            <td><lightning-input type="number" variant="label-hidden" label="Hombres" value={c.hombres} data-index={i} data-campo="hombres" onchange={handleCategoria}></lightning-input></td>
                                            <td><lightning-input type="number" variant="label-hidden" label="Mujeres" value={c.mujeres} data-index={i} data-campo="mujeres" onchange={handleCategoria}></lightning-input></td>
                                            <td><lightning-input type="number" variant="label-hidden" label="Asegurados" value={c.asegurados} data-index={i} data-campo="asegurados" onchange={handleCategoria}></lightning-input></td>
                                        </template>
                                        <template if:true={esUbicaciones}>
                                            <td><lightning-input variant="label-hidden" label="Dirección" value={c.direccion} data-index={i} data-campo="direccion" onchange={handleCategoria}></lightning-input></td>
                                        </template>
                                        <td><lightning-input type="number" formatter="currency" step="0.01" variant="label-hidden" label="Suma asegurada total" value={c.sumaAseguradaTotal} data-index={i} data-campo="sumaAseguradaTotal" onchange={handleCategoria}></lightning-input></td>
                                        <td><lightning-input type="number" formatter="currency" step="0.01" variant="label-hidden" label="Prima neta" value={c.primaNeta} data-index={i} data-campo="primaNeta" onchange={handleCategoria}></lightning-input></td>
                                        <td class="mensajes">
                                            <template if:true={c.hayParametros}><div class="sub">{c.parametrosTxt}</div></template>
                                            <template if:false={c.hayParametros}><div class="sub">Sin coberturas detalladas</div></template>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>

                <template for:each={categoriasVista} for:item="c">
                    <template if:true={c.coberturasTxt}>
                        <p key={c.key} class="nota"><strong>Coberturas adicionales ({c.nombre}):</strong> {c.coberturasTxt}</p>
                    </template>
                </template>
                <template if:true={esGmm}>
                    <template for:each={categoriasVista} for:item="c">
                        <template if:true={c.hayParametros}>
                            <p key={c.keyOtras} class="nota"><strong>Otras condiciones ({c.nombre}):</strong> {c.parametrosTxt}</p>
                        </template>
                    </template>
                </template>
                </template>

                <template if:true={hayFormasPagoVista}>
                    <h3 class="subtitulo">Formas de pago</h3>
                    <table class="slds-table slds-table_bordered slds-table_cell-buffer censo-tabla tabla-angosta">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <th scope="col">Forma</th>
                                <th scope="col" class="num">Recargo</th>
                                <th scope="col" class="num">Pagos</th>
                                <th scope="col" class="num">Primer pago</th>
                                <th scope="col" class="num">Total anual</th>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={formasPagoVista} for:item="f">
                                <tr key={f.key}>
                                    <td>{f.forma}</td>
                                    <td class="num">{f.recargoTxt}</td>
                                    <td class="num">{f.numeroPagos}</td>
                                    <td class="num">{f.primerTxt}</td>
                                    <td class="num"><strong>{f.totalTxt}</strong></td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </template>

                <template if:true={faltaAseguradora}>
                    <div class="censo-alerta">
                        <lightning-icon icon-name="utility:warning" variant="warning" size="x-small"></lightning-icon>
                        <span>Selecciona la aseguradora de la cotización para poder guardarla.</span>
                    </div>
                </template>

                <div class="censo-acciones derecha">
                    <lightning-button label="Cancelar" onclick={cancelar}></lightning-button>
                    <lightning-button label="Guardar cotización" variant="brand" icon-name="utility:save" onclick={guardar} disabled={sinGuardar}></lightning-button>
                </div>
            </template>
        </template>
    </div>
</template>
