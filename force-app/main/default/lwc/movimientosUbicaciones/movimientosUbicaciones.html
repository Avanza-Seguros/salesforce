<template>
    <template if:true={visible}>
        <div class={claseRaiz}>
            <template if:true={cargando}>
                <div class="mov-cargando"><lightning-spinner alternative-text="Procesando" size="small"></lightning-spinner></div>
            </template>

            <div class="mov-encabezado">
                <div>
                    <h3 class="mov-titulo">{titulo}</h3>
                    <p class="mov-subtitulo">{subtitulo}</p>
                </div>
                <template if:true={enOportunidad}>
                    <lightning-button label={textoAbrir} onclick={toggleAbierto}></lightning-button>
                </template>
            </div>

            <template if:true={errorMensaje}>
                <div class="mov-error" role="alert">
                    <lightning-icon icon-name="utility:error" variant="error" size="x-small"></lightning-icon>
                    <span>{errorMensaje}</span>
                </div>
            </template>

            <template if:true={mostrarCuerpo}>
                <div class="mov-stats">
                    <div class="stat"><span class="stat-num">{totalVigentes}</span><span class="stat-lbl">Vigentes</span></div>
                    <div class="stat"><span class="stat-num">{sumaVigentes}</span><span class="stat-lbl">Suma asegurada</span></div>
                    <div class="stat"><span class="stat-num">{primaVigentes}</span><span class="stat-lbl">Prima</span></div>
                    <template if:true={enPoliza}>
                        <div class="stat stat-baja"><span class="stat-num">{totalBajas}</span><span class="stat-lbl">Dadas de baja</span></div>
                    </template>
                </div>

                <!-- ====================== LISTA ====================== -->
                <template if:true={enLista}>
                    <template if:true={puedeTraer}>
                        <div class="mov-aviso">
                            <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                            <span>Parte de las ubicaciones vigentes de la póliza anterior y después aplica las altas, bajas y cambios de la renovación.
                                Si la aseguradora mandó el listado nuevo, usa «Cargar ubicaciones».</span>
                            <lightning-button label={textoTraer} icon-name="utility:download" onclick={handleTraer}></lightning-button>
                        </div>
                    </template>

                    <div class="mov-barra">
                        <div class="mov-filtros">
                            <lightning-input type="search" label="Buscar" variant="label-hidden" placeholder="Buscar por inciso, domicilio o giro"
                                value={busqueda} onchange={handleBusqueda} class="mov-buscar"></lightning-input>
                            <template if:true={enPoliza}>
                                <lightning-combobox label="Mostrar" variant="label-hidden" value={filtro} options={opcionesFiltro}
                                    onchange={handleFiltro} class="mov-filtro"></lightning-combobox>
                            </template>
                            <template lwc:if={hayAgrupacion}>
                                <lightning-input type="toggle" label="Agrupar por solicitud" checked={agruparSolicitud} onchange={toggleAgrupar}
                                    message-toggle-active="" message-toggle-inactive="" class="mov-agrupar"></lightning-input>
                            </template>
                        </div>
                        <div class="mov-acciones">
                            <template if:true={puedeEditar}>
                                <lightning-button label="Alta de ubicación" icon-name="utility:add" onclick={abrirAlta}></lightning-button>
                                <lightning-button label={textoBajaSeleccion} icon-name="utility:delete" variant="destructive-text"
                                    onclick={abrirBaja} disabled={sinSeleccion}></lightning-button>
                                <lightning-button label="Cargar ubicaciones" icon-name="utility:upload" onclick={elegirArchivo}
                                    title="Listado de ubicaciones de la aseguradora (Excel, CSV o PDF) o el PDF de un endoso"></lightning-button>
                                <input type="file" class="archivo-input slds-hide" accept=".xlsx,.xlsm,.xls,.csv,.pdf" onchange={handleArchivo} />
                            </template>
                            <!-- Excel de movimientos: solo pólizas empresariales. -->
                            <!-- En el sitio (portal) no se genera el Excel. -->
                            <template lwc:if={interno}><template if:true={conFechasMovimiento}><lightning-button label="Generar Excel" icon-name="utility:download" onclick={abrirExcel}></lightning-button></template></template>
                            <template if:true={enPoliza}><lightning-button label="Endosos" icon-name="utility:file" onclick={verEndosos}></lightning-button></template>
                            <lightning-button label={textoHistorial} icon-name="utility:history" onclick={verHistorial}></lightning-button>
                        </div>
                    </div>

                    <template if:true={sinUbicaciones}>
                        <div class="mov-vacio">
                            <lightning-icon icon-name="utility:location" size="small"></lightning-icon>
                            <p>No hay ubicaciones todavía.</p>
                        </div>
                    </template>
                    <template if:false={sinUbicaciones}>
                        <div class="mov-scroll">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                <thead>
                                    <!-- Agrupada por solicitud: el encabezado es el de las solicitudes; el de los registros va dentro de cada una. -->
                                    <template lwc:if={agrupado}>
                                        <tr class="slds-line-height_reset enc-solicitudes">
                                            <th scope="col" colspan={columnasTabla}>
                                                <div class="sol-grid">
                                                    <span></span><span>Número de movimiento</span><span>Póliza</span><span>Fecha de apertura</span>
                                                    <span>Fecha de cierre</span><span>Seguimiento</span><span></span>
                                                </div>
                                            </th>
                                        </tr>
                                    </template>
                                    <template lwc:else>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col" class="col-check"></th>
                                            <template for:each={columnasDetalle} for:item="c">
                                                <th key={c.key} scope="col" class={c.clase}>{c.label}</th>
                                            </template>
                                            <th scope="col" class="col-acciones"></th>
                                        </tr>
                                    </template>
                                </thead>
                                <template for:each={bloques} for:item="b">
                                <tbody key={b.key}>
                                    <!-- Encabezado de la solicitud del cliente (folio, fecha, quién la registró, resumen, endosos y estado). -->
                                    <template lwc:if={b.encabezado}>
                                        <!-- Número de movimiento | Póliza | Fecha de apertura | Fecha de cierre | Seguimiento (y el resumen). -->
                                        <tr class="fila-solicitud">
                                            <td colspan={columnasTabla}>
                                                <div class="sol-grid">
                                                    <lightning-button-icon icon-name={b.icono} variant="bare" size="small" alternative-text={b.textoColapsar}
                                                        title={b.textoColapsar} data-folio={b.folio} onclick={toggleSolicitud}></lightning-button-icon>
                                                    <span class="sol-folio" title={b.sub}>{b.titulo}<template lwc:if={b.continua}><span class="sol-sub"> (continúa)</span></template></span>
                                                    <span class="sol-poliza">{b.poliza}</span>
                                                    <span>{b.aperturaTxt}</span>
                                                    <span>{b.cierreTxt}</span>
                                                    <!-- Seguimiento de la solicitud: en Salesforce se cambia con un clic. -->
                                                    <span>
                                                        <template lwc:if={b.puedeSeguimiento}><c-seguimiento-selector valor={b.seguimiento} policy-id={recordId} folio={b.folio} caso-id={b.casoId}
                                                            sin-movimientos={b.sinMovimientos} oncambio={handleCambioSeguimiento}></c-seguimiento-selector></template>
                                                        <template lwc:elseif={b.seguimiento}><span class={b.claseSeguimiento}>{b.seguimiento}</span></template>
                                                    </span>
                                                    <span class="sol-extra">
                                                        <span class="sol-resumen" title={b.sub}>{b.resumen}</span>
                                                        <template lwc:if={b.endososTxt}><span class="sol-chip">{b.endososTxt}</span></template>
                                                        <template lwc:if={b.ligaCaso}><a href={b.ligaCaso} target="_blank" class="sol-sub">{b.casoTxt}</a></template>
                                                        <template lwc:if={b.folioExcel}><lightning-button variant="base" label="Excel para la aseguradora" icon-name="utility:download"
                                                            class="sol-excel" data-folio={b.folio} onclick={handleExcelSolicitud}></lightning-button></template>
                                                    </span>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <template lwc:if={b.conEncabezadoDetalle}>
                                        <tr class="fila-enc-detalle">
                                            <th scope="col" class="col-check"></th>
                                            <template for:each={columnasDetalle} for:item="c">
                                                <th key={c.key} scope="col" class={c.clase}>{c.label}</th>
                                            </template>
                                            <th scope="col" class="col-acciones"></th>
                                        </tr>
                                    </template>
                                    <template for:each={b.filas} for:item="u">
                                        <tr key={u.id} class={u.claseFila}>
                                            <td class="col-check">
                                                <template if:false={u.noSeleccionable}>
                                                    <input type="checkbox" data-id={u.id} checked={u.seleccionado} onchange={handleSeleccion}
                                                        aria-label="Seleccionar ubicación" />
                                                </template>
                                            </td>
                                            <td>{u.inciso}</td>
                                            <td>
                                                <div class="nombre"><button class="enlace-otras" data-id={u.id} data-titulo={u.direccion}
                                                    onclick={verOtrasPolizas} title="Ver si esta ubicación existe en otras pólizas">{u.direccion}</button></div>
                                                <div class="sub">{u.nombre}</div>
                                            </td>
                                            <td>{u.giro}</td>
                                            <td>{u.altaTxt}</td>
                                            <template if:true={conFechasMovimiento}><td>{u.fechaMovimientoTxt}</td></template>
                                            <template if:true={enPoliza}><td>{u.fechaCreacionTxt}</td></template>
                                            <template if:true={conFechaCierre}><td>{u.fechaCierreTxt}</td></template>
                                            <td class="num">{u.sumaTxt}</td>
                                            <td class="num">{u.primaTxt}</td>
                                            <td>
                                                <span class={u.claseEstado}>{u.estado}</span>
                                                <template if:true={u.motivoBaja}><div class="sub">{u.motivoBaja}</div></template>
                                            </td>
                                            <template if:true={enPoliza}>
                                                <!-- Seguimiento del trámite: Solicitado, En proceso o Concluido. -->
                                                <td>
                                                    <template lwc:if={u.puedeSeguimiento}><c-seguimiento-selector valor={u.seguimiento} policy-id={recordId} folio={u.solicitud}
                                                        movimiento-id={u.movimientoId} oncambio={handleCambioSeguimiento}></c-seguimiento-selector></template>
                                                    <template lwc:elseif={u.seguimiento}><span class={u.claseSeguimiento}>{u.seguimiento}</span></template>
                                                </td>
                                            </template>
                                            <td class="col-acciones">
                                                <template if:true={u.puedeCerrar}>
                                                    <lightning-button-icon icon-name="utility:check" alternative-text="Cerrar movimiento" title="Cerrar movimiento"
                                                        data-mov={u.movimientoId} onclick={cerrarMov} size="small" class="slds-m-right_xx-small"></lightning-button-icon>
                                                </template>
                                                <template if:true={u.puedeMover}>
                                                    <lightning-button-icon icon-name="utility:edit" alternative-text="Cambiar datos" title="Cambiar datos"
                                                        data-id={u.id} onclick={abrirCambio} size="small"></lightning-button-icon>
                                                    <lightning-button-icon icon-name="utility:delete" alternative-text="Dar de baja" title="Dar de baja"
                                                        data-id={u.id} onclick={abrirBaja} size="small" class="slds-m-left_xx-small"></lightning-button-icon>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                                </template>
                            </table>
                        </div>
                        <div class="mov-paginacion">
                            <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Anterior" onclick={anterior} disabled={sinAnterior}></lightning-button-icon>
                            <span>{textoPagina}</span>
                            <lightning-button-icon icon-name="utility:chevronright" alternative-text="Siguiente" onclick={siguiente} disabled={sinSiguiente}></lightning-button-icon>
                        </div>
                    </template>
                </template>

                <!-- ====================== REVISIÓN DEL ARCHIVO ====================== -->
                <template if:true={enRevision}>
                    <div class="mov-paso">
                        <strong>Diferencias de {archivoNombre} contra las ubicaciones vigentes</strong>
                        <p class="sub">{textoSinCambios} Las ubicaciones se reconocen por domicilio (o por inciso si el domicilio viene escrito distinto). Desmarca lo que no quieras aplicar.</p>
                    </div>

                    <template if:true={hayDuplicados}>
                        <div class="mov-duplicados">
                            <div class="mov-duplicados-titulo">
                                <lightning-icon icon-name="utility:ban" variant="warning" size="x-small"></lightning-icon>
                                <strong>{textoDuplicados}</strong>
                            </div>
                            <p class="mov-duplicados-sub">No se dan de alta porque ya existen. Si el archivo trae datos distintos de ese registro, el cambio aparece en Cambios.</p>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla mov-tabla-rechazos">
                                    <thead><tr>
                                        <th>Registro del archivo</th><th>Alta rechazada</th><th>Motivo</th><th>Registro que ya existe</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={duplicadosRev} for:item="d">
                                            <tr key={d.key}>
                                                <td>{d.filaTxt}</td>
                                                <td><div class="nombre">{d.nombre}</div></td>
                                                <td>{d.motivo}</td>
                                                <td>{d.existenteTxt}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>

                    <template if:true={sinDiferencias}>
                        <div class="mov-vacio"><p>El archivo coincide con las ubicaciones vigentes: no hay movimientos.</p></div>
                    </template>

                    <template if:false={sinDiferencias}>
                        <div class="slds-grid slds-wrap slds-gutters_x-small modal-form">
                            <template lwc:if={pideDatosArchivo}>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input type="date" label={etiquetaFecha} value={comun.fecha} data-campo="fecha" onchange={handleComun} required></lightning-input>
                            </div>
                            </template>
                            <template lwc:if={pideEndosoArchivo}>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input label="Número de endoso" value={comun.endoso} data-campo="endoso" onchange={handleComun}></lightning-input>
                            </div>
                            </template>
                            <template lwc:if={enPoliza}>
                                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                    <lightning-combobox label="Solicitud" value={comun.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                        onchange={handleComun} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                </div>
                            </template>
                            <template if:true={hayBajas}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                    <lightning-combobox label="Motivo de baja (general, opcional)" value={comun.motivo} options={motivos}
                                        data-campo="motivo" onchange={handleComun} placeholder="Sin motivo"></lightning-combobox>
                                </div>
                            </template>
                            <template lwc:if={pideDatosArchivo}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-input label="Comentario" value={comun.comentario} data-campo="comentario" onchange={handleComun} max-length="255"></lightning-input>
                            </div>
                            </template>
                        </div>
                        <template if:true={enPoliza}>
                            <template lwc:if={interno}>
                            <c-datos-endoso valores-iniciales={endosoLeido} archivo-inicial={documentoEndoso}></c-datos-endoso>
                            </template>
                        </template>

                        <template if:true={hayBajas}>
                            <h4 class="mov-seccion seccion-baja">{textoBajas}</h4>
                            <template if:true={hayFaltantes}>
                                <p class="sub mov-faltantes">{textoFaltantes}</p>
                            </template>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="bajas" checked={todasBajas} onchange={marcarTodos} aria-label="Todas" /></th>
                                        <th>Inciso</th><th>Domicilio</th><th>Giro</th><th>Motivo (si es distinto al general)</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={bajasRev} for:item="b">
                                            <tr key={b.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="bajas" data-key={b.key} checked={b.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{b.inciso}</td>
                                                <td><div class="nombre">{b.direccion}</div></td>
                                                <td>{b.giro}</td>
                                                <td class="col-motivo">
                                                    <lightning-combobox label="Motivo" variant="label-hidden" value={b.motivo} options={motivos}
                                                        data-key={b.key} onchange={motivoBaja} placeholder="General"></lightning-combobox>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:true={hayAltas}>
                            <h4 class="mov-seccion seccion-alta">{textoAltas}</h4>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="altas" checked={todasAltas} onchange={marcarTodos} aria-label="Todas" /></th>
                                        <th>Inciso</th><th>Domicilio</th><th>Giro</th><th class="num">Suma asegurada</th><th class="num">Prima</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={altasRev} for:item="a">
                                            <tr key={a.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="altas" data-key={a.key} checked={a.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{a.inciso}</td>
                                                <td><div class="nombre">{a.direccion}</div></td>
                                                <td>{a.giro}</td>
                                                <td class="num">{a.sumaTxt}</td>
                                                <td class="num">{a.primaTxt}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:true={hayCambios}>
                            <h4 class="mov-seccion seccion-cambio">{textoCambios}</h4>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="cambios" checked={todosCambios} onchange={marcarTodos} aria-label="Todos" /></th>
                                        <th>Inciso</th><th>Domicilio</th><th>Cambios</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={cambiosRev} for:item="c">
                                            <tr key={c.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="cambios" data-key={c.key} checked={c.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{c.inciso}</td>
                                                <td><div class="nombre">{c.direccion}</div></td>
                                                <td>
                                                    <template for:each={c.difs} for:item="d"><div key={d.key}>{d.texto}</div></template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </template>

                    <div class="mov-pie">
                        <lightning-button label="Cancelar" onclick={verLista}></lightning-button>
                        <lightning-button label="Cargar otro archivo" onclick={elegirArchivo}></lightning-button>
                        <input type="file" class="archivo-input slds-hide" accept=".xlsx,.xlsm,.xls,.csv,.pdf" onchange={handleArchivo} />
                        <template if:false={sinDiferencias}>
                            <lightning-button label="Aplicar movimientos" variant="brand" icon-name="utility:check" onclick={aplicarRevision}></lightning-button>
                        </template>
                    </div>
                </template>

                <!-- ====================== ENDOSOS ====================== -->
                <template if:true={enEndosos}>
                    <c-endosos-poliza record-id={recordId} puede-editar={puedeEditar} onregistrado={cargar}></c-endosos-poliza>
                    <div class="mov-pie">
                        <lightning-button label="Regresar" icon-name="utility:back" onclick={verLista}></lightning-button>
                    </div>
                </template>

                <!-- ====================== HISTORIAL ====================== -->
                <template if:true={enHistorial}>
                    <template if:true={sinHistorial}>
                        <div class="mov-vacio"><p>Aún no hay movimientos registrados.</p></div>
                    </template>
                    <template if:false={sinHistorial}>
                        <div class="mov-barra">
                            <div class="mov-filtros">
                                <lightning-input type="search" label="Buscar en el historial" variant="label-hidden" class="mov-buscar"
                                    placeholder="Buscar por ubicación, inciso, tipo, fecha, endoso o usuario"
                                    value={busquedaHistorial} onchange={handleBusquedaHistorial}></lightning-input>
                                <span class="sub">{textoResultadosHistorial}</span>
                            </div>
                        </div>
                        <template if:true={sinResultadosHistorial}>
                            <div class="mov-vacio"><p>Ningún movimiento coincide con la búsqueda.</p></div>
                        </template>
                        <div class="mov-scroll">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                <thead><tr>
                                    <th>Movimiento</th><th>Tipo</th><th>Fecha</th><th>Ubicación</th><th>Inciso</th><th>Endoso</th><th>Detalle</th><th>Usuario</th>
                                </tr></thead>
                                <tbody>
                                    <template for:each={historial} for:item="h">
                                        <tr key={h.id}>
                                            <td>{h.nombre}</td>
                                            <td><span class={h.claseTipo}>{h.tipo}</span></td>
                                            <td>{h.fechaTxt}</td>
                                            <td>{h.asegurado}</td>
                                            <td>{h.certificado}</td>
                                            <td>{h.endoso}</td>
                                            <td class="detalle">{h.detalleTxt}</td>
                                            <td>{h.usuario}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <div class="mov-pie">
                        <lightning-button label="Regresar" icon-name="utility:back" onclick={verLista}></lightning-button>
                    </div>
                </template>
            </template>

            <!-- ====================== MODALES ====================== -->
            <template if:true={hayModal}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <template if:true={enModalExcel}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Excel de ubicaciones por solicitud</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <template if:true={sinSolicitudesExcel}>
                                    <p class="sub">No hay registros para generar el Excel.</p>
                                </template>
                                <template if:false={sinSolicitudesExcel}>
                                    <p class="sub slds-m-bottom_x-small">Elige la solicitud: el Excel sale con sus registros, listo para enviar a la aseguradora.</p>
                                    <div class="mov-excel-lista" role="radiogroup" aria-label="Solicitudes">
                                        <template for:each={solicitudesExcel} for:item="s">
                                            <label key={s.key} class="mov-excel-fecha">
                                                <input type="radio" name="solicitud-excel" data-key={s.key} checked={s.sel} onchange={elegirSolicitudExcel} />
                                                <span><strong>{s.titulo}</strong> · {s.detalle}</span>
                                            </label>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Generar Excel" variant="brand" class="slds-m-left_x-small" icon-name="utility:download"
                                    onclick={generarExcel} disabled={sinSolicitudElegida}></lightning-button>
                            </div>
                        </template>
                        <template if:true={enModalBaja}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Baja de ubicaciones</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <p class="sub slds-m-bottom_x-small">{textoBaja}</p>
                                <ul class="mov-lista">
                                    <template for:each={bajaNombres} for:item="n"><li key={n.id}>{n.texto}</li></template>
                                </ul>
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input type="date" label="Fecha de baja" value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-combobox label="Motivo de baja (opcional)" value={form.motivo} options={motivos} data-campo="motivo"
                                            onchange={handleForm} placeholder="Sin motivo"></lightning-combobox>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={enPoliza}>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox label="Solicitud" value={form.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                                onchange={handleForm} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Comentario" value={form.comentario} data-campo="comentario" onchange={handleForm} max-length="255"></lightning-input>
                                    </div>
                                </div>
                                <template if:true={enPoliza}>
                                    <template lwc:if={interno}>
                                    <c-datos-endoso></c-datos-endoso>
                                    </template>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Dar de baja" variant="destructive" class="slds-m-left_x-small" onclick={guardarBaja}></lightning-button>
                            </div>
                        </template>

                        <template if:true={enModalAlta}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Alta de ubicación</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Domicilio (calle y número, colonia, municipio, estado, CP)" value={form.direccion} data-campo="direccion"
                                            onchange={handleForm} required max-length="255"
                                            field-level-help="Identifica a la ubicación: si ya estuvo en la póliza y se dio de baja, se reactiva."></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_2-of-3">
                                        <lightning-input label="Nombre (ej. Bodega Querétaro)" value={form.nombre} data-campo="nombre" onchange={handleForm} max-length="80"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" label="Inciso" value={form.inciso} data-campo="inciso" onchange={handleForm}
                                            field-level-help="Si lo dejas vacío se usa el siguiente número."></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Giro" value={form.giro} data-campo="giro" onchange={handleForm} max-length="40"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Suma asegurada" value={form.sumaAsegurada}
                                            data-campo="sumaAsegurada" onchange={handleForm}></lightning-input>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Prima" value={form.prima}
                                            data-campo="prima" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input type="date" label={etiquetaFecha} value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={enPoliza}>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox label="Solicitud" value={form.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                                onchange={handleForm} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                        </div>
                                    </template>
                                </div>
                                <template if:true={enPoliza}>
                                    <template lwc:if={interno}>
                                    <c-datos-endoso></c-datos-endoso>
                                    </template>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Dar de alta" variant="brand" class="slds-m-left_x-small" onclick={guardarAlta}></lightning-button>
                            </div>
                        </template>

                        <template if:true={enModalEndoso}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Endoso {endosoInfo.numero} · {endosoInfo.tipo}</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <p class="sub">{endosoInfo.archivo} · {endosoInfo.alcance}</p>
                                <template if:true={endosoInfo.detalle}><p class="slds-m-vertical_x-small">{endosoInfo.detalle}</p></template>
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label={etiquetaFecha} value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm} required></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={enPoliza}>
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-combobox label="Solicitud" value={form.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                                onchange={handleForm} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                        </div>
                                    </template>
                                    <template if:true={hayBajasEndoso}>
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-combobox label="Motivo de baja (opcional)" value={form.motivo} options={motivos}
                                                data-campo="motivo" onchange={handleForm} placeholder="Sin motivo"></lightning-combobox>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Comentario" value={form.comentario} data-campo="comentario" onchange={handleForm} max-length="255"></lightning-input>
                                    </div>
                                </div>
                                <p class="slds-m-top_small"><strong>Movimientos del endoso ({textoObjetivosEndoso})</strong></p>
                                <label class="mov-excel-fecha mov-excel-todas">
                                    <input type="checkbox" checked={todosObjetivosEndoso} onchange={marcarTodosObjetivosEndoso} />
                                    <span>Todas</span>
                                </label>
                                <div class="mov-excel-lista">
                                    <template for:each={objetivosEndoso} for:item="o">
                                        <label key={o.key} class="mov-excel-fecha">
                                            <input type="checkbox" data-key={o.key} checked={o.sel} onchange={marcarObjetivoEndoso} />
                                            <span>{o.texto}</span>
                                        </label>
                                    </template>
                                </div>
                                <template lwc:if={interno}>
                                <c-datos-endoso valores-iniciales={endosoLeido} archivo-inicial={documentoEndoso}></c-datos-endoso>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Aplicar endoso" variant="brand" class="slds-m-left_x-small" onclick={guardarEndoso}
                                    disabled={sinObjetivosEndoso}></lightning-button>
                            </div>
                        </template>
                        <template if:true={enModalCambio}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Cambio de datos: {form.nombreActual}</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Domicilio" value={form.direccion} data-campo="direccion" onchange={handleForm}
                                            disabled={domicilioBloqueado} max-length="255"
                                            field-level-help="En la póliza el domicilio no se cambia: da de baja la ubicación y da de alta la nueva."></lightning-input>
                                    </div>
                                    <template if:true={enPoliza}>
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-input type="number" label="Inciso" value={form.inciso} data-campo="inciso" onchange={handleForm}></lightning-input>
                                        </div>
                                    </template>
                                    <template if:true={enOportunidad}>
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-input label="Nombre" value={form.nombre} data-campo="nombre" onchange={handleForm} max-length="80"></lightning-input>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Giro" value={form.giro} data-campo="giro" onchange={handleForm} max-length="40"></lightning-input>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Suma asegurada" value={form.sumaAsegurada}
                                            data-campo="sumaAsegurada" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Prima" value={form.prima}
                                            data-campo="prima" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label={etiquetaFecha} value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={enPoliza}>
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-combobox label="Solicitud" value={form.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                                onchange={handleForm} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Comentario" value={form.comentario} data-campo="comentario" onchange={handleForm} max-length="255"></lightning-input>
                                    </div>
                                </div>
                                <template if:true={enPoliza}>
                                    <template lwc:if={interno}>
                                    <c-datos-endoso></c-datos-endoso>
                                    </template>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Guardar cambio" variant="brand" class="slds-m-left_x-small" onclick={guardarCambio}></lightning-button>
                            </div>
                        </template>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>
        </div>
    </template>
    <c-otras-polizas></c-otras-polizas>
</template>
