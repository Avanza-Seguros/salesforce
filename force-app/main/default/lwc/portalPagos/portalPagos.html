<template>
    <div class="wrap">
        <c-portal-vista-previa pagina="Pagos" oncambio={handleVistaPrevia}></c-portal-vista-previa>

        <!-- ===== Banda azul ===== -->
        <section class="hero">
            <div class="hero-main">
                <div class="hero-row">
                    <div class="hero-ic">
                        <svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
                    </div>
                    <div>
                        <div class="eyebrow">Pagos</div>
                        <h1 class="h1">{titulo}</h1>
                    </div>
                </div>
                <p>{subtitulo}</p>
            </div>
            <div lwc:if={hayPolizas} class="hero-side">
                <template for:each={resumen} for:item="r">
                    <div key={r.clave} class={r.clase}>
                        <div class="l">{r.etiqueta}</div>
                        <div class="n">{r.valor}</div>
                        <div class="s">{r.detalle}</div>
                    </div>
                </template>
            </div>
        </section>

        <template lwc:if={cargando}>
            <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
        </template>
        <div lwc:elseif={error} class="aviso_error" role="alert">{error}</div>
        <div lwc:elseif={sinPolizas} class="empty">{mensajeVacio}</div>

        <template lwc:if={hayPolizas}>
            <!-- ===== Próximo pago ===== -->
            <section lwc:if={proximo} class="card">
                <div class="destacado">
                    <div class="destacado_principal">
                        <span class="kicker">{proximo.etiqueta}</span>
                        <span class="destacado_monto">{proximo.monto}</span>
                        <span class="destacado_texto">{proximo.verbo} <b>{proximo.venceTexto}</b> <span class={proximo.estadoClase}>{proximo.estadoTexto}</span></span>
                    </div>
                    <div lwc:if={hayPlan} class="destacado_avance">
                        <div class="avance_textos"><span>Pagado <b class="texto_ok">{totales.pagado}</b></span><span>Pendiente <b class="texto_pendiente">{totales.pendiente}</b></span></div>
                        <div class="hbar" role="progressbar" aria-label="Avance de pago de la póliza" aria-valuemin="0" aria-valuemax="100" aria-valuenow={avance.pct}>
                            <i style={avance.estilo}></i>
                        </div>
                        <span class="sb">{avance.texto} de la póliza seleccionada</span>
                    </div>
                </div>
            </section>

            <!-- ===== Cuotas de la póliza ===== -->
            <section class="card">
                <div class="card-h">
                    <div>
                        <h2 class="t2">{tituloPlan}</h2>
                        <p lwc:if={subPlan} class="muted">{subPlan}</p>
                    </div>
                    <a class="btn ghost" href={urlMisPolizas}>Ver detalle de la póliza</a>
                </div>
                <div class="seg" role="group" aria-label="Póliza">
                    <template for:each={botonesPolizas} for:item="p">
                        <button key={p.id} class={p.clase} data-id={p.id} aria-pressed={p.presionado} onclick={handlePoliza}>
                            {p.texto}
                            <span class={p.claseDetalle}>{p.detalle}</span>
                        </button>
                    </template>
                </div>

                <template lwc:if={cargandoPlan}>
                    <div class="cargando"><lightning-spinner alternative-text="Cargando cuotas" size="small"></lightning-spinner></div>
                </template>
                <div lwc:elseif={errorPlan} class="aviso_error" role="alert">{errorPlan}</div>
                <div lwc:elseif={sinCuotas} class="empty">Esta póliza no tiene cuotas registradas.</div>

                <template lwc:if={hayPlan}>
                    <div class="tbox">
                        <table>
                            <caption class="solo_lector">{tituloPlan}</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Cuota</th>
                                    <th scope="col">Recibo</th>
                                    <th scope="col">Vence</th>
                                    <th scope="col">Fecha de pago</th>
                                    <th scope="col" class="r">Importe</th>
                                    <th scope="col" class="r">Pagado</th>
                                    <th scope="col" class="r">Pendiente</th>
                                    <th scope="col">Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={cuotas} for:item="c">
                                    <tr key={c.id}>
                                        <th scope="row">
                                            <div class="who"><span class="chip" aria-hidden="true">{c.numeroChip}</span><span class="nm">{c.etiqueta}</span></div>
                                        </th>
                                        <td>{c.reciboTexto}</td>
                                        <td>{c.venceTexto}<div lwc:if={c.formaPago} class="sb">{c.formaPago}</div></td>
                                        <td>{c.pagoTexto}</td>
                                        <td class="r money">{c.importeTexto}</td>
                                        <td class="r">{c.pagadoTexto}</td>
                                        <td class="r money">{c.pendienteTexto}</td>
                                        <td><span class={c.estadoClase}>{c.estadoTexto}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="totales">
                        <span>Importe <b>{totales.importe}</b></span>
                        <span>Pagado <b class="texto_ok">{totales.pagado}</b></span>
                        <span>Pendiente <b class="texto_pendiente">{totales.pendiente}</b></span>
                    </div>
                </template>
            </section>

            <!-- ===== Recibos pagados ===== -->
            <section lwc:if={hayPlan} class="card">
                <div>
                    <h2 class="t2">Recibos pagados</h2>
                    <p class="muted">Pagos ya aplicados de la póliza seleccionada</p>
                </div>
                <ul lwc:if={hayRecibos} class="lista_limpia">
                    <template for:each={recibos} for:item="r">
                        <li key={r.id} class="list-row">
                            <div class="who">
                                <span class="chip" aria-hidden="true">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
                                </span>
                                <div class="who_tx">
                                    <div class="nm">{r.titulo}</div>
                                    <div class="sb">{r.meta}</div>
                                </div>
                            </div>
                            <span class="money texto_ok">{r.pagadoTexto}</span>
                        </li>
                    </template>
                </ul>
                <div lwc:else class="empty">Aún no hay recibos pagados en esta póliza. Cuando la aseguradora confirme un pago, aparecerá aquí.</div>
            </section>
        </template>
    </div>
</template>
