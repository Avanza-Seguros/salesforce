<template>
    <div class="pagina">
        <c-portal-vista-previa pagina="Pagos" oncambio={handleVistaPrevia}></c-portal-vista-previa>

        <div class="cabecera">
            <span class="cabecera_etiqueta">Pagos</span>
            <h1 class="cabecera_titulo">{titulo}</h1>
            <p class="cabecera_sub">{subtitulo}</p>
        </div>

        <template lwc:if={cargando}>
            <div class="cargando"><lightning-spinner alternative-text="Cargando" size="small"></lightning-spinner></div>
        </template>
        <div lwc:elseif={error} class="aviso aviso_error" role="alert">{error}</div>
        <section lwc:elseif={sinPolizas} class="panel">
            <p class="vacio">Aún no tienes pólizas registradas. Si crees que es un error, contacta a tu ejecutivo.</p>
        </section>

        <template lwc:if={hayPolizas}>
            <ul class="resumen">
                <template for:each={resumen} for:item="r">
                    <li key={r.clave} class={r.clase}>
                        <span class="dato_etiqueta">{r.etiqueta}</span>
                        <span class="dato_valor">{r.valor}</span>
                        <span class="dato_detalle">{r.detalle}</span>
                    </li>
                </template>
            </ul>

            <section lwc:if={proximo} class="destacado">
                <div class="destacado_principal">
                    <span class="destacado_etiqueta">{proximo.etiqueta}</span>
                    <span class="destacado_monto">{proximo.monto}</span>
                    <span class="destacado_texto">{proximo.verbo} <strong>{proximo.venceTexto}</strong> · Estado: <strong class={proximo.estadoClase}>{proximo.estadoTexto}</strong></span>
                </div>
                <div lwc:if={hayPlan} class="destacado_avance">
                    <div class="avance_textos"><span>Pagado {totales.pagado}</span><span>Pendiente {totales.pendiente}</span></div>
                    <div class="avance" role="progressbar" aria-label="Avance de pago de la póliza" aria-valuemin="0" aria-valuemax="100" aria-valuenow={avance.pct}>
                        <div class="avance_relleno" style={avance.estilo}></div>
                    </div>
                    <span class="avance_pct">{avance.texto} de la póliza seleccionada</span>
                </div>
            </section>

            <section class="panel">
                <div class="panel_cabecera">
                    <div>
                        <h2 class="panel_titulo">{tituloPlan}</h2>
                        <p lwc:if={subPlan} class="panel_sub">{subPlan}</p>
                    </div>
                    <a class="boton boton_secundario" href={urlMisPolizas}>Ver detalle de la póliza</a>
                </div>
                <div class="polizas" role="group" aria-label="Póliza">
                    <template for:each={botonesPolizas} for:item="p">
                        <button key={p.id} class={p.clase} data-id={p.id} aria-pressed={p.presionado} onclick={handlePoliza}>
                            <span class="poliza_texto">{p.texto}</span>
                            <span class="poliza_detalle">{p.detalle}</span>
                        </button>
                    </template>
                </div>

                <template lwc:if={cargandoPlan}>
                    <div class="cargando"><lightning-spinner alternative-text="Cargando cuotas" size="small"></lightning-spinner></div>
                </template>
                <div lwc:elseif={errorPlan} class="aviso aviso_error" role="alert">{errorPlan}</div>
                <p lwc:elseif={sinCuotas} class="vacio">Esta póliza no tiene cuotas registradas.</p>

                <template lwc:if={hayPlan}>
                    <div class="tabla_caja">
                        <table class="tabla">
                            <caption class="solo_lector">{tituloPlan}</caption>
                            <thead>
                                <tr>
                                    <th scope="col">Cuota</th>
                                    <th scope="col">Recibo</th>
                                    <th scope="col">Vence</th>
                                    <th scope="col">Fecha de pago</th>
                                    <th scope="col" class="num">Importe</th>
                                    <th scope="col" class="num">Pagado</th>
                                    <th scope="col" class="num">Pendiente</th>
                                    <th scope="col">Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={cuotas} for:item="c">
                                    <tr key={c.id}>
                                        <th scope="row">{c.etiqueta}</th>
                                        <td>{c.reciboTexto}</td>
                                        <td>{c.venceTexto}</td>
                                        <td>{c.pagoTexto}</td>
                                        <td class="num">{c.importeTexto}</td>
                                        <td class="num">{c.pagadoTexto}</td>
                                        <td class="num">{c.pendienteTexto}</td>
                                        <td><span class={c.estadoClase}>{c.estadoTexto}</span></td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <div class="totales">
                        <span>Importe <strong>{totales.importe}</strong></span>
                        <span>Pagado <strong class="texto_ok">{totales.pagado}</strong></span>
                        <span>Pendiente <strong class="texto_pendiente">{totales.pendiente}</strong></span>
                    </div>
                </template>
            </section>

            <section lwc:if={hayPlan} class="panel">
                <div class="panel_cabecera">
                    <div>
                        <h2 class="panel_titulo">Recibos pagados</h2>
                        <p class="panel_sub">Pagos ya aplicados de la póliza seleccionada</p>
                    </div>
                </div>
                <ul lwc:if={hayRecibos} class="recibos">
                    <template for:each={recibos} for:item="r">
                        <li key={r.id} class="recibo">
                            <span class="recibo_icono" aria-hidden="true">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                    stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
                            </span>
                            <span class="recibo_texto">
                                <strong>{r.titulo}</strong>
                                <span>{r.meta}</span>
                            </span>
                            <span class="recibo_monto">{r.pagadoTexto}</span>
                        </li>
                    </template>
                </ul>
                <p lwc:else class="vacio">Aún no hay recibos pagados en esta póliza. Cuando la aseguradora confirme un pago, aparecerá aquí.</p>
            </section>
        </template>
    </div>
</template>
