<template>
    <template if:true={noAplica}>
        <template if:true={esFlotilla}>
            <c-movimientos-flotilla portal={portal} cuenta-vista-previa={cuentaVistaPrevia} record-id={recordId} read-only={readOnly}></c-movimientos-flotilla>
        </template>
        <template if:true={esUbicaciones}>
            <c-movimientos-ubicaciones portal={portal} cuenta-vista-previa={cuentaVistaPrevia} record-id={recordId} read-only={readOnly}></c-movimientos-ubicaciones>
        </template>
        <template if:true={sinMovimientosBienes}>
            <div class="mov-vacio">
                <lightning-icon icon-name="utility:info" size="small"></lightning-icon>
                <p>Esta póliza asegura ubicaciones: sus altas y bajas se manejan en los bienes de la póliza.</p>
            </div>
        </template>
    </template>
    <template if:true={visible}>
        <div class={claseRaiz}>
            <template if:true={cargando}>
                <div class="mov-cargando"><lightning-spinner alternative-text="Procesando" size="small"></lightning-spinner></div>
            </template>

            <div class="mov-encabezado">
                <div>
                    <h3 class="mov-titulo">{titulo}</h3>
                    <p class="mov-subtitulo">{subtitulo}</p>
                </div>
                <template if:true={enOportunidad}>
                    <lightning-button label={textoAbrir} onclick={toggleAbierto}></lightning-button>
                </template>
            </div>

            <template if:true={errorMensaje}>
                <div class="mov-error" role="alert">
                    <lightning-icon icon-name="utility:error" variant="error" size="x-small"></lightning-icon>
                    <span>{errorMensaje}</span>
                </div>
            </template>

            <template if:true={mostrarCuerpo}>
                <div class="mov-stats">
                    <div class="stat"><span class="stat-num">{totalVigentes}</span><span class="stat-lbl">Vigentes</span></div>
                    <div class="stat"><span class="stat-num">{totalTitulares}</span><span class="stat-lbl">Titulares</span></div>
                    <div class="stat"><span class="stat-num">{totalDependientes}</span><span class="stat-lbl">Dependientes</span></div>
                    <template if:true={enPoliza}>
                        <div class="stat stat-baja"><span class="stat-num">{totalBajas}</span><span class="stat-lbl">Dados de baja</span></div>
                    </template>
                </div>

                <!-- ====================== LISTA ====================== -->
                <template if:true={enLista}>
                    <template if:true={puedeTraer}>
                        <div class="mov-aviso">
                            <lightning-icon icon-name="utility:refresh" size="x-small"></lightning-icon>
                            <span>Si el ejecutivo arma la renovación, parte de los asegurados vigentes de la póliza anterior y después aplica las altas, bajas y cambios.
                                Si la aseguradora mandó el censo nuevo, usa «Cargar asegurados».</span>
                            <lightning-button label={textoTraer} icon-name="utility:download" onclick={handleTraer}></lightning-button>
                        </div>
                    </template>

                    <div class="mov-barra">
                        <div class="mov-filtros">
                            <lightning-input type="search" label="Buscar" variant="label-hidden" placeholder="Buscar por nombre, certificado o categoría"
                                value={busqueda} onchange={handleBusqueda} class="mov-buscar"></lightning-input>
                            <template if:true={enPoliza}>
                                <lightning-combobox label="Mostrar" variant="label-hidden" value={filtro} options={opcionesFiltro}
                                    onchange={handleFiltro} class="mov-filtro"></lightning-combobox>
                            </template>
                            <template lwc:if={hayAgrupacion}>
                                <lightning-input type="toggle" label="Agrupar por solicitud" checked={agruparSolicitud} onchange={toggleAgrupar}
                                    message-toggle-active="" message-toggle-inactive="" class="mov-agrupar"></lightning-input>
                            </template>
                        </div>
                        <div class="mov-acciones">
                            <!-- En el sitio, Historial va a la izquierda y Nueva solicitud a la derecha (en lugar de cargar el archivo); las altas y bajas se piden ahí. -->
                            <template lwc:if={portal}><lightning-button label={textoHistorial} icon-name="utility:clock" onclick={verHistorial}></lightning-button></template>
                            <template if:true={puedeEditar}>
                                <template lwc:if={interno}><lightning-button label="Alta de asegurado" icon-name="utility:adduser" onclick={abrirAlta}></lightning-button></template>
                                <template lwc:if={interno}><lightning-button label={textoBajaSeleccion} icon-name="utility:ban" variant="destructive-text"
                                    onclick={abrirBaja} disabled={sinSeleccion}></lightning-button></template>
                                <template lwc:if={conCarga}><lightning-button label="Cargar asegurados" icon-name="utility:upload" onclick={verArchivo}></lightning-button></template>
                            </template>
                            <!-- Envío de correo a todos los pendientes: solo en Salesforce. -->
                            <template lwc:if={correoPendientes}>
                                <lightning-button label={textoEnviarPendientes} icon-name="utility:email" onclick={abrirCorreoPendientes}
                                    disabled={sinPendientesCorreo}></lightning-button>
                            </template>
                            <!-- En el sitio (portal) no se adjuntan documentos varios ni se genera el Excel. -->
                            <template lwc:if={interno}>
                            <lightning-button label="Adjuntar documentos" icon-name="utility:attach" onclick={abrirArchivosVarios}
                                disabled={sinPersonas}></lightning-button>
                            <!-- Excel de movimientos: solo pólizas empresariales. -->
                            <template if:true={conFechasMovimiento}><lightning-button label="Generar Excel" icon-name="utility:download" onclick={abrirExcel}></lightning-button></template>
                            </template>
                            <template if:true={conEndosos}><lightning-button label="Endosos" icon-name="utility:file" onclick={verEndosos}></lightning-button></template>
                            <template lwc:if={interno}><lightning-button label={textoHistorial} icon-name="utility:clock" onclick={verHistorial}></lightning-button></template>
                            <template lwc:if={conFormulario}><lightning-button label="Nueva solicitud" icon-name="utility:add" variant="brand" class="mov-nueva"
                                onclick={handleNuevaSolicitud}></lightning-button></template>
                        </div>
                    </div>

                    <template if:true={sinAsegurados}>
                        <div class="mov-vacio">
                            <lightning-icon icon-name="standard:groups" size="small"></lightning-icon>
                            <p>No hay asegurados todavía.</p>
                        </div>
                    </template>
                    <template if:false={sinAsegurados}>
                        <div class="mov-scroll">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                <thead>
                                    <!-- Agrupada por solicitud: el encabezado es el de las solicitudes; el de los registros va dentro de cada una. -->
                                    <template lwc:if={agrupado}>
                                        <tr class="slds-line-height_reset enc-solicitudes">
                                            <th scope="col" colspan={columnasTabla}>
                                                <div class="sol-grid">
                                                    <span></span><span>Número de movimiento</span><span>Póliza</span><span>Fecha de apertura</span>
                                                    <span>Fecha de cierre</span><span>Seguimiento</span><span>Prima</span><span></span>
                                                </div>
                                            </th>
                                        </tr>
                                    </template>
                                    <template lwc:else>
                                        <tr class="slds-line-height_reset">
                                            <th scope="col" class="col-check"></th>
                                            <!-- Clic en el título: ordena por esa columna (otro clic invierte el orden). -->
                                            <template for:each={columnasDetalle} for:item="c">
                                                <th key={c.key} scope="col" class={c.clase} data-campo={c.campo} onclick={ordenar} title="Ordenar">{c.label} <span class="flecha">{c.flecha}</span></th>
                                            </template>
                                            <th scope="col" class="col-acciones"></th>
                                        </tr>
                                    </template>
                                </thead>
                                <template for:each={bloques} for:item="b">
                                <tbody key={b.key}>
                                    <!-- Encabezado de la solicitud del cliente (folio, fecha, quién la registró, resumen, endosos y estado). -->
                                    <template lwc:if={b.encabezado}>
                                        <!-- Número de movimiento | Póliza | Fecha de apertura | Fecha de cierre | Seguimiento | Prima (y el resumen). -->
                                        <tr class="fila-solicitud">
                                            <td colspan={columnasTabla}>
                                                <div class="sol-grid">
                                                    <lightning-button-icon icon-name={b.icono} variant="bare" size="small" alternative-text={b.textoColapsar}
                                                        title={b.textoColapsar} data-folio={b.folio} onclick={toggleSolicitud}></lightning-button-icon>
                                                    <span class="sol-folio" title={b.sub}>{b.titulo}<template lwc:if={b.continua}><span class="sol-sub"> (continúa)</span></template></span>
                                                    <span class="sol-poliza">{b.poliza}</span>
                                                    <span>{b.aperturaTxt}</span>
                                                    <span>{b.cierreTxt}</span>
                                                    <!-- Seguimiento de la solicitud: en Salesforce se cambia con un clic. -->
                                                    <span>
                                                        <template lwc:if={b.puedeSeguimiento}><c-seguimiento-selector valor={b.seguimiento} policy-id={recordId} folio={b.folio}
                                                            sin-movimientos={b.sinMovimientos} oncambio={handleCambioSeguimiento}></c-seguimiento-selector></template>
                                                        <template lwc:elseif={b.seguimiento}><span class={b.claseSeguimiento}>{b.seguimiento}</span></template>
                                                    </span>
                                                    <!-- Lo que cobra la aseguradora por todo el movimiento. -->
                                                    <span class="sol-prima">{b.primaTxt}</span>
                                                    <span class="sol-extra">
                                                        <span class="sol-resumen" title={b.sub}>{b.resumen}</span>
                                                        <template lwc:if={b.endososTxt}><span class="sol-chip">{b.endososTxt}</span></template>
                                                        <template lwc:if={b.respuesta}><span class="sol-sub">{b.respuesta}</span></template>
                                                        <template lwc:if={b.ligaCaso}><a href={b.ligaCaso} target="_blank" class="sol-sub">{b.casoTxt}</a></template>
                                                        <template lwc:if={b.folioExcel}><lightning-button variant="base" label="Excel para la aseguradora" icon-name="utility:download"
                                                            class="sol-excel" data-folio={b.folio} onclick={handleExcelSolicitud}></lightning-button></template>
                                                    </span>
                                                </div>
                                            </td>
                                        </tr>
                                        <template lwc:if={b.conEncabezadoDetalle}>
                                            <tr class="fila-enc-detalle">
                                                <th scope="col" class="col-check"></th>
                                                <template for:each={columnasDetalle} for:item="c">
                                                    <th key={c.key} scope="col" class={c.clase} data-campo={c.campo} onclick={ordenar} title="Ordenar">{c.label} <span class="flecha">{c.flecha}</span></th>
                                                </template>
                                                <th scope="col" class="col-acciones"></th>
                                            </tr>
                                        </template>
                                    </template>
                                    <template for:each={b.filas} for:item="m">
                                        <tr key={m.filaKey} class={m.claseFila}>
                                            <td class="col-check">
                                                <template if:false={m.noSeleccionable}>
                                                    <input type="checkbox" data-id={m.id} checked={m.seleccionado} onchange={handleSeleccion}
                                                        aria-label="Seleccionar asegurado" />
                                                </template>
                                            </td>
                                            <td>{m.certificadoTxt}</td>
                                            <td>
                                                <div class="nombre"><button class="enlace-otras" data-id={m.id} data-titulo={m.nombre}
                                                    onclick={verOtrasPolizas} title="Ver si este asegurado existe en otras pólizas">{m.nombre}</button></div>
                                                <template if:false={m.esTitular}><div class="sub">de {m.titularNombre}</div></template>
                                            </td>
                                            <td>{m.parentesco}</td>
                                            <td>{m.sexoTxt}</td>
                                            <td>{m.categoria}</td>
                                            <td>{m.nacimientoTxt}</td>
                                            <td>{m.altaTxt}</td>
                                            <template if:true={conFechasMovimiento}><td>{m.fechaMovimientoTxt}</td></template>
                                            <template if:true={enPoliza}><td>{m.fechaCreacionTxt}</td></template>
                                            <template if:true={conFechaCierre}><td>{m.fechaCierreTxt}</td></template>
                                            <td class="num">{m.primaTxt}</td>
                                            <td>
                                                <span class={m.claseEstado}>{m.estado}</span>
                                                <template if:true={m.motivoBaja}><div class="sub">{m.motivoBaja}</div></template>
                                            </td>
                                            <template if:true={enPoliza}>
                                                <!-- Seguimiento del trámite: Solicitado, En proceso o Concluido. -->
                                                <td>
                                                    <template lwc:if={m.puedeSeguimiento}><c-seguimiento-selector valor={m.seguimiento} policy-id={recordId} folio={m.solicitud}
                                                        movimiento-id={m.movimientoId} oncambio={handleCambioSeguimiento}></c-seguimiento-selector></template>
                                                    <template lwc:elseif={m.seguimiento}><span class={m.claseSeguimiento}>{m.seguimiento}</span></template>
                                                    <template lwc:if={m.motivoRechazo}><div class="sub motivo-rechazo" title={m.motivoRechazo}>{m.motivoRechazo}</div></template>
                                                </td>
                                                <td>
                                                    <span class={m.claseCorreo} title={m.tituloCorreo}>{m.correoTxt}</span>
                                                    <template if:true={m.fechaCorreoTxt}><div class="sub">{m.fechaCorreoTxt}</div></template>
                                                </td>
                                                <td class="col-correo" title={m.correoMostrar}>
                                                    {m.correoMostrar}
                                                    <template if:true={m.esCorreoPersonal}><div class="sub">Personal</div></template>
                                                </td>
                                            </template>
                                            <td class="col-acciones">
                                                <template if:true={m.puedeMover}>
                                                    <lightning-button-icon icon-name="utility:edit" alternative-text="Cambiar datos" title="Cambiar datos"
                                                        data-id={m.id} onclick={abrirCambio} size="small"></lightning-button-icon>
                                                    <template lwc:if={interno}><lightning-button-icon icon-name="utility:ban" alternative-text="Dar de baja" title="Dar de baja"
                                                        data-id={m.id} onclick={abrirBaja} size="small" class="slds-m-left_xx-small"></lightning-button-icon></template>
                                                </template>
                                                <!-- Archivos: titulares y los dependientes que ya tienen. -->
                                                <template if:true={m.muestraArchivos}>
                                                    <lightning-button-icon icon-name="utility:attach" alternative-text={m.textoArchivos} title={m.textoArchivos}
                                                        variant={m.varianteArchivos} data-id={m.id} onclick={abrirArchivos} size="small"
                                                        class="slds-m-left_xx-small"></lightning-button-icon>
                                                </template>
                                                <template if:true={m.muestraCorreo}>
                                                    <lightning-button-icon icon-name="utility:email" alternative-text={m.textoEnviar} title={m.textoEnviar}
                                                        data-id={m.id} onclick={abrirCorreoAsegurado} size="small" class="slds-m-left_xx-small"></lightning-button-icon>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                                </template>
                            </table>
                        </div>
                        <div class="mov-paginacion">
                            <lightning-button-icon icon-name="utility:chevronleft" alternative-text="Anterior" onclick={anterior} disabled={sinAnterior}></lightning-button-icon>
                            <span>{textoPagina}</span>
                            <lightning-button-icon icon-name="utility:chevronright" alternative-text="Siguiente" onclick={siguiente} disabled={sinSiguiente}></lightning-button-icon>
                        </div>
                    </template>
                </template>

                <!-- ====================== ARCHIVO ====================== -->
                <template if:true={enArchivo}>
                    <c-censo-colectivo modo="lector" portal={portal} lee-endosos={enPoliza} onleido={handleLeido} onendoso={handleEndosoLeido}></c-censo-colectivo>
                    <div class="mov-pie">
                        <lightning-button label="Regresar" icon-name="utility:back" onclick={verLista}></lightning-button>
                    </div>
                </template>

                <!-- ====================== REVISIÓN DEL ARCHIVO ====================== -->
                <template if:true={enRevision}>
                    <div class="mov-paso">
                        <strong>Diferencias de {archivoNombre} contra los asegurados vigentes</strong>
                        <p class="sub">{textoSinCambios} Desmarca lo que no quieras aplicar.</p>
                    </div>

                    <template if:true={hayDuplicados}>
                        <div class="mov-duplicados">
                            <div class="mov-duplicados-titulo">
                                <lightning-icon icon-name="utility:ban" variant="warning" size="x-small"></lightning-icon>
                                <strong>{textoDuplicados}</strong>
                            </div>
                            <p class="mov-duplicados-sub">No se dan de alta porque ya existen. Si el archivo trae datos distintos de ese registro, el cambio aparece en Cambios.</p>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla mov-tabla-rechazos">
                                    <thead><tr>
                                        <th>Registro del archivo</th><th>Alta rechazada</th><th>Motivo</th><th>Registro que ya existe</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={duplicadosRev} for:item="d">
                                            <tr key={d.key}>
                                                <td>{d.filaTxt}</td>
                                                <td><div class="nombre">{d.nombre}</div></td>
                                                <td>{d.motivo}</td>
                                                <td>{d.existenteTxt}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </template>

                    <template if:true={sinDiferencias}>
                        <div class="mov-vacio"><p>El archivo coincide con los asegurados vigentes: no hay movimientos.</p></div>
                    </template>

                    <template if:false={sinDiferencias}>
                        <template if:true={hayEndososArchivo}>
                            <div class="mov-paso"><lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>{textoEndososArchivo}</div>
                        </template>
                        <div class="slds-grid slds-wrap slds-gutters_x-small modal-form">
                            <template lwc:if={pideDatosArchivo}>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input type="date" label={etiquetaFecha} value={comun.fecha} data-campo="fecha" onchange={handleComun} required></lightning-input>
                            </div>
                            </template>
                            <template lwc:if={pideEndosoArchivo}>
                            <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                <lightning-input label="Número de endoso" value={comun.endoso} data-campo="endoso" onchange={handleComun}></lightning-input>
                            </div>
                            </template>
                            <template lwc:if={enPoliza}>
                                <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
                                    <lightning-combobox label="Solicitud" value={comun.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                        onchange={handleComun} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                </div>
                            </template>
                            <template if:true={hayBajas}>
                                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                    <lightning-combobox label="Motivo de baja (general, opcional)" value={comun.motivo} options={motivos}
                                        data-campo="motivo" onchange={handleComun} placeholder="Sin motivo"></lightning-combobox>
                                </div>
                            </template>
                            <template lwc:if={pideDatosArchivo}>
                            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
                                <lightning-input label="Comentario" value={comun.comentario} data-campo="comentario" onchange={handleComun} max-length="255"></lightning-input>
                            </div>
                            </template>
                        </div>
                        <template if:true={enPoliza}>
                            <template lwc:if={pideEndoso}>
                            <c-datos-endoso></c-datos-endoso>
                            </template>
                        </template>

                        <template if:true={hayBajas}>
                            <h4 class="mov-seccion seccion-baja">{textoBajas}</h4>
                            <template if:true={hayFaltantes}>
                                <p class="sub mov-faltantes">{textoFaltantes}</p>
                            </template>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="bajas" checked={todasBajas} onchange={marcarTodos} aria-label="Todas" /></th>
                                        <th>Certificado</th><th>Nombre</th><th>Parentesco</th><th>Fecha</th><th>Motivo (si es distinto al general)</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={bajasRev} for:item="b">
                                            <tr key={b.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="bajas" data-key={b.key} checked={b.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{b.certificado}</td>
                                                <td><div class="nombre">{b.nombre}</div><template if:true={b.titularNombre}><div class="sub">de {b.titularNombre}</div></template></td>
                                                <td>{b.parentesco}</td>
                                                <td>{b.fechaMovTxt}</td>
                                                <td class="col-motivo">
                                                    <lightning-combobox label="Motivo" variant="label-hidden" value={b.motivo} options={motivos}
                                                        data-key={b.key} onchange={motivoBaja} placeholder="General"></lightning-combobox>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:true={hayAltas}>
                            <h4 class="mov-seccion seccion-alta">{textoAltas}</h4>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="altas" checked onchange={marcarTodos} aria-label="Todas" /></th>
                                        <th>Certificado</th><th>Nombre</th><th>Parentesco</th><th>Fecha</th>
                                        <template for:each={columnasAltas} for:item="col"><th key={col.key} class={col.clase}>{col.label}</th></template>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={altasRev} for:item="a">
                                            <tr key={a.key}>
                                                <td class="col-check"><input type="checkbox" data-lista="altas" data-key={a.key} checked={a.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{a.certificado}</td>
                                                <td><div class="nombre">{a.nombre}</div><template if:true={a.titularNombre}><div class="sub">de {a.titularNombre}</div></template></td>
                                                <td>{a.parentesco}</td>
                                                <td>{a.fechaMovTxt}</td>
                                                <template for:each={a.celdas} for:item="cel"><td key={cel.key} class={cel.clase}>{cel.valor}</td></template>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>

                        <template if:true={hayCambios}>
                            <h4 class="mov-seccion seccion-cambio">{textoCambios}</h4>
                            <div class="mov-scroll">
                                <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                    <thead><tr>
                                        <th class="col-check"><input type="checkbox" data-lista="cambios" checked onchange={marcarTodos} aria-label="Todos" /></th>
                                        <th>Certificado</th><th>Nombre</th><th>Fecha</th><th>Dato</th><th>Dato anterior</th><th>Dato nuevo</th>
                                    </tr></thead>
                                    <tbody>
                                        <template for:each={cambiosRev} for:item="c">
                                            <tr key={c.key}>
                                                <td class="col-check"><input type="checkbox" data-lista={c.lista} data-key={c.key} checked={c.sel} onchange={marcar} aria-label="Aplicar" /></td>
                                                <td>{c.certificado}</td>
                                                <td>
                                                    <div class="nombre">{c.nombre}</div>
                                                    <template if:true={c.titularNombre}><div class="sub">de {c.titularNombre}</div></template>
                                                    <template if:true={c.comoCambio}><div class="sub texto-error">No está en la póliza: se dará de alta</div></template>
                                                </td>
                                                <td>{c.fechaMovTxt}</td>
                                                <td>
                                                    <template for:each={c.difs} for:item="d"><div key={d.key} class="dif-campo">{d.campo}</div></template>
                                                    <template if:true={c.sinDifs}><span class="sub">Sin datos nuevos</span></template>
                                                </td>
                                                <td>
                                                    <template for:each={c.difs} for:item="d"><div key={d.key} class="dif-antes">{d.antes}</div></template>
                                                </td>
                                                <td>
                                                    <template for:each={c.difs} for:item="d"><div key={d.key} class="dif-nuevo">{d.despues}</div></template>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </template>

                    <div class="mov-pie">
                        <lightning-button label="Cancelar" onclick={verLista}></lightning-button>
                        <lightning-button label="Cargar otro archivo" onclick={verArchivo}></lightning-button>
                        <template if:false={sinDiferencias}>
                            <lightning-button label="Aplicar movimientos" variant="brand" icon-name="utility:check" onclick={aplicarRevision}></lightning-button>
                        </template>
                    </div>
                </template>

                <!-- ====================== ENDOSOS ====================== -->
                <template if:true={enEndosos}>
                    <c-endosos-poliza record-id={recordId} puede-editar={puedeEditar} onregistrado={cargar}></c-endosos-poliza>
                    <div class="mov-pie">
                        <lightning-button label="Regresar" icon-name="utility:back" onclick={verLista}></lightning-button>
                    </div>
                </template>

                <!-- ====================== HISTORIAL ====================== -->
                <template if:true={enHistorial}>
                    <template if:true={sinHistorial}>
                        <div class="mov-vacio"><p>Aún no hay movimientos registrados.</p></div>
                    </template>
                    <template if:false={sinHistorial}>
                        <div class="mov-barra">
                            <div class="mov-filtros">
                                <lightning-input type="search" label="Buscar en el historial" variant="label-hidden" class="mov-buscar"
                                    placeholder="Buscar por asegurado, certificado, tipo, fecha, endoso o usuario"
                                    value={busquedaHistorial} onchange={handleBusquedaHistorial}></lightning-input>
                                <span class="sub">{textoResultadosHistorial}</span>
                            </div>
                        </div>
                        <template if:true={sinResultadosHistorial}>
                            <div class="mov-vacio"><p>Ningún movimiento coincide con la búsqueda.</p></div>
                        </template>
                        <div class="mov-scroll">
                            <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                <thead><tr>
                                    <th>Movimiento</th><th>Tipo</th><th>Fecha</th><th>Asegurado</th><th>Certificado</th><th>Endoso</th><th>Detalle</th><th>Usuario</th>
                                </tr></thead>
                                <tbody>
                                    <template for:each={historial} for:item="h">
                                        <tr key={h.id}>
                                            <td>{h.nombre}</td>
                                            <td><span class={h.claseTipo}>{h.tipo}</span></td>
                                            <td>{h.fechaTxt}</td>
                                            <td>{h.asegurado}</td>
                                            <td>{h.certificado}</td>
                                            <td>{h.endoso}</td>
                                            <td class="detalle">{h.detalleTxt}</td>
                                            <td>{h.usuario}</td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
                    <div class="mov-pie">
                        <lightning-button label="Regresar" icon-name="utility:back" onclick={verLista}></lightning-button>
                    </div>
                </template>
            </template>

            <!-- ====================== MODALES ====================== -->
            <template if:true={hayModal}>
                <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open">
                    <div class="slds-modal__container">
                        <template if:true={enModalExcel}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Excel de asegurados por solicitud</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <template if:true={sinSolicitudesExcel}>
                                    <p class="sub">No hay registros para generar el Excel.</p>
                                </template>
                                <template if:false={sinSolicitudesExcel}>
                                    <p class="sub slds-m-bottom_x-small">Elige la solicitud: el Excel sale con sus registros, listo para enviar a la aseguradora.</p>
                                    <div class="mov-excel-lista" role="radiogroup" aria-label="Solicitudes">
                                        <template for:each={solicitudesExcel} for:item="s">
                                            <label key={s.key} class="mov-excel-fecha">
                                                <input type="radio" name="solicitud-excel" data-key={s.key} checked={s.sel} onchange={elegirSolicitudExcel} />
                                                <span><strong>{s.titulo}</strong> · {s.detalle}</span>
                                            </label>
                                        </template>
                                    </div>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Generar Excel" variant="brand" class="slds-m-left_x-small" icon-name="utility:download"
                                    onclick={generarExcel} disabled={sinSolicitudElegida}></lightning-button>
                            </div>
                        </template>
                        <template if:true={enModalBaja}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Baja de asegurados</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <p class="sub slds-m-bottom_x-small">{textoBaja}</p>
                                <ul class="mov-lista">
                                    <template for:each={bajaNombres} for:item="n"><li key={n.id}>{n.texto}</li></template>
                                </ul>
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input type="date" label="Fecha de baja" value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-combobox label="Motivo de baja (opcional)" value={form.motivo} options={motivos} data-campo="motivo"
                                            onchange={handleForm} placeholder="Sin motivo"></lightning-combobox>
                                    </div>
                                    <template lwc:if={pideEndoso}>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={enPoliza}>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox label="Solicitud" value={form.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                                onchange={handleForm} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Comentario" value={form.comentario} data-campo="comentario" onchange={handleForm} max-length="255"></lightning-input>
                                    </div>
                                </div>
                                <!-- Póliza: correo personal (el corporativo suele dejar de existir) y correo de baja. -->
                                <template if:true={enPoliza}>
                                    <h4 class="mov-seccion seccion-baja">Datos para el correo de baja</h4>
                                    <p class="sub slds-m-bottom_x-small">
                                        El correo corporativo suele dejar de existir con la baja: captura el correo personal. Al dar de baja no se envía
                                        ningún correo: queda pendiente y se envía después con «Enviar correo», a esa dirección<template lwc:if={interno}> y con el documento de baja
                                        (si lo adjuntas) como único archivo</template>. Al enviarlo se cierra el movimiento.
                                    </p>
                                    <div class="slds-grid slds-wrap slds-gutters_x-small">
                                        <template for:each={bajaCorreos} for:item="c">
                                            <div key={c.id} class="slds-col slds-size_1-of-1">
                                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                                    <div class="slds-col slds-size_1-of-2">
                                                        <lightning-input type="email" label={c.etiqueta} value={c.valor} data-id={c.id}
                                                            onchange={handleCorreoPersonal} field-level-help={c.corporativo} required></lightning-input>
                                                    </div>
                                                    <template lwc:if={interno}>
                                                    <div class="slds-col slds-size_1-of-2">
                                                        <div class="slds-form-element__label">{c.etiquetaDocumento}</div>
                                                        <div class="doc-baja-fila">
                                                            <lightning-button label="Adjuntar" icon-name="utility:upload" data-id={c.id} onclick={elegirDocumentoBaja}></lightning-button>
                                                            <span class="archivo-nombre sub">{c.documento}</span>
                                                        </div>
                                                        <input type="file" class="doc-baja-input" data-id={c.id} accept=".pdf,.png,.jpg,.jpeg,.doc,.docx" onchange={handleDocumentoBaja} />
                                                    </div>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </template>
                                <template if:true={enPoliza}>
                                    <template lwc:if={pideEndoso}>
                                    <c-datos-endoso></c-datos-endoso>
                                    </template>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Dar de baja" variant="destructive" class="slds-m-left_x-small" onclick={guardarBaja}></lightning-button>
                            </div>
                        </template>

                        <template if:true={enModalAlta}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Alta de asegurado</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-radio-group label="Tipo" options={opcionesTipoAlta} value={form.tipo} data-campo="tipo"
                                            onchange={handleForm} type="button"></lightning-radio-group>
                                    </div>
                                    <template if:true={esAltaDependiente}>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3">
                                            <lightning-combobox label="Titular" value={form.titularId} options={opcionesTitulares} data-campo="titularId"
                                                onchange={handleForm} placeholder="Selecciona el titular" required></lightning-combobox>
                                        </div>
                                        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                                            <lightning-combobox label="Parentesco" value={form.parentesco} options={opcionesParentesco} data-campo="parentesco"
                                                onchange={handleForm} required></lightning-combobox>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Nombre(s)" value={form.nombre} data-campo="nombre" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Apellidos" value={form.apellidos} data-campo="apellidos" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label="Fecha de nacimiento" value={form.fechaNacimiento} data-campo="fechaNacimiento" onchange={handleForm}></lightning-input>
                                    </div>
                                    <template lwc:if={conAntiguedad}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label="Fecha de antigüedad" value={form.fechaAntiguedad} data-campo="fechaAntiguedad" onchange={handleForm}
                                            field-level-help="Antigüedad reconocida (RA). Vacía: cuenta desde su primera alta."></lightning-input>
                                    </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-combobox label="Sexo" value={form.sexo} options={opcionesSexo} data-campo="sexo" onchange={handleForm} placeholder="Selecciona"></lightning-combobox>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Certificado" value={form.certificado} data-campo="certificado" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Categoría" value={form.categoria} data-campo="categoria" onchange={handleForm}
                                            field-level-help={ayudaCategoria}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Suma asegurada" value={form.sumaAsegurada}
                                            data-campo="sumaAsegurada" onchange={handleForm}></lightning-input>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Prima" value={form.prima}
                                            data-campo="prima" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="RFC" value={form.rfc} data-campo="rfc" onchange={handleForm} max-length="13"></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_2-of-3">
                                        <lightning-input type="email" label="Correo" value={form.email} data-campo="email" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input type="date" label={etiquetaFecha} value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <template lwc:if={pideEndoso}>
                                    <div class="slds-col slds-size_1-of-2">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={enPoliza}>
                                        <div class="slds-col slds-size_1-of-2">
                                            <lightning-combobox label="Solicitud" value={form.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                                onchange={handleForm} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                        </div>
                                    </template>
                                </div>
                                <template if:true={enPoliza}>
                                    <template lwc:if={pideEndoso}>
                                    <c-datos-endoso></c-datos-endoso>
                                    </template>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Dar de alta" variant="brand" class="slds-m-left_x-small" onclick={guardarAlta}></lightning-button>
                            </div>
                        </template>

                        <template if:true={enModalCambio}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Cambio de datos: {form.nombreActual}</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <div class="slds-grid slds-wrap slds-gutters_x-small">
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Nombre completo" value={form.nombreCompleto} data-campo="nombreCompleto" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Certificado" value={form.certificado} data-campo="certificado" onchange={handleForm}></lightning-input>
                                    </div>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label="Fecha de nacimiento" value={form.fechaNacimiento} data-campo="fechaNacimiento" onchange={handleForm}></lightning-input>
                                    </div>
                                    <template lwc:if={conAntiguedad}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label="Fecha de antigüedad" value={form.fechaAntiguedad} data-campo="fechaAntiguedad" onchange={handleForm}
                                            field-level-help="Antigüedad reconocida (RA). Vacía: cuenta desde su primera alta."></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="RFC" value={form.rfc} data-campo="rfc" onchange={handleForm} max-length="13"></lightning-input>
                                    </div>
                                    </template>
                                    <template if:true={enPoliza}>
                                        <div class="slds-col slds-size_2-of-3">
                                            <lightning-input type="email" label="Correo" value={form.email} data-campo="email" onchange={handleForm}
                                                field-level-help="Se guarda en el contacto o la cuenta del asegurado."></lightning-input>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Categoría" value={form.categoria} data-campo="categoria" onchange={handleForm}
                                            field-level-help={ayudaCategoria}></lightning-input>
                                    </div>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Suma asegurada" value={form.sumaAsegurada}
                                            data-campo="sumaAsegurada" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={interno}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="number" formatter="currency" step="0.01" label="Prima" value={form.prima}
                                            data-campo="prima" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template if:true={enOportunidad}>
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-combobox label="Sexo" value={form.sexo} options={opcionesSexo} data-campo="sexo" onchange={handleForm} placeholder="Selecciona"></lightning-combobox>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input type="date" label={etiquetaFecha} value={form.fecha} data-campo="fecha" onchange={handleForm} required></lightning-input>
                                    </div>
                                    <template lwc:if={pideEndoso}>
                                    <div class="slds-col slds-size_1-of-3">
                                        <lightning-input label="Número de endoso" value={form.endoso} data-campo="endoso" onchange={handleForm}></lightning-input>
                                    </div>
                                    </template>
                                    <template lwc:if={enPoliza}>
                                        <div class="slds-col slds-size_1-of-3">
                                            <lightning-combobox label="Solicitud" value={form.solicitud} options={opcionesSolicitud} data-campo="solicitud"
                                                onchange={handleForm} field-level-help="Los movimientos que el cliente pidió juntos van en la misma solicitud."></lightning-combobox>
                                        </div>
                                    </template>
                                    <div class="slds-col slds-size_1-of-1">
                                        <lightning-input label="Comentario" value={form.comentario} data-campo="comentario" onchange={handleForm} max-length="255"></lightning-input>
                                    </div>
                                </div>
                                <template if:true={enPoliza}>
                                    <template lwc:if={pideEndoso}>
                                    <c-datos-endoso></c-datos-endoso>
                                    </template>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cancelar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label="Guardar cambio" variant="brand" class="slds-m-left_x-small" onclick={guardarCambio}></lightning-button>
                            </div>
                        </template>

                        <!-- Varios archivos de distintas personas: se detecta a quién corresponde cada uno. -->
                        <template if:true={enModalArchivosVarios}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Adjuntar documentos de varios asegurados</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <template if:true={varios.cargando}>
                                    <lightning-spinner alternative-text="Adjuntando" size="small"></lightning-spinner>
                                </template>
                                <p class="sub slds-m-bottom_small">
                                    Selecciona los archivos de todos los titulares a la vez. Cada archivo se asigna al titular cuyo nombre,
                                    RFC o certificado viene en el nombre del archivo o, si es PDF, en su contenido (por ejemplo «INE JUAN PEREZ LOPEZ.pdf»). Los archivos
                                    solo se adjuntan a titulares, no a cónyuges, hijos u otros dependientes. Revisa la asignación y corrige
                                    la que haga falta antes de adjuntar.
                                </p>
                                <div class="varios-zona" ondragover={arrastrarSobre} ondrop={soltarArchivos}>
                                    <input type="file" class="varios-input" multiple onchange={archivosElegidos} />
                                    <lightning-button label="Seleccionar archivos" icon-name="utility:upload" onclick={elegirArchivosVarios}></lightning-button>
                                    <span class="sub">o arrástralos aquí · sin límite de cantidad, hasta 3 MB cada uno</span>
                                </div>
                                <details class="slds-m-top_x-small">
                                    <summary class="sub">Archivos de más de 3 MB</summary>
                                    <lightning-file-upload label="Archivos grandes (hasta 10 por selección)" name="archivosVarios" record-id={recordId}
                                        onuploadfinished={archivosVariosSubidos} multiple></lightning-file-upload>
                                </details>
                                <template if:true={subiendoVarios}><p class="slds-m-top_x-small">{textoSubiendo}</p></template>
                                <template if:true={hayVarios}>
                                    <h4 class="mov-seccion seccion-alta">{textoVarios}</h4>
                                    <div class="mov-scroll">
                                        <table class="slds-table slds-table_bordered slds-table_cell-buffer mov-tabla">
                                            <thead><tr><th>Archivo</th><th>Persona</th><th>Cómo se detectó</th></tr></thead>
                                            <tbody>
                                                <template for:each={variosFilas} for:item="v">
                                                    <tr key={v.key}>
                                                        <td class="archivo-nombre">
                                                            {v.nombre}
                                                            <div class={v.claseEstado}>{v.estadoTxt}</div>
                                                            <template if:true={v.conError}><div class="sub texto-error">{v.error}</div></template>
                                                        </td>
                                                        <td class="col-motivo">
                                                            <lightning-combobox label="Persona" variant="label-hidden" value={v.registroId}
                                                                options={opcionesPersonas} placeholder="Sin asignar" data-id={v.key}
                                                                onchange={asignarPersona}></lightning-combobox>
                                                        </td>
                                                        <td><span class={v.claseDeteccion}>{v.deteccion}</span>
                                                            <template lwc:if={v.certificadoTxt}><div class="sub">{v.certificadoTxt}</div></template>
                                                            <template lwc:if={v.listadoTxt}><div class="sub">{v.listadoTxt}</div></template>
                                                            <template lwc:if={v.otraPolizaTxt}><div class="sub texto-error">{v.otraPolizaTxt}</div></template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                    <p class="sub slds-m-top_x-small">Los archivos sin asignar se quedan en la póliza.</p>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cerrar" onclick={cerrarModal}></lightning-button>
                                <lightning-button label={textoAdjuntarVarios} variant="brand" class="slds-m-left_x-small"
                                    onclick={adjuntarVarios} disabled={sinAsignados}></lightning-button>
                            </div>
                        </template>

                        <!-- Archivos del asegurado: ver los que existen y adjuntar nuevos. -->
                        <template if:true={enModalArchivos}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Archivos: {archivos.nombre}</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <template if:true={archivos.cargando}>
                                    <lightning-spinner alternative-text="Cargando archivos" size="small"></lightning-spinner>
                                </template>
                                <template if:true={archivos.destinoId}>
                                    <template lwc:if={interno}>
                                        <lightning-file-upload label="Adjuntar archivos" name="archivos" record-id={archivos.destinoId}
                                            onuploadfinished={archivosSubidos} multiple></lightning-file-upload>
                                    </template>
                                    <!-- En el sitio el archivo se sube por PortalPolizasMovimientos (mismo destino). -->
                                    <template lwc:else>
                                        <lightning-input type="file" label="Adjuntar archivos" multiple disabled={archivos.cargando}
                                            onchange={subirArchivosSitio}></lightning-input>
                                    </template>
                                </template>
                                <h4 class="mov-seccion seccion-alta">{textoArchivos}</h4>
                                <template if:true={hayArchivos}>
                                    <ul class="mov-archivos">
                                        <template for:each={archivosLista} for:item="a">
                                            <li key={a.id} class="archivo">
                                                <lightning-icon icon-name={a.icono} size="small" alternative-text={a.tipo}></lightning-icon>
                                                <div class="archivo-cuerpo">
                                                    <a href="#" data-id={a.id} onclick={previsualizarArchivo} title="Ver archivo">{a.titulo}</a>
                                                    <div class="sub">{a.detalle}</div>
                                                </div>
                                            </li>
                                        </template>
                                    </ul>
                                </template>
                                <template if:false={hayArchivos}>
                                    <p class="sub">Aún no hay archivos para este asegurado.</p>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cerrar" onclick={cerrarModal}></lightning-button>
                            </div>
                        </template>

                        <!-- Envío de correo a uno o varios asegurados. -->
                        <template if:true={enModalCorreo}>
                            <div class="slds-modal__header"><h2 class="slds-text-heading_medium">Enviar correo</h2></div>
                            <div class="slds-modal__content slds-p-around_medium modal-form">
                                <!-- Pendientes: se envía por solicitud, no a todos. -->
                                <template if:true={correoPorSolicitud}>
                                    <p class="sub slds-m-bottom_x-small">Elige la solicitud: el correo sale solo a sus asegurados pendientes.</p>
                                    <div class="mov-excel-lista slds-m-bottom_small" role="radiogroup" aria-label="Solicitudes">
                                        <template for:each={solicitudesCorreo} for:item="s">
                                            <label key={s.key} class="mov-excel-fecha">
                                                <input type="radio" name="solicitud-correo" data-key={s.key} checked={s.sel} onchange={elegirSolicitudCorreo}
                                                    disabled={correo.enviando} />
                                                <span><strong>{s.titulo}</strong> · {s.detalle}</span>
                                            </label>
                                        </template>
                                    </div>
                                </template>
                                <p class="slds-m-bottom_small">{textoDestinatarios}</p>
                                <template if:true={avisoReenvio}><p class="sub slds-m-bottom_small">{avisoReenvio}</p></template>
                                <lightning-combobox label="Plantilla" placeholder="Selecciona la plantilla" options={plantillas}
                                    value={correo.plantilla} onchange={cambiarPlantilla} required></lightning-combobox>
                                <lightning-input type="checkbox" class="slds-m-top_small" label="Adjuntar los archivos del asegurado"
                                    checked={correo.adjuntar} onchange={cambiarAdjuntar}></lightning-input>
                                <p class="sub slds-m-top_x-small">El correo sale de info@avanzaseguro.com. A los dados de baja siempre se les adjunta su baja (el documento subido o una constancia generada). Al enviarse, el asegurado queda marcado como «Enviado».</p>
                                <template if:true={correo.avance}><p class="slds-m-top_small">{correo.avance}</p></template>
                                <template if:true={hayErroresCorreo}>
                                    <p class="texto-error slds-m-top_small">No se pudo enviar a todos:</p>
                                    <ul class="slds-list_dotted">
                                        <template for:each={erroresCorreo} for:item="er"><li key={er.key}>{er.texto}</li></template>
                                    </ul>
                                </template>
                            </div>
                            <div class="slds-modal__footer">
                                <lightning-button label="Cerrar" onclick={cerrarModal} disabled={correo.enviando}></lightning-button>
                                <lightning-button class="slds-m-left_x-small" variant="brand" label={textoBotonCorreo} icon-name="utility:send"
                                    onclick={enviarCorreos} disabled={sinEnviarCorreo}></lightning-button>
                            </div>
                        </template>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
            </template>
        </div>
    </template>
    <c-otras-polizas></c-otras-polizas>
</template>
