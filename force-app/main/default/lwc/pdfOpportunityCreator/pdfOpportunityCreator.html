<template>
  <lightning-card title="Crear Oportunidad desde PDFs" icon-name="standard:opportunity">
    <div class="slds-p-horizontal_medium slds-p-bottom_medium">
      <!-- Paso de carga -->
      <template lwc:if={showUploadStep}>
        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
          Sube 2 o más PDFs (cotizaciones de distintas aseguradoras para el mismo cliente).
          Los nombres de los archivos deben compartir un prefijo común. La IA leerá los
          documentos y llenará automáticamente el formulario de la oportunidad para que
          lo revises y lo guardes.
        </p>

        <lightning-input
          type="file"
          label="Documentos PDF"
          accept="application/pdf,.pdf"
          multiple
          onchange={handleFileChange}
          disabled={isProcessing}>
        </lightning-input>

        <template lwc:if={hasFiles}>
          <div class="slds-m-top_small">
            <template for:each={fileList} for:item="f">
              <div key={f.name}
                   class="slds-box slds-box_x-small slds-m-bottom_xx-small slds-grid slds-grid_vertical-align-center">
                <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_small"></lightning-icon>
                <span class="slds-truncate" title={f.name}>{f.name}</span>
              </div>
            </template>

            <template lwc:if={sharedPrefix}>
              <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">
                Prefijo común detectado: <b>{sharedPrefix}</b>
              </p>
            </template>
            <template lwc:elseif={prefixWarning}>
              <div class="slds-box slds-theme_warning slds-m-top_x-small slds-text-body_small">
                {prefixWarning}
              </div>
            </template>
          </div>
        </template>

        <div class="slds-m-top_medium">
          <lightning-button
            variant="brand"
            label="Analizar y llenar formulario"
            title="Leer los PDFs y llenar el formulario de la oportunidad"
            onclick={handleContinue}
            disabled={continueDisabled}>
          </lightning-button>
        </div>
      </template>

      <!-- Procesando -->
      <template lwc:if={isProcessing}>
        <div class="slds-align_absolute-center slds-p-around_large slds-is-relative loader-zone">
          <lightning-spinner alternative-text="Procesando" size="medium"></lightning-spinner>
        </div>
        <p class="slds-text-align_center slds-text-body_regular slds-m-top_large">
          {statusMessage}
        </p>
      </template>

      <!-- Error -->
      <template lwc:if={error}>
        <div class="slds-box slds-theme_error slds-m-top_small">
          <lightning-icon icon-name="utility:error" variant="inverse" size="x-small"
                          class="slds-m-right_x-small"></lightning-icon>
          {error}
        </div>
      </template>

      <!-- Posible discrepancia de cliente/vehículo: pedimos confirmación -->
      <template lwc:if={needsConfirm}>
        <div class="slds-box slds-theme_warning slds-m-bottom_medium">
          <p><b>Revisa antes de continuar:</b> {validacionAlerta}</p>
        </div>
        <lightning-button
          variant="brand"
          label="Continuar de todos modos"
          onclick={confirmAndContinue}
          class="slds-m-right_x-small">
        </lightning-button>
        <lightning-button label="Revisar archivos" onclick={cancelValidation}>
        </lightning-button>
      </template>

      <!-- Confirmación: datos enviados al formulario del padre -->
      <template lwc:if={done}>
        <div class="slds-box slds-theme_success slds-m-bottom_medium slds-grid slds-grid_vertical-align-center">
          <lightning-icon icon-name="utility:success" variant="inverse" size="small"
                          class="slds-m-right_small"></lightning-icon>
          <p class="slds-text-heading_small">{doneMessage}</p>
        </div>
        <lightning-button label="Procesar otros PDFs" onclick={handleReset}></lightning-button>
      </template>
    </div>
  </lightning-card>
</template>
