<template>
    <div class="slds-grid slds-wrap slds-gutters_x-small">
        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
            <lightning-input type="date" label="Fecha de recepción" value={fechaRecepcion} data-campo="fechaRecepcion"
                onchange={handleCampo} required></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4">
            <lightning-input type="number" formatter="currency" step="0.01" min="0" label="Monto reclamado" value={monto}
                data-campo="monto" onchange={handleCampo} required></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <lightning-record-picker label="Proveedor (hospital o médico)" object-api-name="Account" placeholder="Buscar cuenta"
                onchange={handleProveedor}></lightning-record-picker>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4">
            <lightning-input label="Referencia de la aseguradora" value={referencia} data-campo="referencia" onchange={handleCampo}
                max-length="255" field-level-help="Número de folio o trámite que da la aseguradora a este reembolso."></lightning-input>
        </div>
        <div class="slds-col slds-size_1-of-1 slds-m-top_x-small">
            <lightning-dual-listbox label="Documentación ingresada" source-label="Por entregar" selected-label="Entregada"
                options={opcionesDocumentacion} value={documentacion} data-campo="documentacion" onchange={handleCampo} size="6"></lightning-dual-listbox>
        </div>
    </div>
</template>
